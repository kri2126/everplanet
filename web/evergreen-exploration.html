    }
    // 로드맵 5 작업 A/B: 걸어서 오를 수 없을 만큼 높은 지형 턱은 막는다. 계단 한 칸(STEP_UP)
    // 정도는 걸어서 자연스럽게 오르고, 그보다 높으면 점프로 현재 높이(atZ)를 올린 뒤에만 지나간다.
    // 깊은 물처럼 높이차와 무관하게 무조건 막히는 지형은 terrainAt().blocked로 따로 처리한다
    // (물은 땅보다 낮아서 "너무 높다" 판정만으로는 못 막기 때문 — §3).
    const terr = terrainAt(z, x, y);
    if (terr.blocked) return true;
    if (terr.top - atZ > STEP_UP) return true;
    return false;
  }

  function tryMove(dx, dy, dist) {
    const nx = player.x + dx * dist, ny = player.y + dy * dist;
    if (!collides(nx, ny)) { player.x = nx; player.y = ny; return; }
    if (dx && !collides(player.x + dx * dist, player.y)) { player.x += dx * dist; return; }
    if (dy && !collides(player.x, player.y + dy * dist)) { player.y += dy * dist; return; }
    const px = -dy, py = dx;
    for (const blend of [0.7, 1]) {
      for (const sign of [1, -1]) {
        const sx = dx * 0.35 + px * sign * blend;
        const sy = dy * 0.35 + py * sign * blend;
        const len = Math.hypot(sx, sy) || 1;
        const cx = player.x + (sx / len) * dist;
        const cy = player.y + (sy / len) * dist;
        if (!collides(cx, cy)) { player.x = cx; player.y = cy; return; }
      }
    }
  }

  function updateExploration() {
    const z = currentZone;
    if (Math.hypot(player.x - z.lastExploreX, player.y - z.lastExploreY) < 25) return;
    z.lastExploreX = player.x; z.lastExploreY = player.y;

    z.fogCtx.beginPath();
    z.fogCtx.arc((player.x - z.GRID_ORIGIN) * z.FOG_SCALE, (player.y - z.GRID_ORIGIN) * z.FOG_SCALE, EXPLORE_R * z.FOG_SCALE, 0, Math.PI * 2);
    z.fogCtx.fill();

    const gx0 = Math.max(0, Math.floor((player.x - EXPLORE_R - z.GRID_ORIGIN) / CELL));
    const gx1 = Math.min(z.GRID_N - 1, Math.floor((player.x + EXPLORE_R - z.GRID_ORIGIN) / CELL));
    const gy0 = Math.max(0, Math.floor((player.y - EXPLORE_R - z.GRID_ORIGIN) / CELL));
    const gy1 = Math.min(z.GRID_N - 1, Math.floor((player.y + EXPLORE_R - z.GRID_ORIGIN) / CELL));
    for (let gy = gy0; gy <= gy1; gy++) {
      for (let gx = gx0; gx <= gx1; gx++) {
        const idx = gy * z.GRID_N + gx;
        if (z.explored[idx]) continue;
        const wx = z.GRID_ORIGIN + (gx + 0.5) * CELL;
        const wy = z.GRID_ORIGIN + (gy + 0.5) * CELL;
        if (Math.hypot(wx, wy) > z.radius) continue;
        if (Math.hypot(wx - player.x, wy - player.y) > EXPLORE_R) continue;
        z.explored[idx] = 1;
        z.exploredCount++;
      }
    }
  }

  function resize() {
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    canvas.viewW = rect.width;
    canvas.viewH = rect.height;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function drawSky(viewW, viewH, t) {
    const grad = ctx.createLinearGradient(0, 0, 0, viewH);
    grad.addColorStop(0, '#5fb6ea');
    grad.addColorStop(0.6, '#bfe3ff');
    grad.addColorStop(1, '#eaf6ff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, viewW, viewH);

    for (const c of currentZone.clouds) {
      const drift = reduceMotion ? 0 : (t * c.speed) % (viewW + c.w * 3);
      const cx = ((c.x * viewW + drift) % (viewW + c.w * 3)) - c.w * 1.5;
      const cy = c.y * viewH;
      ctx.fillStyle = c.tone > 0.5 ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.ellipse(cx, cy, c.w, c.w * 0.4, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - c.w * 0.5, cy + c.w * 0.08, c.w * 0.55, c.w * 0.28, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + c.w * 0.5, cy + c.w * 0.1, c.w * 0.5, c.w * 0.26, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPlanetDome(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, TILT);
    const grad = ctx.createRadialGradient(0, -PLANET_R * 0.1, PLANET_R * 0.08, 0, 0, PLANET_R);
    grad.addColorStop(0, '#7fd48a');
    grad.addColorStop(0.55, '#5fbf5a');
    grad.addColorStop(0.86, '#4aa14f');
    grad.addColorStop(1, '#bfe3ff');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, PLANET_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawMushroom(seed, red) {
    const scale = 0.85 + seed * 0.4;
    const capColor = red ? '#e5433f' : (seed > 0.5 ? '#ff8aa0' : '#ffb454');
    ctx.save();
    ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0, 3, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff4e6';
    ctx.fillRect(-3, -6, 6, 9);
    ctx.strokeStyle = '#8a6a4a';
    ctx.lineWidth = 1;
    ctx.strokeRect(-3, -6, 6, 9);
    ctx.beginPath(); ctx.arc(0, -6, 9, Math.PI, 0);
    ctx.fillStyle = capColor; ctx.fill();
    ctx.strokeStyle = '#7a3a2a';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(-4, -9, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -8, 1.3, 0, Math.PI * 2); ctx.fill();
    if (red) {
      ctx.beginPath(); ctx.arc(0, -3, 1.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // 로드맵 5 작업 F-1/G: 새 장식 오브젝트들 — 전부 decorations 배열의 type으로 구분되고
  // 기존 solids 렌더/정렬/가림 파이프라인(s.d 디스패치)을 그대로 탄다.
  function drawBush(d, t) {
    const sway = reduceMotion ? 0 : Math.sin(t * 1.1 + d.sway) * 0.06;
    const leaf = d.tone > 0.5 ? '#4d9a63' : '#438a57';
    ctx.fillStyle = 'rgba(0,0,0,0.13)';
    ctx.beginPath(); ctx.ellipse(0, 9, 15, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.rotate(sway);
    ctx.fillStyle = leaf;
    ctx.strokeStyle = '#2d5f3f';
    ctx.lineWidth = 1;
    for (const [ox, oy, r] of [[-6, 2, 9], [6, 2, 9], [0, -5, 10], [0, 5, 8]]) {
      ctx.beginPath(); ctx.arc(ox, oy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.arc(-3, -8, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawFlower(d) {
    const petalColors = ['#ffe066', '#ff9f4a', '#ffffff'];
    const idx = d.tone < 0.34 ? 0 : d.tone < 0.67 ? 1 : 2;
    const color = petalColors[idx];
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath(); ctx.ellipse(0, 2, 4, 1.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a7d52';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(0, -3); ctx.stroke();
    ctx.fillStyle = color;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + d.seed * 2;
      ctx.beginPath(); ctx.ellipse(Math.cos(a) * 2.6, -3 + Math.sin(a) * 2.6, 2, 1.3, a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#e8b34a';
    ctx.beginPath(); ctx.arc(0, -3, 1.4, 0, Math.PI * 2); ctx.fill();
  }

  function drawReed(d, t) {
    const sway = reduceMotion ? 0 : Math.sin(t * 1.4 + d.sway) * 0.12;
    ctx.strokeStyle = '#6f9c4a';
    ctx.lineWidth = 1.6;
    ctx.save();
    ctx.rotate(sway);
    ctx.beginPath(); ctx.moveTo(0, 4); ctx.quadraticCurveTo(2, -10, 1, -22); ctx.stroke();
    ctx.fillStyle = '#8a5a3a';
    ctx.beginPath(); ctx.ellipse(1, -23, 1.6, 4, 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawFallenStar(d, t) {
    const tw = reduceMotion ? 1 : 0.75 + Math.sin(t * 2.2 + d.phase) * 0.25;
    // 바닥에 떨어져 박힌 별 — 은은한 광륜 + 위로 뻗는 빛기둥 + 반짝임
    const glow = ctx.createRadialGradient(0, 4, 2, 0, 4, 30);
    glow.addColorStop(0, `rgba(255,244,200,${0.55 * tw})`);
    glow.addColorStop(1, 'rgba(255,244,200,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.ellipse(0, 4, 30, 12, 0, 0, Math.PI * 2); ctx.fill();
    if (!reduceMotion) {
      const beam = ctx.createLinearGradient(0, 2, 0, -70);
      beam.addColorStop(0, `rgba(255,250,220,${0.35 * tw})`);
      beam.addColorStop(1, 'rgba(255,250,220,0)');
      ctx.fillStyle = beam;
      ctx.beginPath();
      ctx.moveTo(-6, 2); ctx.lineTo(6, 2); ctx.lineTo(2, -70); ctx.lineTo(-2, -70); ctx.closePath();
      ctx.fill();
    }
    ctx.save();
    ctx.rotate(t * 0.6 + d.phase);
    ctx.fillStyle = `rgba(255,255,255,${0.9 * tw})`;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
      const a2 = a + Math.PI / 5;
      ctx.lineTo(Math.cos(a) * 9, Math.sin(a) * 9 + 4);
      ctx.lineTo(Math.cos(a2) * 3.6, Math.sin(a2) * 3.6 + 4);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
    if (!reduceMotion) {
      ctx.fillStyle = `rgba(255,255,255,${0.8 * tw})`;
      for (let i = 0; i < 3; i++) {
        const a = t * 1.3 + d.phase + i * 2.1;
        const r = 14 + Math.sin(t * 2 + i) * 4;
        ctx.beginPath(); ctx.arc(Math.cos(a) * r, 4 + Math.sin(a) * r * 0.4, 1.3, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawCow(d, t) {
    const bob = reduceMotion ? 0 : Math.sin(t * 1.5 + d.phase) * 1.2;
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath(); ctx.ellipse(0, 13, 22, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.translate(0, bob);
    ctx.fillStyle = '#f5efe6';
    ctx.strokeStyle = '#6b5a4a';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(0, 4, 19, 11, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3a332e';
    for (const [ox, oy, r] of [[-8, 0, 5], [6, 6, 4]]) {
      ctx.beginPath(); ctx.ellipse(ox, oy, r, r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#f5efe6';
    ctx.strokeStyle = '#6b5a4a';
    ctx.beginPath(); ctx.ellipse(20, -2, 8, 6.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3a332e';
    ctx.beginPath(); ctx.arc(24, -3, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c9847a';
    ctx.beginPath(); ctx.ellipse(26, 1, 2.6, 1.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawHay(d) {
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath(); ctx.ellipse(0, 8, 13, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d8b45c';
    ctx.strokeStyle = '#a4813a';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(140,100,40,0.5)';
    ctx.lineWidth = 0.8;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(-11, i * 3); ctx.lineTo(11, i * 3 + 2); ctx.stroke(); }
  }

  function drawTrough(d) {
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath(); ctx.ellipse(0, 6, 17, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a6a48';
    ctx.strokeStyle = '#5a4530';
    ctx.lineWidth = 1.4;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(-16, -6, 32, 12, 3); ctx.fill(); ctx.stroke(); }
    else { ctx.beginPath(); ctx.rect(-16, -6, 32, 12); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = '#7fb4d8';
    ctx.beginPath(); ctx.ellipse(0, -3, 12, 3, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawFarmRow(d) {
    const len = d.len || 130;
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.beginPath(); ctx.ellipse(0, 4, len / 2 + 4, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7a5a3a';
    ctx.strokeStyle = '#5a4028';
    ctx.lineWidth = 1;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(-len / 2, -4, len, 10, 4); ctx.fill(); ctx.stroke(); }
    else { ctx.beginPath(); ctx.rect(-len / 2, -4, len, 10); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = '#5a9a52';
    const sprouts = Math.round(len / 16);
    for (let i = 0; i < sprouts; i++) {
      const sx = -len / 2 + (i + 0.5) * (len / sprouts);
      const jitter = ((d.seed * 97 + i * 13.7) % 1) * 3 - 1.5;
      ctx.beginPath(); ctx.ellipse(sx, -2 + jitter, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawCart(d) {
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath(); ctx.ellipse(0, 14, 24, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a6438';
    ctx.strokeStyle = '#5a4028';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.rect(-20, -6, 40, 16); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6b4a2a';
    ctx.beginPath(); ctx.arc(-13, 12, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(13, 12, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#d8b45c';
    ctx.strokeStyle = 'rgba(140,100,40,0.5)';
    ctx.beginPath(); ctx.rect(-17, -14, 34, 9); ctx.fill();
    for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(i * 5, -14); ctx.lineTo(i * 5 - 2, -6); ctx.stroke(); }
  }

  function drawScarecrow(d, t) {
    const sway = reduceMotion ? 0 : Math.sin(t * 0.9 + d.phase) * 0.06;
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0, 20, 12, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#7a5230';
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(0, -18); ctx.stroke();
    ctx.save();
    ctx.rotate(sway);
    ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(16, -8); ctx.stroke();
    ctx.fillStyle = '#c79764';
    ctx.beginPath(); ctx.rect(-9, -8, 18, 22); ctx.fill();
    ctx.fillStyle = '#8a6a4a';
    ctx.beginPath(); ctx.rect(-11, -8, 22, 5); ctx.fill();
    ctx.fillStyle = '#e7c88f';
    ctx.beginPath(); ctx.arc(0, -16, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#a4813a';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-7, -20); ctx.lineTo(7, -20); ctx.lineTo(9, -16); ctx.lineTo(-9, -16); ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#5a3a2a';
    ctx.beginPath(); ctx.arc(-2.5, -16, 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(2.5, -16, 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawClothesline(d, t) {
    const sway = reduceMotion ? 0 : Math.sin(t * 1.1 + d.phase) * 3;
    ctx.strokeStyle = '#7a5230';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-26, 20); ctx.lineTo(-26, -22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(26, 20); ctx.lineTo(26, -22); ctx.stroke();
    ctx.strokeStyle = '#9a8a7a';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-26, -22); ctx.quadraticCurveTo(0, -14, 26, -22); ctx.stroke();
    const cloth = ['#e8dcc8', '#c98a6a', '#7fa8c9'];
    for (let i = 0; i < 3; i++) {
      const cx = -17 + i * 17;
      const cy0 = -22 + (cx / 26) * (cx / 26) * 8;
      ctx.save();
      ctx.translate(cx, cy0);
      ctx.rotate(sway * 0.02);
      ctx.fillStyle = cloth[i];
      ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.lineTo(4, 14); ctx.lineTo(-4, 14); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  // 로드맵 5 §4-2/폭포 장식: 마지막으로 미뤄뒀던 광장 소품(착륙 데크·비행정·깃발·등불·
  // 상자·가마솥·부서진 석재·선돌)과 폭포. G와 같은 패턴 — decorations에 type만 붙여 편입.
  function drawLandingDeck(d) {
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0, 10, 58, 20, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b9895a';
    ctx.strokeStyle = '#7a5230';
    ctx.lineWidth = 1.4;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(-56, -18, 112, 36, 6); ctx.fill(); ctx.stroke(); }
    else { ctx.beginPath(); ctx.rect(-56, -18, 112, 36); ctx.fill(); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(122,82,48,0.5)';
    ctx.lineWidth = 1;
    for (let i = -4; i <= 4; i++) { ctx.beginPath(); ctx.moveTo(i * 12, -18); ctx.lineTo(i * 12, 18); ctx.stroke(); }
    ctx.fillStyle = '#8a6438';
    ctx.beginPath(); ctx.rect(-58, -20, 6, 40); ctx.fill();
    ctx.beginPath(); ctx.rect(52, -20, 6, 40); ctx.fill();
  }

  function drawAirship(d, t) {
    const bob = reduceMotion ? 0 : Math.sin(t * 0.9 + d.phase) * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath(); ctx.ellipse(0, 40, 46, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.translate(0, bob);
    // 곤돌라
    ctx.fillStyle = '#8a6438';
    ctx.strokeStyle = '#5a4028';
    ctx.lineWidth = 1.4;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(-26, 10, 52, 20, 6); ctx.fill(); ctx.stroke(); }
    else { ctx.beginPath(); ctx.rect(-26, 10, 52, 20); ctx.fill(); ctx.stroke(); }
    // 계류 로프
    ctx.strokeStyle = '#9a8a7a';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-18, 22); ctx.lineTo(-30, -12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18, 22); ctx.lineTo(30, -12); ctx.stroke();
    // 기구(풍선)
    ctx.fillStyle = '#d8635a';
    ctx.strokeStyle = '#8a3a34';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(0, -18, 34, 26, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath(); ctx.ellipse(-10, -26, 12, 8, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(138,58,52,0.5)';
    ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.ellipse(0, -18, 34, 26, 0, 0, Math.PI * 2); ctx.moveTo(i * 12, -44); ctx.lineTo(i * 12, 8); ctx.stroke(); }
    ctx.restore();
  }

  function drawFlag(d, t) {
    const wave = reduceMotion ? 0 : Math.sin(t * 2 + d.phase) * 0.18;
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath(); ctx.ellipse(0, 30, 8, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#7a5230';
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(0, -40); ctx.stroke();
    ctx.save();
    ctx.translate(0, -38);
    ctx.fillStyle = '#ff8aa0';
    ctx.strokeStyle = '#c65a72';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.quadraticCurveTo(16, -8 + wave * 10, 30, -4);
    ctx.quadraticCurveTo(20, 2, 30, 10);
    ctx.quadraticCurveTo(14, 6 + wave * 10, 0, 10);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawLantern(d, t) {
    const flick = reduceMotion ? 0.85 : 0.7 + Math.sin(t * 5 + d.phase) * 0.15 + Math.sin(t * 11 + d.phase) * 0.08;
    ctx.fillStyle = 'rgba(0,0,0,0.13)';
    ctx.beginPath(); ctx.ellipse(0, 20, 10, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5a4028';
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(0, -6); ctx.stroke();
    const glow = ctx.createRadialGradient(0, -14, 2, 0, -14, 20);
    glow.addColorStop(0, `rgba(255,210,120,${0.5 * flick})`);
    glow.addColorStop(1, 'rgba(255,210,120,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, -14, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a6438';
    ctx.strokeStyle = '#5a4028';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-3, -6); ctx.lineTo(3, -6); ctx.lineTo(5, -22); ctx.lineTo(-5, -22); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = `rgba(255,214,140,${flick})`;
    ctx.beginPath(); ctx.ellipse(0, -14, 5, 6.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8a6438';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, -26); ctx.stroke();
  }

  function drawCrate(d) {
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath(); ctx.ellipse(0, 12, 15, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b9895a';
    ctx.strokeStyle = '#7a5230';
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.rect(-13, -12, 26, 24); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-13, -12); ctx.lineTo(13, 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13, -12); ctx.lineTo(-13, 12); ctx.stroke();
  }

  function drawCauldron(d, t) {
    const flick = reduceMotion ? 0.8 : 0.65 + Math.sin(t * 6 + d.phase) * 0.2;
    ctx.fillStyle = `rgba(255,150,60,${flick * 0.5})`;
    ctx.beginPath(); ctx.moveTo(-8, 8); ctx.quadraticCurveTo(-10, -4, -2, -14); ctx.quadraticCurveTo(2, -6, 0, 0);
    ctx.quadraticCurveTo(6, -8, 8, 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0, 15, 16, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a332e';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-11, 9); ctx.lineTo(-15, 15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(11, 9); ctx.lineTo(15, 15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 11); ctx.lineTo(0, 16); ctx.stroke();
    ctx.fillStyle = '#3a332e';
    ctx.beginPath(); ctx.ellipse(0, 4, 13, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a231e';
    ctx.beginPath(); ctx.ellipse(0, 1, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawRubble(d) {
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath(); ctx.ellipse(0, 6, 20, 6, 0, 0, Math.PI * 2); ctx.fill();
    const stones = [[-10, 2, 9, 0.2], [6, 4, 11, -0.15], [-2, -4, 7, 0.4]];
    for (const [ox, oy, r, rot] of stones) {
      ctx.save();
      ctx.translate(ox, oy);
      ctx.rotate(rot);
      ctx.fillStyle = d.tone > 0.5 ? '#a89a88' : '#948578';
      ctx.strokeStyle = '#6b5f52';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-r, r * 0.4); ctx.lineTo(-r * 0.3, -r * 0.7); ctx.lineTo(r * 0.6, -r * 0.4); ctx.lineTo(r, r * 0.5); ctx.lineTo(0, r); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  function drawStandingStone(d) {
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0, 26, 13, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8f8698';
    ctx.strokeStyle = '#5f5768';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-11, 24); ctx.lineTo(-9, -30); ctx.lineTo(-3, -42); ctx.lineTo(3, -42); ctx.lineTo(9, -30); ctx.lineTo(11, 24);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.beginPath(); ctx.moveTo(-7, 18); ctx.lineTo(-6, -26); ctx.lineTo(-2, -34); ctx.lineTo(-4, -20); ctx.lineTo(-5, 18); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(95,87,104,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(8, -8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-9, 8); ctx.lineTo(7, 5); ctx.stroke();
  }

  function drawWaterfall(d, t) {
    const flow = reduceMotion ? 0 : t;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.ellipse(0, 8, 26, 9, 0, 0, Math.PI * 2); ctx.fill();
    const grad = ctx.createLinearGradient(0, -70, 0, 6);
    grad.addColorStop(0, 'rgba(180,225,245,0.05)');
    grad.addColorStop(0.5, 'rgba(200,235,250,0.5)');
    grad.addColorStop(1, 'rgba(230,248,255,0.75)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-16, -70); ctx.lineTo(16, -70); ctx.lineTo(20, 6); ctx.lineTo(-20, 6); ctx.closePath();
    ctx.fill();
    if (!reduceMotion) {
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 4; i++) {
        const ox = -12 + i * 8;
        const off = ((flow * 60 + i * 17) % 76);
        ctx.beginPath(); ctx.moveTo(ox, -70 + off - 20); ctx.lineTo(ox + 2, -70 + off); ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI + (reduceMotion ? 0 : t * 0.7);
      ctx.beginPath(); ctx.ellipse(Math.cos(a) * 16, 6 + Math.sin(a) * 3, 4, 2.4, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawFence(angle) {
    ctx.save();
    ctx.rotate(angle);
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath(); ctx.ellipse(0, 8, 22, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#7a5230';
    ctx.lineWidth = 1.2;
    ctx.fillStyle = '#a97a4a';
    ctx.beginPath(); ctx.rect(-16, -10, 5, 20); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.rect(11, -10, 5, 20); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#c79764';
    ctx.beginPath(); ctx.rect(-18, -6, 36, 5); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.rect(-18, 2, 36, 5); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawSignpost() {
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath(); ctx.ellipse(0, 10, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a97a4a';
    ctx.fillRect(-4, -34, 8, 44);
    ctx.fillStyle = '#e7c88f';
    ctx.beginPath();
    ctx.moveTo(-30, -40); ctx.lineTo(30, -40); ctx.lineTo(30, -14); ctx.lineTo(-30, -14); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#a97a4a';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#7a5230';
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', 0, -27);
  }

  function drawSpring(spring) {
    ctx.fillStyle = '#c9a86a';
    ctx.beginPath(); ctx.ellipse(0, 6, spring.radius * 1.1, spring.radius * 0.76, 0, 0, Math.PI * 2); ctx.fill();
    const waterGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, spring.radius);
    waterGrad.addColorStop(0, '#dff7ff'); waterGrad.addColorStop(1, '#6ec6e8');
    ctx.fillStyle = waterGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, spring.radius * 0.9, spring.radius * 0.62, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c7c1d6';
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * spring.radius * 0.95, Math.sin(a) * spring.radius * 0.66, 8, 6, a, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 로드맵 5 작업 F-2: "여러 겹의 비늘처럼" 겹쳐지는 나무 캐노피 — 잎을 낱장으로 그리는
  // 대신, 톱니(스캘럽) 진 원형 덩어리를 겹으로 쌓아 저렴하게 근사한다. lobes개의 돌기가
  // 바깥/안쪽 반지름을 오가며 스캘럽 윤곽을 만든다.
  function drawLeafLayer(cy, R, lobes, fillColor) {
    ctx.fillStyle = fillColor;
    ctx.beginPath();
    for (let i = 0; i < lobes * 2; i++) {
      const a = (i / (lobes * 2)) * Math.PI * 2;
      const r = (i % 2 === 0) ? R : R * 0.82;
      const x = Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.92;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  function drawTree(o, t) {
    const sway = reduceMotion ? 0 : Math.sin(t * 1.2 + o.sway) * 0.05;
    const R = o.radius;
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath(); ctx.ellipse(0, R * 0.55, R * 0.9, R * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b98452';
    ctx.strokeStyle = '#7a5230';
    ctx.lineWidth = Math.max(1, R * 0.05);
    ctx.beginPath();
    // 로드맵 5 작업 F-2: 기둥 길이 1.4배(밑동이 눈에 보이게) — 위쪽은 그대로 캐노피에 가려짐
    const trunkH = R * 0.75 * 1.4;
    if (ctx.roundRect) { ctx.roundRect(-R * 0.14, -R * 0.1, R * 0.28, trunkH, R * 0.06); }
    else { ctx.rect(-R * 0.14, -R * 0.1, R * 0.28, trunkH); }
    ctx.fill(); ctx.stroke();
    ctx.save();
    ctx.translate(0, -R * 0.5);
    ctx.rotate(sway);
    // 로드맵 5 작업 F-2: 새 잎 색(더 짙은 상록수 톤) — 층마다 두 색을 번갈아 4~5겹 쌓는다
    const leafA = '#4aa86b', leafB = '#3d8f59';
    ctx.strokeStyle = '#2d5f3f';
    ctx.lineWidth = Math.max(1, R * 0.04);
    ctx.lineJoin = 'round';
    const layers = o.tone > 0.5 ? 5 : 4;
    for (let i = 0; i < layers; i++) {
      const frac = i / (layers - 1); // 0(아래, 넓게) → 1(위, 좁게)
      const layerR = R * (1.0 - frac * 0.52);
      const layerY = R * (0.3 - frac * 0.95);
      const color = i % 2 === 0 ? leafA : leafB;
      drawLeafLayer(layerY, layerR, 6, color);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.arc(-R * 0.26, -R * 0.5, R * 0.26, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawStone(o) {
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath(); ctx.ellipse(0, o.radius * 0.5, o.radius * 0.9, o.radius * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = o.tone > 0.5 ? '#cdc6dd' : '#b9aec2';
    ctx.strokeStyle = '#7d7488';
    ctx.lineWidth = Math.max(1, o.radius * 0.08);
    ctx.beginPath(); ctx.ellipse(0, 0, o.radius, o.radius * 0.82, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.ellipse(-o.radius * 0.32, -o.radius * 0.3, o.radius * 0.32, o.radius * 0.2, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawGroundShadow(rx) {
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath(); ctx.ellipse(0, 6, rx, rx * 0.32, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawBigTree(t) {
    const sway = reduceMotion ? 0 : Math.sin(t * 0.8) * 0.03;
    drawGroundShadow(62);
    ctx.strokeStyle = '#6b4423';
    ctx.lineWidth = 2.4;
    ctx.lineJoin = 'round';
    ctx.fillStyle = '#a9743f';
    ctx.beginPath();
    ctx.moveTo(-17, 8); ctx.lineTo(-10, -58); ctx.lineTo(10, -58); ctx.lineTo(17, 8);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(4, -58, 8, 66);
    ctx.save();
    ctx.translate(0, -62);
    ctx.rotate(sway);
    ctx.strokeStyle = '#2d5f3f';
    ctx.lineWidth = 2.2;
    ctx.fillStyle = '#3f9a63';
    ctx.beginPath(); ctx.ellipse(0, 0, 66, 40, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-34, -22, 38, 27, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(32, -20, 34, 25, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#56b87a';
    ctx.beginPath(); ctx.ellipse(-6, -34, 40, 26, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.26)';
    ctx.beginPath(); ctx.ellipse(-24, -44, 20, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawRockPeak() {
    drawGroundShadow(64);
    ctx.strokeStyle = '#6d6478';
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.fillStyle = '#9c90ad';
    ctx.beginPath();
    ctx.moveTo(-58, 8); ctx.lineTo(-22, -68); ctx.lineTo(6, -34); ctx.lineTo(26, -96);
    ctx.lineTo(60, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#b9aec2';
    ctx.beginPath();
    ctx.moveTo(26, -96); ctx.lineTo(60, 8); ctx.lineTo(18, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(26, -96); ctx.lineTo(38, -62); ctx.lineTo(14, -62); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-22, -68); ctx.lineTo(-10, -44); ctx.lineTo(-33, -44); ctx.closePath(); ctx.fill();
  }

  function drawRuins() {
    drawGroundShadow(58);
    ctx.fillStyle = '#c7b795';
    ctx.beginPath(); ctx.ellipse(0, 4, 54, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8f8262';
    ctx.lineWidth = 2;
    const cols = [[-38, 52], [-12, 74], [16, 38], [40, 62]];
    for (const [x, h] of cols) {
      ctx.fillStyle = '#e0d2b2';
      ctx.beginPath(); ctx.rect(x - 9, -h, 18, h); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.13)';
      ctx.fillRect(x + 3, -h, 6, h);
      ctx.fillStyle = '#d8c9a8';
      ctx.beginPath(); ctx.ellipse(x, -h, 13, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#d8c9a8';
    ctx.beginPath(); ctx.rect(-46, -80, 46, 9); ctx.fill(); ctx.stroke();
  }

  function drawCrystal(t) {
    const pulse = reduceMotion ? 0.5 : (Math.sin(t * 1.5) + 1) / 2;
    drawGroundShadow(40);
    ctx.save();
    ctx.globalAlpha *= 0.28 + pulse * 0.3;
    const glow = ctx.createRadialGradient(0, -52, 4, 0, -52, 62);
    glow.addColorStop(0, '#f0ddff'); glow.addColorStop(1, 'rgba(199,155,240,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, -52, 62, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#8452b8';
    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    const shards = [[0, -104, 17], [-24, -62, 12], [22, -70, 13]];
    for (const [x, top, w] of shards) {
      ctx.fillStyle = '#b87fe6';
      ctx.beginPath();
      ctx.moveTo(x, top); ctx.lineTo(x + w, top * 0.36); ctx.lineTo(x, 8); ctx.lineTo(x - w, top * 0.36);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.42)';
      ctx.beginPath();
      ctx.moveTo(x, top); ctx.lineTo(x + w, top * 0.36); ctx.lineTo(x, top * 0.36);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawCaveEntrance(t) {
    drawGroundShadow(60);
    ctx.strokeStyle = '#4a4552';
    ctx.lineWidth = 2.4;
    ctx.lineJoin = 'round';
    ctx.fillStyle = '#7d7488';
    ctx.beginPath();
    ctx.moveTo(-52, 10); ctx.lineTo(-46, -50); ctx.quadraticCurveTo(-40, -92, 0, -96);
    ctx.quadraticCurveTo(40, -92, 46, -50); ctx.lineTo(52, 10); ctx.closePath();
    ctx.fill(); ctx.stroke();
    const glow = reduceMotion ? 0.5 : (Math.sin(t * 1.2) + 1) / 2;
    const mouth = ctx.createRadialGradient(0, -20, 4, 0, -20, 46);
    mouth.addColorStop(0, `rgba(60,40,80,${0.5 + glow * 0.15})`);
    mouth.addColorStop(1, '#0d0a14');
    ctx.fillStyle = mouth;
    ctx.beginPath();
    ctx.moveTo(-30, 10); ctx.lineTo(-26, -40); ctx.quadraticCurveTo(-22, -68, 0, -70);
    ctx.quadraticCurveTo(22, -68, 26, -40); ctx.lineTo(30, 10); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(-30, -60, 10, 20, 0.3, 0, Math.PI * 2); ctx.fill();
  }

  function drawLandmarkBody(lm, t) {
    if (lm.id === 'tree') drawBigTree(t);
    else if (lm.id === 'rock') drawRockPeak();
    else if (lm.id === 'ruins') drawRuins();
    else if (lm.id === 'crystal') drawCrystal(t);
    else if (lm.id === 'cave') drawCaveEntrance(t);
  }

  function drawPortalBody(t, locked) {
    drawGroundShadow(46);
    ctx.fillStyle = locked ? '#7a7178' : '#8f8296';
    ctx.beginPath();
    ctx.moveTo(-30, 8); ctx.lineTo(-30, -70);
    ctx.quadraticCurveTo(-30, -96, 0, -96);
    ctx.quadraticCurveTo(30, -96, 30, -70); ctx.lineTo(30, 8);
    ctx.lineTo(18, 8); ctx.lineTo(18, -68);
    ctx.quadraticCurveTo(18, -84, 0, -84);
    ctx.quadraticCurveTo(-18, -84, -18, -68); ctx.lineTo(-18, 8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.moveTo(-30, -70); ctx.quadraticCurveTo(-30, -96, 0, -96);
    ctx.lineTo(0, -84); ctx.quadraticCurveTo(-18, -84, -18, -68); ctx.closePath(); ctx.fill();

    const spin = reduceMotion || locked ? 0 : t * 1.4;
    const pulse = reduceMotion ? 0.6 : (Math.sin(t * 2) + 1) / 2;
    ctx.save();
    ctx.translate(0, -46);
    ctx.rotate(spin);
    const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 32);
    if (locked) {
      grad.addColorStop(0, '#cfc9cf');
      grad.addColorStop(0.5, '#8b8590');
      grad.addColorStop(1, 'rgba(139,133,144,0)');
      ctx.globalAlpha *= 0.4;
    } else {
      grad.addColorStop(0, '#fff2ff');
      grad.addColorStop(0.5, '#c79bf0');
      grad.addColorStop(1, 'rgba(199,155,240,0)');
      ctx.globalAlpha *= 0.65 + pulse * 0.3;
    }
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(0, 0, 30, 32, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (locked) {
      ctx.save();
      ctx.translate(0, -46);
      ctx.font = '600 15px "Gowun Dodum", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(40,34,30,0.55)';
      ctx.fillText('🔒', 0, 2);
      ctx.restore();
    }
  }

  function drawPathTile(tone, angle) {
    ctx.save();
    ctx.rotate(angle);
    ctx.fillStyle = tone === 0 ? '#cbb98f' : '#bfa97c';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(-30, -68, 60, 70, 8) : ctx.rect(-30, -68, 60, 70);
    ctx.fill();
    ctx.restore();
  }

  // ── 로드맵 5 작업 B/C: 물·단구 도형 그리기 ─────────────────────────
  // 색만으로 종류를 구분한다(절벽 옆면 줄무늬·폭포 등 세부 장식은 다음 단계 과제).
  function terrainShapeStyle(kind) {
    switch (kind) {
      case 'water-deep':    return { fill: 'rgba(28,66,126,0.82)',  stroke: 'rgba(255,255,255,0.32)', strokeW: 2 };
      case 'water-shallow': return { fill: 'rgba(140,205,225,0.55)', stroke: 'rgba(255,255,255,0.4)',  strokeW: 1.4 };
      case 'cliff':         return { fill: 'rgba(184,141,84,0.5)',  stroke: 'rgba(122,88,48,0.65)',   strokeW: 2.4 };
      case 'bridge':        return { fill: 'rgba(196,158,110,0.85)', stroke: 'rgba(120,86,48,0.8)',   strokeW: 2 };
      case 'stairs':        return { fill: 'rgba(210,196,168,0.75)', stroke: 'rgba(150,130,95,0.7)',  strokeW: 1.6 };
      case 'slope':         return { fill: 'rgba(150,190,120,0.2)',  stroke: null };
      default:               return { fill: 'rgba(150,190,120,0.32)', stroke: 'rgba(110,150,85,0.45)', strokeW: 1.4 };
    }
  }

  // 도형의 월드 경계를 전부 투영해서 화면 폴리곤으로 채운다. 경계점 중 하나라도
  // 지평선 밖(투영 실패)이면 이번 프레임은 건너뛴다 — 일그러진 폴리곤보다 낫다.
  function drawTerrainShape(p, cx, cy) {
    const worldPts = shapeBoundaryPoints(p, p.shape === 'circle' ? 20 : 12);
    const screenPts = [];
    for (const wp of worldPts) {
      const sp = project(wp.x, wp.y);
      if (!sp) return;
      screenPts.push(sp);
    }
    if (screenPts.length < 3) return;
    ctx.beginPath();
    ctx.moveTo(cx + screenPts[0].sx, cy + screenPts[0].sy);
    for (let i = 1; i < screenPts.length; i++) ctx.lineTo(cx + screenPts[i].sx, cy + screenPts[i].sy);
    ctx.closePath();
    const style = terrainShapeStyle(p.kind);
    ctx.fillStyle = style.fill;
    ctx.fill();
    if (style.stroke) {
      ctx.strokeStyle = style.stroke;
      ctx.lineWidth = style.strokeW || 2;
      ctx.stroke();
    }
  }

  function drawPlayer(t, moving, z) {
    const bob = reduceMotion || !moving ? 0 : Math.sin(t * 9) * 1.6;
    // z(점프 높이)는 project()의 거리 계산과 무관한 순수 스크린-Y 오프셋이다 — 화면 위로
    // 띄우기만 할 뿐 지평선/거리 연산에는 전혀 관여하지 않는다.
    ctx.save();
    ctx.translate(0, bob - (z || 0));

    ctx.fillStyle = 'rgba(60,40,30,0.22)';
    ctx.beginPath(); ctx.ellipse(0, PLAYER_RADIUS * 0.9, PLAYER_RADIUS * 0.85, PLAYER_RADIUS * 0.32, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#4fb787';
    ctx.beginPath(); ctx.ellipse(0, PLAYER_RADIUS * 0.55, PLAYER_RADIUS * 0.62, PLAYER_RADIUS * 0.5, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#3f8f66';
    ctx.beginPath(); ctx.ellipse(-PLAYER_RADIUS * 0.28, PLAYER_RADIUS * 0.98, 5, 3.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(PLAYER_RADIUS * 0.28, PLAYER_RADIUS * 0.98, 5, 3.4, 0, 0, Math.PI * 2); ctx.fill();

    const headGrad = ctx.createRadialGradient(-5, -8, 3, 0, -2, PLAYER_RADIUS + 4);
    headGrad.addColorStop(0, '#ffe9d2'); headGrad.addColorStop(1, '#ffd9b8');
    ctx.fillStyle = headGrad;
    ctx.beginPath(); ctx.arc(0, -PLAYER_RADIUS * 0.35, PLAYER_RADIUS, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(140,100,60,0.35)'; ctx.lineWidth = 1.4; ctx.stroke();

    ctx.fillStyle = '#8a5a3a';
    ctx.beginPath(); ctx.arc(0, -PLAYER_RADIUS * 0.9, PLAYER_RADIUS * 0.92, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();

    const eyeOffX = player.facing.x * 1.6, eyeOffY = player.facing.y * 1.2;
    ctx.fillStyle = '#4a3324';
    ctx.beginPath(); ctx.arc(-4 + eyeOffX, -PLAYER_RADIUS * 0.38 + eyeOffY, 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4 + eyeOffX, -PLAYER_RADIUS * 0.38 + eyeOffY, 1.7, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'rgba(255,140,150,0.55)';
    ctx.beginPath(); ctx.ellipse(-PLAYER_RADIUS * 0.55, -PLAYER_RADIUS * 0.18, 2.6, 1.7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(PLAYER_RADIUS * 0.55, -PLAYER_RADIUS * 0.18, 2.6, 1.7, 0, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#8a5a3a'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(0, -PLAYER_RADIUS * 0.28, 3.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();

    ctx.restore();
  }

  // 나무/랜드마크처럼 큰 오브젝트에 가려졌을 때, 플레이어가 대략 어디 있는지 보여주는
  // 점선 테두리. 실제 스프라이트 대신 단순한 캡슐 윤곽만 그려서 "숨겨졌다"는 게 분명히 읽히게 한다.
  // occluder가 주어지면 그 오브젝트의 대략적인 화면 범위(reach 박스)로 클립해서,
  // 실제로 가려진 부분에만 점선이 그려지고 캐릭터가 튀어나온 부분은 점선이 안 보이게 한다.
  function drawPlayerOutline(occluder) {
    ctx.save();
    if (occluder) {
      const { sx, sy, scale, reach } = occluder;
      const rx = Math.max(reach.w * scale, 1);
      const ry = Math.max((reach.upH + reach.downH) / 2 * scale, 1);
      const ccy = sy + (reach.downH - reach.upH) / 2 * scale;
      ctx.beginPath();
      ctx.ellipse(sx, ccy, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();
    }
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = 'rgba(255,138,160,0.18)';
    ctx.strokeStyle = 'rgba(255,138,160,0.95)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.ellipse(0, PLAYER_RADIUS * 0.45, PLAYER_RADIUS * 0.9, PLAYER_RADIUS * 1.25, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,138,160,0.95)';
    ctx.beginPath(); ctx.arc(0, -PLAYER_RADIUS * 0.45, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // 오브젝트별로 플레이어를 가릴 수 있는 대략적인 화면상 폭/위쪽/아래쪽 범위(로컬, 미스케일).
  // 각 draw*Body 함수가 실제로 그리는 모양을 대략 감싸는 값으로, 픽셀 단위로 정확할 필요는 없다.
  const LM_REACH = {
    tree:    { w: 72, upH: 115, downH: 30 },
    rock:    { w: 64, upH: 100, downH: 14 },
    ruins:   { w: 56, upH: 88,  downH: 24 },
    crystal: { w: 46, upH: 118, downH: 20 },
    cave:    { w: 58, upH: 96,  downH: 14 },
  };
  // 로드맵 5 작업 E/F/G: decorations 타입별 가림 범위 — 기본값(버섯 크기)에서 벗어나는
  // 것만 여기 적는다. 장식이라 낮은 것들(꽃/농경지 이랑/갈대)은 null로 둬 가림 판정에서 제외.
  const D_REACH = {
    star:  { w: 20, upH: 60, downH: 6 },
    bush:  { w: 22, upH: 24, downH: 10 },
    flower: null,
    reed:  { w: 6, upH: 20, downH: 4 },
    cow:   { w: 34, upH: 36, downH: 14 },
    hay:   { w: 16, upH: 14, downH: 8 },
    trough: { w: 20, upH: 12, downH: 8 },
    farmRow: null,
    cart:  { w: 30, upH: 26, downH: 12 },
    scarecrow: { w: 20, upH: 40, downH: 10 },
    clothesline: { w: 26, upH: 30, downH: 8 },
    fence: null,
    landingDeck: null,
    airship: { w: 40, upH: 60, downH: 16 },
    flag: { w: 12, upH: 48, downH: 16 },
    lantern: { w: 12, upH: 30, downH: 10 },
    crate: { w: 16, upH: 20, downH: 8 },
    cauldron: { w: 18, upH: 20, downH: 10 },
    rubble: null,
    standingStone: { w: 14, upH: 46, downH: 12 },
    waterfall: { w: 24, upH: 70, downH: 6 },
  };
  function objectReach(s) {
    if (s.o) {
      const r = s.o.radius;
      return s.o.type === 'tree'
        ? { w: r * 1.15, upH: r * 1.6, downH: r * 0.9 }
        : { w: r * 1.0,  upH: r * 0.9, downH: r * 0.85 };
    }
    if (s.lm) return LM_REACH[s.lm.id] || { w: 50, upH: 90, downH: 20 };
    if (s.portal) return { w: 34, upH: 100, downH: 12 };
    if (s.sign) return { w: 32, upH: 44, downH: 16 };
    if (s.d) {
      const type = s.d.type || 'mushroom';
      if (type in D_REACH) return D_REACH[type];
      return { w: 13, upH: 16, downH: 8 };
    }
    return null; // spring, fence — 플레이어를 가릴 만큼 높지 않음
  }

  function drawProjected(cx, cy, x, y, drawFn) {
    const p = project(x, y);
    if (!p) return null;
    const fade = Math.min(1, p.scale / 0.22);
    ctx.save();
    ctx.translate(cx + p.sx, cy + p.sy);
    ctx.scale(p.scale, p.scale);
    ctx.globalAlpha = fade;
    drawFn();
    ctx.restore();
    return p;
  }

  function mapMarker(mx, my, tint, size) {
    ctx.fillStyle = tint;
    ctx.strokeStyle = 'rgba(255,250,242,0.95)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(mx, my - size); ctx.lineTo(mx + size, my);
    ctx.lineTo(mx, my + size); ctx.lineTo(mx - size, my);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  // 로드맵 5 작업 B: 미니맵/구역 지도용 물·단구 실루엣. toMapX/toMapY는 원점 기준
  // 단순 축척이라(플레이어 위치와 무관) 지평선 컬링 없이 항상 그릴 수 있다.
  function drawMapTerrainSilhouette(p, toMapX, toMapY) {
    const worldPts = shapeBoundaryPoints(p, p.shape === 'circle' ? 16 : 10);
    if (worldPts.length < 3) return;
    ctx.beginPath();
    ctx.moveTo(toMapX(worldPts[0].x), toMapY(worldPts[0].y));
    for (let i = 1; i < worldPts.length; i++) ctx.lineTo(toMapX(worldPts[i].x), toMapY(worldPts[i].y));
    ctx.closePath();
    ctx.fillStyle = p.kind === 'water-deep' ? 'rgba(40,90,150,0.9)'
      : p.kind === 'water-shallow' ? 'rgba(120,190,215,0.85)'
      : 'rgba(196,158,110,0.75)'; // 절벽·다리·돌계단·단구·비탈은 전부 황토 계열 한 색
    ctx.fill();
  }

  function drawMapCircle(cx, cy, R, isFull, t) {
    const z = currentZone;
    const toMapX = (wx) => cx + (wx / z.radius) * R;
    const toMapY = (wy) => cy + (wy / z.radius) * R;

    ctx.save();

    // 나무 테 바탕 — 그림자 + 살짝 큰 원으로 액자 느낌
    ctx.save();
    ctx.shadowColor = 'rgba(50,34,18,0.45)';
    ctx.shadowBlur = isFull ? 18 : 9;
    ctx.shadowOffsetY = isFull ? 6 : 3;
    ctx.beginPath(); ctx.arc(cx, cy, R + (isFull ? 5 : 3.5), 0, Math.PI * 2);
    ctx.fillStyle = '#c99354';
    ctx.fill();
    ctx.restore();

    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(64,46,32,0.92)';
    ctx.fill();

    ctx.save();
    ctx.clip();
    ctx.drawImage(z.fogCanvas, cx - R, cy - R, R * 2, R * 2);
    // 로드맵 5 작업 B: 물/단구 실루엣을 fog 위에, 단 이미 탐험한 자리에만 보이게
    // source-atop으로 합성한다 — "걸어서 드러난 만큼만 보인다"는 원칙은 그대로 둔다
    ctx.globalCompositeOperation = 'source-atop';
    for (const p of z.plateaus) drawMapTerrainSilhouette(p, toMapX, toMapY);
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    // 나무 테 — 이중 링 (전경도 명판과 같은 톤)
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = '#e8c48b';
    ctx.lineWidth = isFull ? 4.5 : 3;
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, R - (isFull ? 3 : 2), 0, Math.PI * 2);
    ctx.strokeStyle = '#a97a4a';
    ctx.lineWidth = isFull ? 2 : 1.4;
    ctx.stroke();

    for (const lm of z.landmarks) {
      if (!lm.found) continue;
      const mx = toMapX(lm.x), my = toMapY(lm.y);
      mapMarker(mx, my, lm.tint, isFull ? 7 : 4.5);
      if (isFull) {
        ctx.font = '600 13px "Gowun Dodum", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(40,34,30,0.85)';
        ctx.strokeText(lm.name, mx, my - 14);
        ctx.fillStyle = '#fffaf2';
        ctx.fillText(lm.name, mx, my - 14);
      }
    }

    if (z.portal) {
      const locked = isPortalLocked(z);
      const mx = toMapX(z.portal.x), my = toMapY(z.portal.y);
      mapMarker(mx, my, locked ? '#9c94a0' : '#c79bf0', isFull ? 8 : 5);
      if (isFull) {
        ctx.font = '600 13px "Gowun Dodum", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(40,34,30,0.85)';
        const label = locked ? '포탈 🔒' : '포탈';
        ctx.strokeText(label, mx, my - 15);
        ctx.fillStyle = locked ? '#d8d2db' : '#fffaf2';
        ctx.fillText(label, mx, my - 15);
      }
    }

    const px = toMapX(player.x), py = toMapY(player.y);
    const fa = Math.atan2(player.facing.y, player.facing.x);
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(fa);
    ctx.fillStyle = '#ff8aa0';
    ctx.beginPath();
    const s = isFull ? 11 : 7;
    ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, s * 0.62); ctx.lineTo(-s * 0.7, -s * 0.62);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,250,242,0.95)'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  function drawMinimap(viewW, viewH, t) {
    const size = viewW < 620 ? 96 : 138;
    const margin = viewW < 620 ? 12 : 16;
    const R = size / 2;
    const cx = viewW - margin - R;
    const cy = margin + R;
    minimapHit = { cx, cy, r: R + 8 };
    drawMapCircle(cx, cy, R, false, t);

    // 현재 위치한 맵 이름 — "맵N · 이름" (지금은 전부 맵1 별내림 천문대)
    const mapLabel = !currentZone.mapNo ? currentZone.name
      : currentZone.name === `맵${currentZone.mapNo}` ? currentZone.name
      : `맵${currentZone.mapNo} · ${currentZone.name}`;
    ctx.font = '700 11px "Gowun Dodum", sans-serif';
    const nameW = ctx.measureText(mapLabel).width + 16;
    const nameY = cy + R + 5;
    roundRectPath(cx - nameW / 2, nameY, nameW, 18, 9);
    const ng = ctx.createLinearGradient(0, nameY, 0, nameY + 18);
    ng.addColorStop(0, '#fdf4de'); ng.addColorStop(1, '#f2e0bb');
    ctx.fillStyle = ng; ctx.fill();
    ctx.strokeStyle = '#c9a877'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#3a2412';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(mapLabel, cx, nameY + 9.5);

    // "M 지도" 안내 — 조작 칩과 같은 작은 나무 팻말
    const mLabel = isTouch ? '탭 · 지도' : 'M  지도';
    ctx.font = '600 10px "JetBrains Mono", monospace';
    const mw = ctx.measureText(mLabel).width + 14;
    const mY = nameY + 18 + 4;
    roundRectPath(cx - mw / 2, mY, mw, 16, 6);
    const mg = ctx.createLinearGradient(0, mY, 0, mY + 16);
    mg.addColorStop(0, '#e8c48b'); mg.addColorStop(1, '#c99354');
    ctx.fillStyle = mg; ctx.fill();
    ctx.strokeStyle = '#a97a4a'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#3a2412';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(mLabel, cx, mY + 8.5);

    const z = currentZone;
    if (z.landmarks.length > 0) {
      const locked = isPortalLocked(z);
      const questY = mY + 16 + 5;
      const label = `★ 랜드마크 ${z.foundCount}/${z.landmarks.length}`;
      ctx.font = '700 11px "Gowun Dodum", sans-serif';
      const w = ctx.measureText(label).width + 16;
      roundRectPath(cx - w / 2, questY, w, 18, 9);
      const qg = ctx.createLinearGradient(0, questY, 0, questY + 18);
      qg.addColorStop(0, '#fdf4de'); qg.addColorStop(1, '#f2e0bb');
      ctx.fillStyle = qg; ctx.fill();
      ctx.strokeStyle = '#c9a877'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = z.foundCount === z.landmarks.length ? '#2f8f52' : '#b8720f';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, cx, questY + 9.5);
      if (z.portal) {
        const ptxt = locked ? '포탈 잠김 🔒' : '포탈 열림';
        ctx.font = '600 9px "JetBrains Mono", monospace';
        const pw = ctx.measureText(ptxt).width + 12;
        const pY = questY + 18 + 3;
        roundRectPath(cx - pw / 2, pY, pw, 15, 7);
        ctx.fillStyle = locked ? 'rgba(205,196,184,0.9)' : 'rgba(222,248,230,0.94)';
        ctx.fill();
        ctx.strokeStyle = locked ? 'rgba(120,105,90,0.6)' : '#8fd6a6';
        ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = locked ? '#6b5c4a' : '#237a46';
        ctx.textBaseline = 'middle';
        ctx.fillText(ptxt, cx, pY + 7.5);
      }
    }
  }

  // ── 월드맵 (M 두 번) ──────────────────────────────────────────────
  // 원작 에버그린 월드맵을 참고한 그림책풍 전경도.
  // 8개 지역을 원작 진행 순서대로 잇고, 각 지역의 구현 상태를 함께 보여준다.
  // status: 'current'(지금 여기) | 'done'(구현 완료) | 'planned'(예정)
  const WORLD_AREAS = [
    { n: 1, name: '별내림 천문대', x: 0.17, y: 0.76, status: 'current', desc: '시작 지점' },
    { n: 2, name: '겸손한 사원',   x: 0.12, y: 0.52, status: 'planned', desc: '옛 유적지' },
    { n: 3, name: '붙박이 야영지', x: 0.25, y: 0.30, status: 'planned', desc: '첫 마을' },
    { n: 4, name: '늘 푸른 강가',  x: 0.46, y: 0.19, status: 'planned', desc: '강가 들판' },
    { n: 5, name: '뮤렌 습지대',   x: 0.66, y: 0.24, status: 'planned', desc: '세계수 습지' },
    { n: 6, name: '해안 벌목지',   x: 0.83, y: 0.42, status: 'planned', desc: '간척지' },
    { n: 7, name: '에버그린 항구', x: 0.78, y: 0.64, status: 'planned', desc: '거점 · 포탈' },
    { n: 8, name: '지붕 없는 동굴', x: 0.50, y: 0.74, status: 'planned', desc: '던전' }
  ];

  let worldMapHit = null;

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 결정적 잡음 — 섬 윤곽이 매 프레임 흔들리지 않도록
  function wob(i) {
    const s = Math.sin(i * 127.1) * 43758.5453;
    return s - Math.floor(s);
  }

  function drawCloudPuff(cx, cy, r, alpha) {
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(cx, cy, r, r * 0.62, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - r * 0.62, cy + r * 0.12, r * 0.60, r * 0.44, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + r * 0.64, cy + r * 0.14, r * 0.56, r * 0.40, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawIslandBlob(ix, iy, iw, ih) {
    const cx = ix + iw / 2, cy = iy + ih / 2;
    const N = 22;
    const pts = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      const rr = 0.90 + wob(i) * 0.12;
      pts.push({ x: cx + Math.cos(a) * iw * 0.50 * rr, y: cy + Math.sin(a) * ih * 0.50 * rr });
    }
    const mid = (p, q) => ({ x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 });
    const path = () => {
      ctx.beginPath();
      const m0 = mid(pts[N - 1], pts[0]);
      ctx.moveTo(m0.x, m0.y);
      for (let i = 0; i < N; i++) {
        const cur = pts[i], nxt = pts[(i + 1) % N];
        const m = mid(cur, nxt);
        ctx.quadraticCurveTo(cur.x, cur.y, m.x, m.y);
      }
      ctx.closePath();
    };

    // 얕은 바다 테두리
    ctx.save();
    ctx.translate(0, ih * 0.03);
    path();
    ctx.fillStyle = 'rgba(126,178,208,0.42)';
    ctx.fill();
    ctx.restore();

    // 섬 본체
    path();
    const g = ctx.createLinearGradient(cx, cy - ih * 0.5, cx, cy + ih * 0.5);
    g.addColorStop(0, '#93dc8d');
    g.addColorStop(0.55, '#70c375');
    g.addColorStop(1, '#4f9d5c');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(66,126,78,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 중앙 산괴 — 노드와 겹치지 않도록 위쪽 가운데에 낮게
    ctx.save();
    ctx.translate(cx + iw * 0.03, cy - ih * 0.30);
    ctx.fillStyle = 'rgba(88,168,99,0.95)';
    ctx.beginPath();
    ctx.moveTo(-iw * 0.13, ih * 0.07);
    ctx.lineTo(-iw * 0.045, -ih * 0.10);
    ctx.lineTo(iw * 0.025, ih * 0.015);
    ctx.lineTo(iw * 0.085, -ih * 0.075);
    ctx.lineTo(iw * 0.155, ih * 0.07);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.30)';
    ctx.beginPath();
    ctx.moveTo(-iw * 0.045, -ih * 0.10);
    ctx.lineTo(-iw * 0.008, -ih * 0.028);
    ctx.lineTo(-iw * 0.085, -ih * 0.005);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawWorldMap(viewW, viewH, t) {
    ctx.save();
    ctx.fillStyle = 'rgba(30,26,22,0.62)';
    ctx.fillRect(0, 0, viewW, viewH);

    const small = viewW < 620;
    const pad = small ? 8 : 18;
    const PW = Math.min(viewW - pad * 2, 760);
    const PH = Math.min(viewH - pad * 2, 520);
    const px = (viewW - PW) / 2, py = (viewH - PH) / 2;
    worldMapHit = { x: px, y: py, w: PW, h: PH };

    // 양피지 패널
    ctx.save();
    ctx.shadowColor = 'rgba(40,30,20,0.45)';
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 8;
    roundRectPath(px, py, PW, PH, small ? 12 : 18);
    const pg = ctx.createLinearGradient(px, py, px, py + PH);
    pg.addColorStop(0, '#fdf4de');
    pg.addColorStop(1, '#f2e0bb');
    ctx.fillStyle = pg;
    ctx.fill();
    ctx.restore();

    roundRectPath(px, py, PW, PH, small ? 12 : 18);
    ctx.strokeStyle = '#c9a877';
    ctx.lineWidth = small ? 2 : 3;
    ctx.stroke();

    // 패널 안쪽을 클립하고 하늘빛을 깐다
    ctx.save();
    roundRectPath(px + 4, py + 4, PW - 8, PH - 8, small ? 9 : 15);
    ctx.clip();
    const sg = ctx.createLinearGradient(px, py, px, py + PH);
    sg.addColorStop(0, 'rgba(150,205,240,0.45)');
    sg.addColorStop(1, 'rgba(198,230,245,0.30)');
    ctx.fillStyle = sg;
    ctx.fillRect(px, py, PW, PH);

    // 섬 영역 (아래쪽은 명판 자리로 비워둔다)
    const ix = px + PW * 0.13;
    const iy = py + PH * (small ? 0.12 : 0.13);
    const iw = PW * 0.74;
    const ih = PH * (small ? 0.46 : 0.64);

    drawIslandBlob(ix, iy, iw, ih);

    // 경로 — 원작 진행 순서대로 잇는다
    const pt = (a) => ({ x: ix + a.x * iw, y: iy + a.y * ih });
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 0; i < WORLD_AREAS.length - 1; i++) {
      const A = pt(WORLD_AREAS[i]), B = pt(WORLD_AREAS[i + 1]);
      const open = WORLD_AREAS[i].status !== 'planned' && WORLD_AREAS[i + 1].status !== 'planned';
      ctx.save();
      ctx.setLineDash(open ? [] : [5, 7]);
      ctx.strokeStyle = open ? 'rgba(232,206,150,0.95)' : 'rgba(120,110,90,0.38)';
      ctx.lineWidth = open ? (small ? 5 : 7) : (small ? 2 : 3);
      ctx.beginPath();
      ctx.moveTo(A.x, A.y);
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
      const nx = -(B.y - A.y), ny = (B.x - A.x);
      const nl = Math.hypot(nx, ny) || 1;
      const bend = (i % 2 ? 1 : -1) * Math.min(26, nl * 0.16);
      ctx.quadraticCurveTo(mx + (nx / nl) * bend, my + (ny / nl) * bend, B.x, B.y);
      ctx.stroke();
      ctx.restore();
    }

    // 구름 테두리 — 패널 네 변을 따라 둘러 액자처럼
    const nC = small ? 16 : 22;
    const perim = 2 * (PW + PH);
    for (let i = 0; i < nC; i++) {
      const d = ((i + wob(i) * 0.6) / nC) * perim;
      let cxp, cyp;
      if (d < PW)                    { cxp = px + d;                 cyp = py; }
      else if (d < PW + PH)          { cxp = px + PW;                cyp = py + (d - PW); }
      else if (d < 2 * PW + PH)      { cxp = px + PW - (d - PW - PH); cyp = py + PH; }
      else                           { cxp = px;                     cyp = py + PH - (d - 2 * PW - PH); }
      const inward = (small ? 8 : 14) + wob(i + 5) * (small ? 10 : 18);
      cxp += (px + PW / 2 - cxp) * (inward / Math.max(PW, PH));
      cyp += (py + PH / 2 - cyp) * (inward / Math.max(PW, PH));
      drawCloudPuff(cxp, cyp, (small ? 15 : 24) * (0.72 + wob(i + 3) * 0.55), 0.92);
    }

    // 지역 노드
    ctx.textAlign = 'center';
    for (const a of WORLD_AREAS) {
      const p = pt(a);
      const cur = a.status === 'current';
      const planned = a.status === 'planned';
      const r = small ? 9 : 12;

      // 그림자
      ctx.fillStyle = 'rgba(60,70,50,0.22)';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + r * 0.72, r * 0.95, r * 0.40, 0, 0, Math.PI * 2);
      ctx.fill();

      // 표식
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = planned ? '#cbbfa6' : (cur ? '#ff8aa0' : '#ffd166');
      ctx.fill();
      ctx.strokeStyle = planned ? 'rgba(110,100,85,0.5)' : 'rgba(120,80,60,0.75)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 현재 위치는 맥동하는 고리로 강조
      if (cur) {
        const pulse = 1 + Math.sin(t * 3) * 0.16;
        ctx.strokeStyle = 'rgba(255,138,160,0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 1.75 * pulse, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 번호
      ctx.fillStyle = planned ? 'rgba(90,80,65,0.75)' : '#5b4632';
      ctx.font = `700 ${small ? 9 : 11}px "JetBrains Mono", monospace`;
      ctx.textBaseline = 'middle';
      ctx.fillText(String(a.n), p.x, p.y + 0.5);

      // 이름표 — 좁은 화면에서는 아래 범례가 이름을 대신한다
      if (small) continue;
      const label = planned ? `${a.name} 🔒` : a.name;
      ctx.font = `600 ${small ? 9 : 11}px "Gowun Dodum", sans-serif`;
      ctx.textBaseline = 'top';
      const lw = ctx.measureText(label).width + (small ? 8 : 12);
      const ly = p.y + r + (small ? 3 : 5);
      roundRectPath(p.x - lw / 2, ly, lw, small ? 14 : 17, 5);
      ctx.fillStyle = planned ? 'rgba(255,250,240,0.72)' : 'rgba(255,250,240,0.95)';
      ctx.fill();
      ctx.strokeStyle = planned ? 'rgba(150,140,120,0.35)' : 'rgba(180,140,100,0.55)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = planned ? '#8b8067' : '#5b4632';
      ctx.fillText(label, p.x, ly + (small ? 2 : 3));
    }
    ctx.restore();

    // 좁은 화면 범례 — 번호 ↔ 지역 이름 (2열)
    if (small) {
      const lx = px + PW * 0.06;
      const lyTop = iy + ih + 4;
      const colW = (PW * 0.88) / 2;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = '600 9px "Gowun Dodum", sans-serif';
      WORLD_AREAS.forEach((a, i) => {
        const col = i % 2, row = (i / 2) | 0;
        const ex = lx + col * colW;
        const ey = lyTop + row * 12 + 5;
        const planned = a.status === 'planned';
        ctx.beginPath();
        ctx.arc(ex + 5, ey, 5, 0, Math.PI * 2);
        ctx.fillStyle = planned ? '#cbbfa6' : (a.status === 'current' ? '#ff8aa0' : '#ffd166');
        ctx.fill();
        ctx.fillStyle = '#5b4632';
        ctx.font = '700 7px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(String(a.n), ex + 5, ey + 0.5);
        ctx.textAlign = 'left';
        ctx.font = '600 9px "Gowun Dodum", sans-serif';
        ctx.fillStyle = planned ? 'rgba(110,100,82,0.85)' : '#5b4632';
        ctx.fillText(planned ? `${a.name} 🔒` : a.name, ex + 13, ey);
      });
      ctx.textAlign = 'center';
    }

    // 나무 명판 — "에버그린" (좁은 화면에서는 아래 한 줄이 대신한다)
    if (!small) {
    const plateW = 168;
    const plateH = 34;
    const plx = px + PW / 2 - plateW / 2;
    const ply = py + PH - plateH - 30;
    ctx.save();
    ctx.shadowColor = 'rgba(60,40,20,0.35)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    roundRectPath(plx, ply, plateW, plateH, 8);
    const wg = ctx.createLinearGradient(plx, ply, plx, ply + plateH);
    wg.addColorStop(0, '#e2b877');
    wg.addColorStop(1, '#c99354');
    ctx.fillStyle = wg;
    ctx.fill();
    ctx.restore();
    roundRectPath(plx, ply, plateW, plateH, 8);
    ctx.strokeStyle = '#a97a4a';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#5b3a1c';
    ctx.font = `700 ${small ? 12 : 18}px "Black Han Sans", "Gowun Dodum", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('에버그린', px + PW / 2, ply + plateH / 2 + 1);
    }

    // 상단 제목 · 하단 안내
    // 한 줄 캡션 — 제목·진행도·안내를 모아 패널 맨 아래에 둔다.
    // (상단에 두면 HUD 조작 칩과, 명판 옆에 두면 명판과 겹치는 창 비율이 있다)
    const doneN = WORLD_AREAS.filter(a => a.status !== 'planned').length;
    const titleTxt = `에버그린 전경도  ·  구현 ${doneN}/${WORLD_AREAS.length}`;
    const hint = isTouch ? '바깥을 탭하면 닫힘' : 'M / ESC 닫기';
    const lockTxt = small ? '🔒 미구현' : '🔒 표시는 아직 만들지 않은 지역';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.font = `600 ${small ? 8 : 11}px "JetBrains Mono", monospace`;
    ctx.fillStyle = 'rgba(91,70,50,0.85)';
    ctx.fillText(`${titleTxt}  ·  ${lockTxt}  ·  ${hint}`, px + PW / 2, py + PH - (small ? 5 : 9));
    ctx.restore();
  }

  function drawFullMap(viewW, viewH, t) {
    ctx.save();
    ctx.fillStyle = 'rgba(52,38,26,0.58)';
    ctx.fillRect(0, 0, viewW, viewH);

    const small = viewW < 620;
    const R = small ? Math.min(viewW * 0.32, viewH * 0.30) : Math.min(viewW, viewH) * 0.35;
    const cx = viewW / 2, cy = viewH / 2 + (small ? 2 : 6);
    fullmapHit = { cx, cy, r: R + (small ? 16 : 30) };
    drawMapCircle(cx, cy, R, true, t);

    const z = currentZone;
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    if (!small) {
      ctx.font = '700 15px "Gowun Dodum", sans-serif';
      ctx.textBaseline = 'bottom';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(45,30,15,0.7)';
      ctx.strokeText(`${z.name} 전도`, cx, cy - R - 16);
      ctx.fillStyle = '#fdf4de';
      ctx.fillText(`${z.name} 전도`, cx, cy - R - 16);
    }

    ctx.font = small ? '600 10px "JetBrains Mono", monospace' : '600 12px "JetBrains Mono", monospace';
    ctx.textBaseline = 'top';
    const pct = z.totalCells ? Math.round((z.exploredCount / z.totalCells) * 100) : 0;
    const closeHint = isTouch ? '지도를 탭하면 전경도' : 'M 한 번 더 → 전경도';
    const gap = small ? '  ·  ' : '   ·   ';
    let foundText = z.landmarks.length ? `발견 ${z.foundCount}/${z.landmarks.length}${gap}` : '';
    if (z.landmarks.length && z.portal) {
      foundText += (isPortalLocked(z) ? '포탈 잠김' : '포탈 열림') + gap;
    }
    const captionTxt = `탐험도 ${pct}%${gap}${foundText}${closeHint}`;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(45,30,15,0.7)';
    ctx.strokeText(captionTxt, cx, cy + R + (small ? 10 : 14));
    ctx.fillStyle = '#fdf4de';
    ctx.fillText(captionTxt, cx, cy + R + (small ? 10 : 14));
    ctx.restore();
  }

  const DIRS = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
  function bearingLabel(x, y) {
    const dist = Math.hypot(x, y);
    if (dist < 90) return '출발점';
    let a = Math.atan2(x, -y);
    if (a < 0) a += Math.PI * 2;
    return `${DIRS[Math.round(a / (Math.PI / 4)) % 8]} ${Math.round(dist)}m`;
  }

  let toastTimer = 0;
  function showToast(msg, final) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('final', !!final);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), final ? 4200 : 2800);
  }

  function isPortalLocked(z) {
    return z.landmarks.length > 0 && z.foundCount < z.landmarks.length;
  }

  function checkDiscovery() {
    const z = currentZone;
    for (const lm of z.landmarks) {
      if (lm.found) continue;
      if (Math.hypot(player.x - lm.x, player.y - lm.y) > DISCOVER_R) continue;
      lm.found = true;
      z.foundCount++;
      if (z.foundCount === z.landmarks.length) {
        const portalMsg = z.portal ? ` 포탈이 열렸습니다!` : '';
        showToast(`${z.name}의 랜드마크를 모두 발견했습니다!${portalMsg}`, true);
      } else {
        showToast(`${withObjParticle(lm.name)} 발견했습니다`);
      }
    }
  }

  let lastLockToast = -99;
  function checkPortal() {
    const z = currentZone;
    if (!z.portal || transition) return;
    if (Math.hypot(player.x - z.portal.x, player.y - z.portal.y) < z.portal.triggerR) {
      if (isPortalLocked(z)) {
        const now = performance.now() / 1000;
        if (now - lastLockToast > 3) {
          lastLockToast = now;
          showToast(`포탈이 잠겨 있습니다 — 랜드마크 ${z.foundCount}/${z.landmarks.length}를 모두 찾아야 열립니다`);
        }
        return;
      }
      startTransition(z.portal.toZone, z.portal.spawn);
    }
  }

  let lastTime = performance.now();
  const hudCache = { dir: null, pct: -1, found: -1, zone: null };

  function step(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    const t = now / 1000;

    if (transition) {
      transition.t += dt;
      if (transition.phase === 'out' && transition.t >= transition.dur) {
        currentZone = zones[transition.toZoneId];
        player.x = transition.spawn.x;
        player.y = transition.spawn.y;
        transition.phase = 'in';
        transition.t = 0;
      } else if (transition.phase === 'in' && transition.t >= transition.dur) {
        transition = null;
      }
    }

    let dx = 0, dy = 0;
    if (!mapView && !transition) {
      if (keys.has('w') || keys.has('arrowup')) dy -= 1;
      if (keys.has('s') || keys.has('arrowdown')) dy += 1;
      if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
      if (keys.has('d') || keys.has('arrowright')) dx += 1;
      if (joyActive) { dx += joyVector.x; dy += joyVector.y; }
    }

    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }

    // 로드맵 5 작업 B: 여울(shallow water)에 서 있으면 느려진다. 목적지가 아니라
    // "지금 서 있는 자리" 기준으로 재는 게 자연스럽다(물에 들어가는 순간부터 느려짐).
    const speed = 200 * terrainAt(currentZone, player.x, player.y).speedMul;
    const moving = dx !== 0 || dy !== 0;
    if (moving) {
      player.facing = { x: dx / (len || 1), y: dy / (len || 1) };
      tryMove(dx, dy, speed * dt);
    }

    // 로드맵 5 작업 A: 중력/점프 적분. player.z는 지형 기준 절대 높이이므로,
    // 매 프레임 중력을 적용한 뒤 현재 위치의 지면 높이 밑으로 내려가지 않게 바닥에 붙인다.
    if (!mapView && !transition) {
      player.vz -= GRAVITY * dt;
      player.z += player.vz * dt;
      const ground = groundHeightAt(currentZone, player.x, player.y);
      if (player.z <= ground) { player.z = ground; player.vz = 0; }
    }

    if (!transition) {
      updateExploration();
      checkDiscovery();
      checkPortal();
      // 지역 이름(사원/야영지/강가 등)은 향후 별도 맵으로 분리될 예정이라,
      // 여기서는 지면 톤·밀도 차이(areaAt 기반)만 남기고 "OO에 들어섰습니다"
      // 같은 지역명 토스트는 내지 않는다 — 지금 여기는 전부 맵1(별내림 천문대)이다.
    }

    const z = currentZone;
    const viewW = canvas.viewW || stage.clientWidth;
    const viewH = canvas.viewH || stage.clientHeight;
    const lookahead = viewH * 0.14;
    const cx = viewW / 2, cy = viewH / 2 + lookahead;

    ctx.clearRect(0, 0, viewW, viewH);
    drawSky(viewW, viewH, t);
    drawPlanetDome(cx, cy);

    const drawList = [];
    for (const pt of z.terrainPatches) {
      const p = project(pt.x, pt.y);
      if (p) drawList.push({ p, layer: 0, draw: () => {
        const area = z.useAreas ? areaAt(pt.x, pt.y) : null;
        ctx.fillStyle = area ? hexA(area.groundTint, 0.16) : 'rgba(255,255,255,0.10)';
        ctx.beginPath(); ctx.ellipse(0, 0, pt.w, pt.w * 0.55, pt.angle, 0, Math.PI * 2); ctx.fill();
      }});
    }
    for (const g of z.grassTufts) {
      const p = project(g.x, g.y);
      if (p) drawList.push({ p, layer: 0, draw: () => {
        const sway = reduceMotion ? 0 : Math.sin(t * 1.6 + g.phase) * 0.18;
        ctx.strokeStyle = g.tone > 0.5 ? '#4aa85f' : '#e9f7d8';
        ctx.globalAlpha *= g.tone > 0.5 ? 1 : 0.75;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(g.angle + sway) * g.len, -g.len * 1.4 + Math.sin(g.angle + sway) * 2);
        ctx.stroke();
      }});
    }
    for (const tile of z.pathTiles) {
      const p = project(tile.x, tile.y);
      if (p) drawList.push({ p, layer: 0, draw: () => drawPathTile(tile.tone, tile.angle) });
    }

    drawList.sort((a, b) => a.p.sy - b.p.sy);
    for (const item of drawList) {
      ctx.save();
      ctx.translate(cx + item.p.sx, cy + item.p.sy);
      ctx.scale(item.p.scale, item.p.scale);
      ctx.globalAlpha = Math.min(1, item.p.scale / 0.22);
      item.draw();
      ctx.restore();
    }

    // 로드맵 5 작업 B/C: 물·단구는 오브젝트보다 아래, 바닥 장식보다 위 레이어에 그린다
    for (const p of z.plateaus) drawTerrainShape(p, cx, cy);

    const solids = [];
    if (z.spring) { const p = project(z.spring.x, z.spring.y); if (p) solids.push({ p, spring: z.spring }); }
    for (const o of z.obstacles) {
      const p = project(o.x, o.y);
      if (p) solids.push({ p, o });
    }
    for (const d of z.decorations) {
      const p = project(d.x, d.y);
      if (p) solids.push({ p, d });
    }
    for (const sp of z.signposts) {
      const pSign = project(sp.x, sp.y);
      if (pSign) solids.push({ p: pSign, sign: true });
    }
    for (const lm of z.landmarks) {
      if (!lm.height) continue;
      const p = projectTall(lm.x, lm.y, lm.height);
      if (p) solids.push({ p, lm });
    }
    if (z.portal) {
      const p = projectTall(z.portal.x, z.portal.y, z.portal.height);
      if (p) solids.push({ p, portal: z.portal });
    }
    for (const f of z.pathFences) {
      const p = project(f.x, f.y);
      if (p) solids.push({ p, f });
    }
    // 플레이어도 다른 오브젝트와 같은 화면-Y 기준으로 정렬한다 — 그래야 플레이어보다
    // 화면 아래쪽(카메라에 더 가까운)에 있는 나무/랜드마크가 플레이어를 실제로 가릴 수 있다.
    solids.push({ p: project(player.x, player.y), isPlayer: true });
    solids.sort((a, b) => (a.p ? a.p.sy : 0) - (b.p ? b.p.sy : 0));

    // 점프로 화면상 위로 떠 있는 만큼(playerScreenY)을 가림 판정 기준점으로 쓴다 —
    // 나무 캐노피보다 높이 뛰어오르면 그만큼 가림 판정에서 벗어나 점선 윤곽이 풀린다.
    const playerScreenY = -player.z;
    let occluderInfo = null;
    for (const s of solids) {
      if (s.isPlayer || !s.p) continue;
      if (s.p.sy <= 0) continue; // 플레이어보다 화면 위(더 먼 쪽)에 있는 것은 가릴 수 없다
      const reach = objectReach(s);
      if (!reach) continue;
      const scale = s.p.scale;
      if (Math.abs(s.p.sx) > reach.w * scale) continue;
      if (playerScreenY >= s.p.sy - reach.upH * scale && playerScreenY <= s.p.sy + reach.downH * scale) {
        occluderInfo = { sx: s.p.sx, sy: s.p.sy, scale, reach };
        break;
      }
    }

    for (const s of solids) {
      if (!s || !s.p) continue;
      ctx.save();
      ctx.translate(cx + s.p.sx, cy + s.p.sy);
      ctx.scale(s.p.scale, s.p.scale);
      ctx.globalAlpha = Math.min(1, s.p.scale / 0.22);
      if (s.o) { s.o.type === 'tree' ? drawTree(s.o, t) : drawStone(s.o); }
      else if (s.d) {
        switch (s.d.type) {
          case 'bush': drawBush(s.d, t); break;
          case 'flower': drawFlower(s.d); break;
          case 'reed': drawReed(s.d, t); break;
          case 'star': drawFallenStar(s.d, t); break;
          case 'cow': drawCow(s.d, t); break;
          case 'hay': drawHay(s.d); break;
          case 'trough': drawTrough(s.d); break;
          case 'farmRow': drawFarmRow(s.d); break;
          case 'cart': drawCart(s.d); break;
          case 'scarecrow': drawScarecrow(s.d, t); break;
          case 'clothesline': drawClothesline(s.d, t); break;
          case 'fence': drawFence(s.d.angle || 0); break;
          case 'landingDeck': drawLandingDeck(s.d); break;
          case 'airship': drawAirship(s.d, t); break;
          case 'flag': drawFlag(s.d, t); break;
          case 'lantern': drawLantern(s.d, t); break;
          case 'crate': drawCrate(s.d); break;
          case 'cauldron': drawCauldron(s.d, t); break;
          case 'rubble': drawRubble(s.d); break;
          case 'standingStone': drawStandingStone(s.d); break;
          case 'waterfall': drawWaterfall(s.d, t); break;
          default: drawMushroom(s.d.seed, s.d.red);
        }
      }
      else if (s.sign) { drawSignpost(); }
      else if (s.f) { drawFence(s.f.angle); }
      else if (s.spring) { drawSpring(s.spring); }
      else if (s.lm) {
        drawSinkClipped(s.lm.height, s.p.sink, () => drawLandmarkBody(s.lm, t));
      }
      else if (s.portal) {
        drawSinkClipped(s.portal.height, s.p.sink, () => drawPortalBody(t, isPortalLocked(z)));
      }
      else if (s.isPlayer) { drawPlayer(t, moving, player.z); }
      ctx.restore();
    }

    for (const spore of z.spores) {
      if (!reduceMotion) {
        spore.y -= spore.speed * dt;
        spore.x += Math.sin(t * 0.6 + spore.phase) * 4 * dt;
        if (Math.hypot(spore.x, spore.y) > HORIZON_D * 0.9) {
          const p = z.samplePlanetPoint(0, HORIZON_D * 0.3);
          spore.x = p.x; spore.y = p.y;
        }
      }
      drawProjected(cx, cy, spore.x, spore.y, () => {
        const twinkle = reduceMotion ? 0.6 : (Math.sin(t * 2 + spore.phase) + 1) / 2;
        ctx.globalAlpha *= 0.35 + twinkle * 0.5;
        ctx.fillStyle = '#fff7e0';
        ctx.beginPath(); ctx.arc(0, 0, spore.size, 0, Math.PI * 2); ctx.fill();
      });
    }

    if (occluderInfo) {
      ctx.save();
      ctx.translate(cx, cy + playerScreenY);
      drawPlayerOutline(occluderInfo);
      ctx.restore();
    }

    drawMinimap(viewW, viewH, t);
    if (mapView === 1) drawFullMap(viewW, viewH, t);
    else if (mapView === 2) drawWorldMap(viewW, viewH, t);

    if (transition) {
      const alpha = transition.phase === 'out'
        ? Math.min(1, transition.t / transition.dur)
        : Math.max(0, 1 - transition.t / transition.dur);
      ctx.fillStyle = `rgba(20,16,14,${alpha})`;
      ctx.fillRect(0, 0, viewW, viewH);
    }

    const dirText = bearingLabel(player.x, player.y);
    if (dirText !== hudCache.dir) { posDirEl.textContent = dirText; hudCache.dir = dirText; }
    const pct = z.totalCells ? Math.round((z.exploredCount / z.totalCells) * 100) : 0;
    if (pct !== hudCache.pct) { explorePctEl.textContent = pct + '%'; hudCache.pct = pct; }
    if (z.foundCount !== hudCache.found) {
      foundLabelEl.textContent = z.landmarks.length ? `${z.foundCount}/${z.landmarks.length}` : '-';
      hudCache.found = z.foundCount;
    }
    if (z.name !== hudCache.zone) { zoneLabelEl.textContent = z.name; hudCache.zone = z.name; }

    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);

  function snapshot() {
    const found = {};
    for (const id in zones) found[id] = zones[id].landmarks.filter((l) => l.found).map((l) => l.id);
    return { zone: currentZone.id, x: player.x, y: player.y, found };
  }
  function boot(data) {
    if (!data) return;
    if (data.zone && zones[data.zone]) currentZone = zones[data.zone];
    if (typeof data.x === 'number' && typeof data.y === 'number') {
      player.x = data.x; player.y = data.y;
    }
    if (data.found) {
      for (const id in zones) {
        const list = data.found[id];
        if (!Array.isArray(list)) continue;
        const z = zones[id];
        for (const lm of z.landmarks) {
          if (!lm.found && list.indexOf(lm.id) !== -1) { lm.found = true; z.foundCount++; }
        }
      }
    }
  }
  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(snapshot);
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data);
  }
})();
</script>
