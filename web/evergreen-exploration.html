<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에버그린 탐사</title>
<style>
  :root{
    --bg-page:#fff2e2;
    --panel:#fffaf2;
    --panel-2:#fff4e6;
    --line:#f0d9b8;
    --text-primary:#5b4632;
    --text-muted:#a8916f;
    --accent:#ff8aa0;
    --accent-soft:rgba(255,138,160,.16);
    --accent-line:rgba(255,138,160,.4);
    --mint:#4fb787;
    --mono-num:#3f8f66;
    /* 그림책풍 팔레트 — 전경도(월드맵)에서 이미 쓴 양피지·나무 톤과 통일 */
    --parchment-1:#fdf4de;
    --parchment-2:#f2e0bb;
    --wood-1:#e8c48b;
    --wood-2:#c99354;
    --wood-line:#c9a877;
    --wood-dark:#a97a4a;
    --wood-text:#3a2412;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg-page);
    color:var(--text-primary);
    font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 16px 28px;
    gap:14px;
  }

  .frame{
    width:100%;
    max-width:980px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    padding:14px 20px;
    background:linear-gradient(180deg, var(--parchment-1) 0%, var(--parchment-2) 100%);
    border:2px solid var(--wood-line);
    border-radius:10px 22px 14px 26px;
    box-shadow:0 2px 0 rgba(255,255,255,.55) inset, 0 10px 22px -16px rgba(120,90,60,.55);
    position:relative;
  }

  header.top::before{
    content:"";
    position:absolute;
    inset:4px;
    border:1px dashed rgba(169,122,74,.4);
    border-radius:7px 18px 11px 22px;
    pointer-events:none;
  }

  .title-block{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }

  .planet-glyph{
    width:38px;
    height:38px;
    border-radius:50%;
    flex:none;
    background:
      radial-gradient(circle at 32% 28%, #d9ffe4 0%, #9fe0a6 46%, #3f8f66 100%);
    box-shadow:0 4px 0 rgba(63,143,102,.25);
  }

  h1{
    font-family:'Black Han Sans','Gowun Dodum',sans-serif;
    font-weight:400;
    font-size:1.5rem;
    letter-spacing:.01em;
    margin:0;
    line-height:1.1;
    text-wrap:balance;
  }

  .subtitle{
    margin:2px 0 0;
    font-size:.8rem;
    color:var(--text-muted);
  }

  .phase-chip{
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-size:.68rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#c65a75;
    background:var(--accent-soft);
    border:1px dashed var(--accent-line);
    border-radius:4px 11px 4px 11px;
    padding:6px 12px;
    white-space:nowrap;
    transform:rotate(-1.4deg);
    box-shadow:0 2px 4px -1px rgba(120,90,60,.25);
  }

  .stage{
    position:relative;
    width:100%;
    aspect-ratio:16/10;
    border-radius:20px;
    overflow:hidden;
    border:1px solid var(--line);
    background:linear-gradient(180deg,#5fb6ea 0%,#bfe3ff 60%,#eaf6ff 100%);
    box-shadow:0 24px 50px -28px rgba(120,90,60,.45);
    touch-action:none;
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
  }

  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    box-shadow:inset 0 0 90px 20px rgba(255,255,255,.10), inset 0 0 130px 46px rgba(40,50,30,.14);
  }

  .hint{
    position:absolute;
    top:14px;
    left:14px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    max-width:calc(100% - 28px);
  }

  kbd{
    font-family:'JetBrains Mono',monospace;
    font-size:.68rem;
    font-weight:600;
    background:linear-gradient(180deg, var(--wood-1), var(--wood-2));
    border:1px solid var(--wood-dark);
    color:var(--wood-text);
    padding:4px 9px;
    border-radius:5px 8px 5px 8px;
    box-shadow:0 2px 0 rgba(120,80,40,.4), 0 3px 7px -2px rgba(60,40,20,.4);
    display:inline-block;
  }
  .hint kbd:nth-child(odd){transform:rotate(-2deg);}
  .hint kbd:nth-child(even){transform:rotate(1.6deg);}

  .joystick-zone{
    position:absolute;
    left:22px;
    bottom:22px;
    width:104px;
    height:104px;
    border-radius:50%;
    background:rgba(255,250,242,.45);
    border:1px solid rgba(91,70,50,.22);
    touch-action:none;
  }

  .joystick-zone[hidden]{display:none!important;}

  .joystick-stick{
    position:absolute;
    width:44px;
    height:44px;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%, #ffd0da, var(--accent));
    box-shadow:0 4px 10px rgba(198,90,117,.35);
  }

  .jump-btn{
    /* 조이스틱 바로 오른쪽, 같은 아래쪽 줄에 배치한다. 오른쪽 위에는 미니맵이 있어서
       화면 비율이 짧은 기기(16:10 stage)에서는 오른쪽 어디든 미니맵과 겹치기 쉽지만,
       조이스틱 옆(왼쪽 아래 묶음)은 항상 미니맵과 다른 좌우 영역이라 안전하다 */
    position:absolute;
    left:138px;
    bottom:22px;
    width:64px;
    height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6da, var(--wood-2));
    border:1px solid rgba(91,70,50,.3);
    box-shadow:0 4px 10px rgba(120,80,40,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Gowun Dodum',sans-serif;
    font-size:.72rem;
    font-weight:700;
    color:var(--wood-text);
    touch-action:none;
    user-select:none;
  }
  .jump-btn[hidden]{display:none!important;}
  .jump-btn:active{background:radial-gradient(circle at 35% 30%, #ffe9b0, var(--wood-2));}

  footer.hud{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    padding:10px 20px;
    background:linear-gradient(180deg, var(--wood-1) 0%, var(--wood-2) 100%);
    border:2px solid var(--wood-dark);
    border-radius:22px 10px 26px 14px;
    font-family:'Gowun Dodum',sans-serif;
    font-size:.78rem;
    color:var(--wood-text);
    box-shadow:0 2px 0 rgba(255,255,255,.2) inset, 0 10px 22px -16px rgba(90,60,30,.55);
  }

  .hud-field{display:flex;gap:6px;align-items:baseline;}
  .hud-field b{
    color:#5b3a1c;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    font-family:'JetBrains Mono',monospace;
    background:rgba(255,250,242,.92);
    padding:1px 7px;
    border-radius:5px;
    border:1px solid rgba(169,122,74,.5);
  }

  .legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    color:rgba(58,36,18,.8);
    font-size:.72rem;
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:9px;height:9px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(58,36,18,.35);}

  /* 터치 기기에서는 키보드 안내가 의미 없다 (조이스틱 + 미니맵 탭으로 안내) */
  @media (pointer: coarse){
    .hint{display:none;}
  }

  .toast{
    position:absolute;
    left:50%;
    top:64px;
    transform:translate(-50%,-6px) rotate(-1.2deg);
    padding:9px 20px;
    border-radius:3px 14px 3px 14px;
    background:linear-gradient(180deg, var(--parchment-1), var(--parchment-2));
    border:1px solid var(--wood-line);
    color:var(--text-primary);
    font-size:.82rem;
    font-weight:600;
    letter-spacing:.01em;
    white-space:nowrap;
    box-shadow:0 10px 24px -12px rgba(120,90,60,.5), 0 1px 0 rgba(255,255,255,.6) inset;
    opacity:0;
    pointer-events:none;
    transition:opacity .28s ease, transform .28s ease;
  }
  .toast::before{
    content:"";
    position:absolute;
    top:-5px;
    left:50%;
    transform:translateX(-50%);
    width:8px;
    height:8px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffd0da, #c65a75);
    box-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .toast.show{opacity:1;transform:translate(-50%,0) rotate(-1.2deg);}
  .toast.final{background:linear-gradient(180deg,#fff0e8,#ffe0e8);border-color:var(--accent);}

  @media (max-width:600px){
    h1{font-size:1.25rem;}
    .phase-chip{display:none;}
    .toast{font-size:.74rem;top:52px;padding:7px 14px;}
    .legend{display:none;}
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<div class="frame">
  <header class="top">
    <div class="title-block">
      <div class="planet-glyph" aria-hidden="true"></div>
      <div>
        <h1>에버그린 탐사</h1>
        <p class="subtitle">에버플래닛 프로토타입 · 지도를 그리며 별내림 천문대를 탐험하고, 포탈로 다음 맵까지</p>
      </div>
    </div>
    <span class="phase-chip">PHASE 3 · PORTAL (PROTO)</span>
  </header>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="vignette"></div>
    <div class="hint">
      <kbd>W A S D</kbd><kbd>방향키</kbd><kbd>이동</kbd><kbd>Space</kbd><kbd>점프</kbd><kbd>M</kbd><kbd>지도</kbd><kbd>M M</kbd><kbd>전경도</kbd>
    </div>
    <div class="toast" id="toast"></div>
    <div class="joystick-zone" id="joyZone" hidden>
      <div class="joystick-stick" id="joyStick"></div>
    </div>
    <div class="jump-btn" id="jumpBtn" hidden>점프</div>
  </div>

  <footer class="hud">
    <div class="hud-field">구역 <b id="zoneLabel">초원</b></div>
    <div class="hud-field">위치 <b id="posDir">출발점</b></div>
    <div class="hud-field">탐험도 <b id="explorePct">0%</b></div>
    <div class="hud-field">발견 <b id="foundLabel">-</b></div>
    <div class="legend">
      <span><i class="swatch" style="background:#ff8aa0"></i>플레이어</span>
      <span><i class="swatch" style="background:#4fa066"></i>나무</span>
      <span><i class="swatch" style="background:#b9aec2"></i>바위</span>
      <span><i class="swatch" style="background:#c79bf0"></i>포탈</span>
    </div>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const posDirEl = document.getElementById('posDir');
  const explorePctEl = document.getElementById('explorePct');
  const foundLabelEl = document.getElementById('foundLabel');
  const zoneLabelEl = document.getElementById('zoneLabel');
  const toastEl = document.getElementById('toast');
  const joyZone = document.getElementById('joyZone');
  const joyStick = document.getElementById('joyStick');
  const jumpBtn = document.getElementById('jumpBtn');

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- 시드 고정 의사난수 ----------
  function mulberry32(seed) {
    return function() {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 균등 분포로 원형 필드 안에 점 뿌리기 (구역별 rand()에 바인딩해서 만들어 쓴다)
  function makeSamplePlanetPoint(rand) {
    return function(minR, maxR) {
      const r = Math.sqrt(rand()) * (maxR - minR) + minR;
      const a = rand() * Math.PI * 2;
      return { x: Math.cos(a) * r, y: Math.sin(a) * r };
    };
  }

  // ---------- 작은 행성 투영 ----------
  const PLANET_R = 520;
  const HORIZON_D = PLANET_R * Math.PI / 2 * 0.985;
  const PLAYER_RADIUS = 15;
  const TILT = 0.62;

  // ── 로드맵 5 작업 A: 높이와 점프 ─────────────────────────────────
  // player.z는 "화면 연출용" 높이가 아니라 지형 기준 절대 높이다. 평지에서는
  // groundHeightAt()과 항상 같고, 점프 중에는 그보다 높다. 이 값은 project()/
  // projectTall()의 거리·지평선 계산에는 전혀 반영하지 않는다 — 구체 투영 수학은
  // 그대로 두고, 화면에 그릴 때만 순수 스크린-Y 오프셋으로 얹는다(드로우 단계에서 처리).
  const JUMP_V = 260;      // 점프 시작 수직 속도 (단위/초)
  const GRAVITY = 900;     // 중력 가속도 (단위/초^2) — 최고 높이 약 37.6, 체공 시간 약 0.58초
  const STEP_UP = 14;      // 점프 없이도 자연스럽게 올라설 수 있는 높이 차 (계단 한 칸)
  const JUMP_CLEAR = 34;   // 점프로 넘을 수 있는 턱 높이의 상한 (작업 C 단구 설계 기준)

  // ── 로드맵 5 작업 B: 물 ───────────────────────────────────────────
  // 물도 plateaus와 같은 도형 목록에 음수 top으로 얹는다(§3). 도형마다
  // blocked(깊은 물처럼 무조건 막힘)·speedMul(여울처럼 느려짐)을 더 둘 수 있고,
  // 겹치는 도형이 있으면 "나중에 선언된 도형이 이긴다" 규칙으로 하나를 고른다
  // (다리·돌계단이 그 아래 물/절벽보다 뒤에 선언되어 우선하는 식) — 최고 높이가
  // 아니라 선언 순서로 고르는 이유는, 물처럼 top이 0보다 낮은 도형도 있어서
  // "높이가 가장 큰 도형이 이긴다"로는 물이 항상 진다.
  function terrainAt(zone, x, y) {
    let result = { top: 0, blocked: false, speedMul: 1 };
    for (const p of zone.plateaus) {
      if (!shapeContains(p, x, y)) continue;
      result = { top: shapeTopAt(p, x, y), blocked: !!p.blocked, speedMul: p.speedMul != null ? p.speedMul : 1 };
    }
    return result;
  }

  function groundHeightAt(zone, x, y) {
    return terrainAt(zone, x, y).top;
  }

  function tryJump() {
    const ground = groundHeightAt(currentZone, player.x, player.y);
    if (player.z <= ground + 0.5 && player.vz <= 0) {
      player.vz = JUMP_V;
    }
  }

  function project(x, y) {
    const relx = x - player.x, rely = y - player.y;
    const d = Math.hypot(relx, rely);
    if (d > HORIZON_D) return null;
    const angle = Math.atan2(rely, relx);
    const screenDist = PLANET_R * Math.sin(d / PLANET_R);
    const scale = Math.max(0.001, Math.cos(d / PLANET_R));
    return { sx: Math.cos(angle) * screenDist, sy: Math.sin(angle) * screenDist * TILT, scale, d };
  }

  const LM_MIN_SCALE = 0.32;
  const LM_MAX_SINK = 0.65;
  function projectTall(x, y, height) {
    const relx = x - player.x, rely = y - player.y;
    const d = Math.hypot(relx, rely);
    const extra = height * 4;
    const maxD = HORIZON_D + extra;
    if (d > maxD) return null;
    const angle = Math.atan2(rely, relx);
    const dd = Math.min(d, HORIZON_D);
    const screenDist = PLANET_R * Math.sin(dd / PLANET_R);
    const scale = Math.max(LM_MIN_SCALE, Math.cos(dd / PLANET_R));
    const raw = extra > 0 ? Math.max(0, d - HORIZON_D) / extra : 0;
    const sink = Math.min(LM_MAX_SINK, Math.pow(raw, 1.3));
    return {
      sx: Math.cos(angle) * screenDist,
      sy: Math.sin(angle) * screenDist * TILT,
      scale, d, sink
    };
  }

  function drawSinkClipped(height, sink, drawFn) {
    if (sink > 0) {
      const top = -height * 1.25, bottom = 16;
      const visible = (1 - sink) * (bottom - top);
      ctx.beginPath();
      ctx.rect(-220, top, 440, Math.max(0, visible));
      ctx.clip();
      ctx.globalAlpha *= 1 - sink * 0.38;
    }
    drawFn();
  }

  const DISCOVER_R = 120;
  const EXPLORE_R = 500;
  const CELL = 50;
  const FOG_SIZE = 600;

  function withObjParticle(name) {
    const code = name.charCodeAt(name.length - 1);
    if (code < 0xAC00 || code > 0xD7A3) return name + '를';
    return name + ((code - 0xAC00) % 28 === 0 ? '를' : '을');
  }

  // ── 지역 분화 (로드맵 4 작업 D) ──────────────────────────────────
  // 씬을 통째로 나누는 게 아니라, 기존 makeZone()이 만든 오브젝트 하나하나에
  // "어느 지역 소속인지"를 방위(각도)로 태깅하는 레이어. 기존 랜드마크 좌표·
  // 포탈 로직은 전혀 건드리지 않는다 (1구역 = 에버그린, zone1에만 적용).
  function bearingOf(x, y) {
    let a = Math.atan2(x, -y) * 180 / Math.PI; // bearingLabel()과 동일 기준
    if (a < 0) a += 360;
    return a;
  }

  const AREAS = [
    { id: 'temple',  name: '겸손한 사원',    from: 200, to: 260, treeRatio: 0.30, densityMul: 0.8, groundTint: '#a99570' },
    { id: 'camp',    name: '붙박이 야영지',  from: 260, to: 320, treeRatio: 0.45, densityMul: 0.5, groundTint: '#8fbf6a' },
    { id: 'river',   name: '늘 푸른 강가',   from: 320, to: 40,  treeRatio: 0.75, densityMul: 1.0, groundTint: '#5fbf9a' },
    { id: 'marsh',   name: '뮤렌 습지대',    from: 40,  to: 72,  treeRatio: 0.60, densityMul: 1.3, groundTint: '#4a7d6b' },
    { id: 'logging', name: '해안 벌목지',    from: 72,  to: 115, treeRatio: 0.35, densityMul: 0.9, groundTint: '#b09a62' },
    { id: 'harbor',  name: '에버그린 항구',  from: 115, to: 175, treeRatio: 0.30, densityMul: 0.5, groundTint: '#7faec4' },
    { id: 'cave',    name: '지붕 없는 동굴', from: 175, to: 200, treeRatio: 0.20, densityMul: 1.1, groundTint: '#6b6f7d' }
  ];

  const OBSERVATORY_R = 300; // ① 별내림 천문대 = 중심(스폰), 기본 톤 유지

  function areaAt(x, y) {
    if (Math.hypot(x, y) < OBSERVATORY_R) return null;
    const b = bearingOf(x, y);
    return AREAS.find(a => a.from < a.to ? (b >= a.from && b < a.to)
                                         : (b >= a.from || b < a.to)) || null;
  }

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  // ── 로드맵 5 작업 B/C: 지형 도형(plateaus) 공용 헬퍼 ───────────────────
  // 광장·물·다리·돌계단을 전부 같은 도형 목록(zone.plateaus)으로 표현한다.
  // circle/rect는 로컬 좌표계, sector는 원점(0,0) 기준 방위·반경 부채꼴이라
  // bearingOf()/hypot으로 바로 판정한다 — 지형은 난수가 아니라 좌표를 직접
  // 박아야 하므로(로드맵 5 §10) 부채꼴이 좌표를 쓰기에 가장 자연스럽다.
  function inBearingRange(bearing, from, to) {
    return from <= to ? (bearing >= from && bearing <= to) : (bearing >= from || bearing <= to);
  }

  function shapeContains(p, x, y) {
    if (p.shape === 'circle') {
      return Math.hypot(x - p.x, y - p.y) <= p.r;
    } else if (p.shape === 'rect') {
      const ang = -(p.angle || 0);
      const dx = x - p.x, dy = y - p.y;
      const lx = dx * Math.cos(ang) - dy * Math.sin(ang);
      const ly = dx * Math.sin(ang) + dy * Math.cos(ang);
      return Math.abs(lx) <= p.w / 2 && Math.abs(ly) <= p.h / 2;
    } else if (p.shape === 'sector') {
      const r = Math.hypot(x, y);
      return r >= p.rFrom && r <= p.rTo && inBearingRange(bearingOf(x, y), p.bearingFrom, p.bearingTo);
    }
    return false;
  }

  // sector에 topFrom/topTo가 있으면 반경에 따라 선형 보간(완만한 비탈용) —
  // 없으면 평평한 top 그대로.
  function shapeTopAt(p, x, y) {
    if (p.shape === 'sector' && p.topFrom != null && p.topTo != null) {
      const r = Math.hypot(x, y);
      const frac = Math.max(0, Math.min(1, (r - p.rFrom) / (p.rTo - p.rFrom)));
      return p.topFrom + (p.topTo - p.topFrom) * frac;
    }
    return p.top;
  }

  // 도형 경계를 화면/미니맵에 그릴 수 있도록 월드 좌표 폴리곤으로 잘게 썬다.
  function shapeBoundaryPoints(p, steps = 14) {
    const pts = [];
    if (p.shape === 'circle') {
      for (let i = 0; i <= steps; i++) {
        const a = (i / steps) * Math.PI * 2;
        pts.push({ x: p.x + Math.cos(a) * p.r, y: p.y + Math.sin(a) * p.r });
      }
    } else if (p.shape === 'rect') {
      const ang = p.angle || 0;
      const corners = [[-p.w / 2, -p.h / 2], [p.w / 2, -p.h / 2], [p.w / 2, p.h / 2], [-p.w / 2, p.h / 2]];
      for (const [lx, ly] of corners) {
        pts.push({ x: p.x + lx * Math.cos(ang) - ly * Math.sin(ang), y: p.y + lx * Math.sin(ang) + ly * Math.cos(ang) });
      }
    } else if (p.shape === 'sector') {
      let span = p.bearingTo - p.bearingFrom;
      if (span <= 0) span += 360;
      const addArc = (r, reverse) => {
        for (let i = 0; i <= steps; i++) {
          const k = reverse ? steps - i : i;
          const bearing = p.bearingFrom + span * (k / steps);
          const rad = bearing * Math.PI / 180;
          pts.push({ x: r * Math.sin(rad), y: -r * Math.cos(rad) });
        }
      };
      addArc(p.rFrom, false);
      addArc(p.rTo, true);
    }
    return pts;
  }

  // 나무/바위 등 산개 오브젝트가 물·다리·돌계단·몬스터 공터 위에 놓이지 않도록
  // 하는 제외 판정. plateaus 배열 자체는 건드리지 않고 별도 목록에서만 쓴다.
  const SCATTER_EXCLUDE_KINDS = new Set(['water-deep', 'water-shallow', 'bridge', 'stairs']);
  function isScatterExcluded(plateaus, monsterClearings, x, y) {
    for (const c of monsterClearings) {
      if (Math.hypot(x - c.x, y - c.y) <= c.r) return true;
    }
    for (const p of plateaus) {
      if (SCATTER_EXCLUDE_KINDS.has(p.kind) && shapeContains(p, x, y)) return true;
    }
    return false;
  }

  function makeZone(opts) {
    const rand = mulberry32(opts.seed);
    const radius = opts.radius;
    const samplePlanetPoint = makeSamplePlanetPoint(rand);
    const useAreas = opts.id === 'zone1';
    // 로드맵 5 작업 B/C: 지형(물·단구·다리·돌계단)과 몬스터 공터는 좌표를 직접
    // 박아서 opts로 받는다 — 난수 시드는 건드리지 않는다(§10)
    const plateaus = opts.plateaus || [];
    const monsterClearings = opts.monsterClearings || [];

    // 로드맵 5 작업 D: 길이 여러 갈래(간선 2개 + 지선 3개)가 됐으므로 pathPts 하나가
    // 아니라 opts.paths(각 {pts, sign?}) 목록을 받아 전부 같은 타일/울타리 생성 로직을
    // 태운다. nearPath()도 모든 경로의 모든 구간을 대상으로 검사한다.
    const pathTiles = [], pathFences = [], signposts = [];
    const pathSegments = [];
    for (const path of (opts.paths || [])) {
      const pts = path.pts;
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y;
        const len = Math.hypot(dx, dy);
        pathSegments.push({ ax: a.x, ay: a.y, bx: b.x, by: b.y });
        const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
        const tileCount = Math.round(len / 58);
        for (let j = 0; j < tileCount; j++) {
          const t = (j + 0.5) / tileCount;
          pathTiles.push({
            x: a.x + dx * t, y: a.y + dy * t,
            angle: Math.atan2(dy, dx),
            tone: (i + j) % 2
          });
        }
        const fenceCount = Math.round(len / 150);
        for (let j = 0; j < fenceCount; j++) {
          const t = (j + 0.5) / fenceCount;
          for (const side of [1, -1]) {
            pathFences.push({
              x: a.x + dx * t + nx * 78 * side,
              y: a.y + dy * t + ny * 78 * side,
              angle: Math.atan2(dy, dx)
            });
          }
        }
      }
      if (path.sign) {
        const last = pts[pts.length - 1];
        signposts.push({ x: last.x, y: last.y - 30 });
      }
    }
    function nearPath(x, y, threshold) {
      for (const seg of pathSegments) {
        const dx = seg.bx - seg.ax, dy = seg.by - seg.ay;
        const lenSq = dx * dx + dy * dy;
        let t = lenSq > 0 ? ((x - seg.ax) * dx + (y - seg.ay) * dy) / lenSq : 0;
        t = Math.max(0, Math.min(1, t));
        const cx = seg.ax + dx * t, cy = seg.ay + dy * t;
        if (Math.hypot(x - cx, y - cy) < threshold) return true;
      }
      return false;
    }

    const obstacles = [];
    const decorations = [];

    function overlapsExisting(x, y, radius) {
      for (const o of obstacles) {
        if (Math.hypot(x - o.x, y - o.y) < radius + o.radius + 16) return true;
      }
      return false;
    }

    function scatterObstacles(minR, maxR, count) {
      for (let i = 0; i < count; i++) {
        for (let attempt = 0; attempt < 10; attempt++) {
          const p = samplePlanetPoint(minR, maxR);
          if (Math.hypot(p.x, p.y) < 170) continue;
          if (nearPath(p.x, p.y, 66)) continue;
          if (isScatterExcluded(plateaus, monsterClearings, p.x, p.y)) continue;
          const area = useAreas ? areaAt(p.x, p.y) : null;
          // 지역별 밀도 배수로 재분배 — 전체 총합은 유지하고 지역마다 빽빽함만 다르게 (로드맵 4 작업 D)
          if (area && rand() > area.densityMul) continue;
          const treeRatio = area ? area.treeRatio : 0.58;
          const isTree = rand() < treeRatio;
          // 로드맵 5 작업 F-2: 나무 반지름 19~32 → 28~46 (충돌 반지름은 collides()에서 따로 상한)
          const radius = isTree ? 28 + rand() * 18 : 13 + rand() * 11;
          if (overlapsExisting(p.x, p.y, radius)) continue;
          obstacles.push({ type: isTree ? 'tree' : 'stone', radius, x: p.x, y: p.y, tone: rand(), sway: rand() * Math.PI * 2 });
          break;
        }
      }
    }
    scatterObstacles(0, radius - 260, opts.obstacleCore ?? 150);
    scatterObstacles(radius - 260, radius - 20, opts.obstacleEdge ?? 90);

    // 로드맵 5 작업 F-1: 덤불 — 절반은 길가(66~150 띠, 옛 scatterPathEdge 자리를 대체),
    // 절반은 절벽/단구 벽 바로 안쪽("단구 아래")에 배치한다. decorations이므로 충돌은 없다.
    function scatterBushes(count) {
      const wallShapes = plateaus.filter((p) => p.shape === 'sector' && (p.kind === 'cliff' || p.kind === 'plateau'));
      for (let i = 0; i < count; i++) {
        const useWall = (i % 2 === 0) && wallShapes.length;
        let x, y, ok = false;
        for (let attempt = 0; attempt < 10 && !ok; attempt++) {
          if (useWall) {
            const shape = wallShapes[Math.floor(rand() * wallShapes.length)];
            let span = shape.bearingTo - shape.bearingFrom; if (span <= 0) span += 360;
            const bearing = shape.bearingFrom + rand() * span;
            const r = Math.max(20, shape.rFrom - 4 - rand() * 20);
            const rad = bearing * Math.PI / 180;
            x = r * Math.sin(rad); y = -r * Math.cos(rad);
          } else {
            const p = samplePlanetPoint(0, radius - 20);
            if (!nearPath(p.x, p.y, 150) || nearPath(p.x, p.y, 66)) continue;
            x = p.x; y = p.y;
          }
          if (isScatterExcluded(plateaus, monsterClearings, x, y)) continue;
          if (overlapsExisting(x, y, 14)) continue;
          ok = true;
        }
        if (!ok) continue;
        decorations.push({ type: 'bush', x, y, tone: rand(), sway: rand() * Math.PI * 2 });
      }
    }
    scatterBushes(opts.bushCount ?? 0);

    // 로드맵 5 작업 F-1: 꽃 무리 중심 — 길가(40%)/물가(35%)/광장 가장자리 고리(25%) 편향
    function clusterCenterFlower() {
      const roll = rand();
      if (roll < 0.4 && pathSegments.length) {
        const seg = pathSegments[Math.floor(rand() * pathSegments.length)];
        const tt = rand();
        const px = seg.ax + (seg.bx - seg.ax) * tt, py = seg.ay + (seg.by - seg.ay) * tt;
        const dx = seg.bx - seg.ax, dy = seg.by - seg.ay;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const side = rand() < 0.5 ? 1 : -1;
        const d = 90 + rand() * 55;
        return { x: px + nx * d * side, y: py + ny * d * side };
      }
      if (roll < 0.75) {
        const waterShapes = plateaus.filter((p) => p.shape === 'sector' && (p.kind === 'water-deep' || p.kind === 'water-shallow'));
        if (waterShapes.length) {
          const shape = waterShapes[Math.floor(rand() * waterShapes.length)];
          const pts = shapeBoundaryPoints(shape, 14);
          const innerPts = pts.slice(0, 15);
          const bp = innerPts[Math.floor(rand() * innerPts.length)];
          const r = Math.hypot(bp.x, bp.y) || 1;
          const pull = 18 + rand() * 30;
          return { x: bp.x * (1 - pull / r), y: bp.y * (1 - pull / r) };
        }
      }
      const bearing = rand() * 360, r = 175 + rand() * 30;
      const rad = bearing * Math.PI / 180;
      return { x: r * Math.sin(rad), y: -r * Math.cos(rad) };
    }
    function scatterClusterFlowers(clusterCount) {
      for (let c = 0; c < clusterCount; c++) {
        let center = null;
        for (let attempt = 0; attempt < 6 && !center; attempt++) {
          const cand = clusterCenterFlower();
          if (Math.hypot(cand.x, cand.y) > radius - 20) continue;
          if (isScatterExcluded(plateaus, monsterClearings, cand.x, cand.y)) continue;
          center = cand;
        }
        if (!center) continue;
        const bloomCount = 6 + Math.floor(rand() * 7);
        const tone = rand();
        for (let i = 0; i < bloomCount; i++) {
          const a = rand() * Math.PI * 2, d = rand() * 45;
          const x = center.x + Math.cos(a) * d, y = center.y + Math.sin(a) * d;
          if (isScatterExcluded(plateaus, monsterClearings, x, y)) continue;
          decorations.push({ type: 'flower', x, y, tone, seed: rand() });
        }
      }
    }
    scatterClusterFlowers(opts.flowerClusters ?? 0);

    // 로드맵 5 작업 F-1: 갈대 무리 — 물가에만(육지 쪽으로 살짝 당김)
    function clusterCenterWaterEdge() {
      const waterShapes = plateaus.filter((p) => p.shape === 'sector' && (p.kind === 'water-deep' || p.kind === 'water-shallow'));
      if (!waterShapes.length) return null;
      const shape = waterShapes[Math.floor(rand() * waterShapes.length)];
      const pts = shapeBoundaryPoints(shape, 14);
      const innerPts = pts.slice(0, 15);
      const bp = innerPts[Math.floor(rand() * innerPts.length)];
      const r = Math.hypot(bp.x, bp.y) || 1;
      const pull = 4 + rand() * 14;
      return { x: bp.x * (1 - pull / r), y: bp.y * (1 - pull / r) };
    }
    function scatterClusterReeds(clusterCount) {
      for (let c = 0; c < clusterCount; c++) {
        const center = clusterCenterWaterEdge();
        if (!center || Math.hypot(center.x, center.y) > radius - 20) continue;
        const bladeCount = 5 + Math.floor(rand() * 5);
        for (let i = 0; i < bladeCount; i++) {
          const a = rand() * Math.PI * 2, d = rand() * 22;
          decorations.push({ type: 'reed', x: center.x + Math.cos(a) * d, y: center.y + Math.sin(a) * d, seed: rand(), sway: rand() * Math.PI * 2 });
        }
      }
    }
    scatterClusterReeds(opts.reedClusters ?? 0);

    // 로드맵 5 작업 F-1: 붉은 버섯 — 몬스터 공터 언저리 또는 나무 그늘
    function scatterRedMushrooms(count) {
      for (let i = 0; i < count; i++) {
        let x, y, ok = false;
        for (let attempt = 0; attempt < 10 && !ok; attempt++) {
          if (rand() < 0.5 && monsterClearings.length) {
            const c = monsterClearings[Math.floor(rand() * monsterClearings.length)];
            const a = rand() * Math.PI * 2, d = c.r + 20 + rand() * 80;
            x = c.x + Math.cos(a) * d; y = c.y + Math.sin(a) * d;
          } else if (obstacles.length) {
            const o = obstacles[Math.floor(rand() * obstacles.length)];
            if (o.type !== 'tree') continue;
            const a = rand() * Math.PI * 2, d = o.radius * 0.6 + rand() * 24;
            x = o.x + Math.cos(a) * d; y = o.y + Math.sin(a) * d;
          } else continue;
          if (Math.hypot(x, y) > radius - 20) continue;
          if (isScatterExcluded(plateaus, monsterClearings, x, y)) continue;
          ok = true;
        }
        if (!ok) continue;
        decorations.push({ type: 'mushroom', x, y, seed: rand(), red: true });
      }
    }
    scatterRedMushrooms(opts.redMushroomCount ?? 0);

    for (let i = 0; i < (opts.mushroomCount ?? 16); i++) {
      const p = samplePlanetPoint(0, radius - 300);
      if (Math.hypot(p.x, p.y) < 130) continue;
      if (isScatterExcluded(plateaus, monsterClearings, p.x, p.y)) continue;
      decorations.push({ type: 'mushroom', x: p.x, y: p.y, seed: rand() });
    }

    // 로드맵 5 작업 E: 떨어진 별 — starCount개 중 starSeeds(§9 별밭 공터에 직접 심는 자리)를
    // 먼저 넣고 나머지는 길가/몬스터 공터 안쪽 편향 배치(실패 시 전역 균일 표본)로 채운다.
    // 서로 140 이상, 기존 오브젝트와 60 이상 떨어지게 한다.
    const fallenStars = (opts.starSeeds || []).map((s) => ({ x: s.x, y: s.y }));
    const starTarget = opts.starCount ?? 0;
    for (let i = fallenStars.length; i < starTarget; i++) {
      let placed = false;
      for (let attempt = 0; attempt < 20 && !placed; attempt++) {
        let x, y;
        const roll = rand();
        if (roll < 0.4 && pathSegments.length) {
          const seg = pathSegments[Math.floor(rand() * pathSegments.length)];
          const tt = rand();
          const px = seg.ax + (seg.bx - seg.ax) * tt, py = seg.ay + (seg.by - seg.ay) * tt;
          const dx = seg.bx - seg.ax, dy = seg.by - seg.ay;
          const len = Math.hypot(dx, dy) || 1;
          const nx = -dy / len, ny = dx / len;
          const side = rand() < 0.5 ? 1 : -1;
          const d = 40 + rand() * 90;
          x = px + nx * d * side; y = py + ny * d * side;
        } else if (roll < 0.7 && monsterClearings.length) {
          const c = monsterClearings[Math.floor(rand() * monsterClearings.length)];
          const a = rand() * Math.PI * 2, d = rand() * c.r * 0.8;
          x = c.x + Math.cos(a) * d; y = c.y + Math.sin(a) * d;
        } else {
          const p = samplePlanetPoint(0, 700);
          x = p.x; y = p.y;
        }
        if (Math.hypot(x, y) > radius - 20) continue;
        if (isScatterExcluded(plateaus, monsterClearings, x, y)) continue;
        if (overlapsExisting(x, y, 60)) continue;
        let farEnough = true;
        for (const s of fallenStars) { if (Math.hypot(x - s.x, y - s.y) < 140) { farEnough = false; break; } }
        if (!farEnough) continue;
        fallenStars.push({ x, y });
        placed = true;
      }
    }
    for (const s of fallenStars) decorations.push({ type: 'star', x: s.x, y: s.y, seed: rand(), phase: rand() * Math.PI * 2 });

    // 로드맵 5 작업 G: 생활의 흔적 — 좌표는 zone1 호출부에서 직접 넘긴다(§10 원칙대로
    // 좌표는 난수가 아니라 직접 박는다). 여기서는 seed/phase만 붙여 decorations에 편입한다.
    for (const d of (opts.lifeTraceDefs || [])) {
      decorations.push({ ...d, seed: rand(), phase: rand() * Math.PI * 2 });
    }

    // 로드맵 5 §4-2/폭포 장식: 마지막까지 미뤄뒀던 광장 소품(착륙 데크·비행정·깃발·등불·
    // 상자·가마솥·부서진 석재·선돌)과 폭포 — G와 같은 패턴으로 좌표를 직접 넘긴다.
    for (const d of (opts.plazaProps || [])) {
      decorations.push({ ...d, seed: rand(), phase: rand() * Math.PI * 2 });
    }

    const spring = opts.spring || null;

    const landmarks = (opts.landmarkDefs || []).map((l) => ({ ...l }));
    let foundCount = 0;

    for (let i = obstacles.length - 1; i >= 0; i--) {
      for (const lm of landmarks) {
        if (Math.hypot(obstacles[i].x - lm.x, obstacles[i].y - lm.y) < 150) { obstacles.splice(i, 1); break; }
      }
    }

    const GRID_N = Math.ceil((radius * 2) / CELL);
    const GRID_ORIGIN = -radius;
    const explored = new Uint8Array(GRID_N * GRID_N);
    let totalCells = 0;
    for (let gy = 0; gy < GRID_N; gy++) {
      for (let gx = 0; gx < GRID_N; gx++) {
        const wx = GRID_ORIGIN + (gx + 0.5) * CELL;
        const wy = GRID_ORIGIN + (gy + 0.5) * CELL;
        if (Math.hypot(wx, wy) <= radius) totalCells++;
      }
    }

    const FOG_SCALE = FOG_SIZE / (radius * 2);
    const fogCanvas = document.createElement('canvas');
    fogCanvas.width = FOG_SIZE; fogCanvas.height = FOG_SIZE;
    const fogCtx = fogCanvas.getContext('2d');
    fogCtx.fillStyle = '#6fbf72';

    const terrainPatches = [];
    for (let i = 0; i < (opts.terrainCount ?? 20); i++) {
      const p = samplePlanetPoint(0, radius);
      terrainPatches.push({ x: p.x, y: p.y, w: 140 + rand() * 90, angle: rand() * Math.PI });
    }
    const grassTufts = [];
    // 로드맵 5 작업 F-1: 초목이 꽃/갈대/덤불로 세분화됐으므로 밀도 기본값을 1400→1100으로 낮춤
    for (let i = 0; i < (opts.grassCount ?? 1100); i++) {
      const p = samplePlanetPoint(0, radius);
      grassTufts.push({ x: p.x, y: p.y, len: 4 + rand() * 6, angle: rand() * Math.PI * 2, phase: rand() * Math.PI * 2, tone: rand() });
    }
    const spores = [];
    for (let i = 0; i < (opts.sporeCount ?? 26); i++) {
      const p = samplePlanetPoint(0, HORIZON_D * 0.9);
      spores.push({ x: p.x, y: p.y, speed: 5 + rand() * 8, size: 1.6 + rand() * 2.2, phase: rand() * Math.PI * 2 });
    }
    // 로드맵 5 작업 E: 떨어진 별 주변은 반딧불이(spores) 밀도를 국소적으로 올린다 —
    // 별마다 반경 70 안에 2개씩 추가로 심어 "근처가 확실히 더 반짝이게" 함
    for (const s of fallenStars) {
      for (let i = 0; i < 2; i++) {
