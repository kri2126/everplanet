<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아스마라 탐사</title>
<style>
  :root{
    --bg-page:#fff2e2;
    --panel:#fffaf2;
    --panel-2:#fff4e6;
    --line:#f0d9b8;
    --text-primary:#5b4632;
    --text-muted:#a8916f;
    --accent:#ff8aa0;
    --accent-soft:rgba(255,138,160,.16);
    --accent-line:rgba(255,138,160,.4);
    --mint:#4fb787;
    --mono-num:#3f8f66;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg-page);
    color:var(--text-primary);
    font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 16px 28px;
    gap:14px;
  }

  .frame{
    width:100%;
    max-width:980px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    padding:14px 18px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
  }

  .title-block{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }

  .planet-glyph{
    width:38px;
    height:38px;
    border-radius:50%;
    flex:none;
    background:
      radial-gradient(circle at 32% 28%, #d9ffe4 0%, #9fe0a6 46%, #3f8f66 100%);
    box-shadow:0 4px 0 rgba(63,143,102,.25);
  }

  h1{
    font-family:'Black Han Sans','Gowun Dodum',sans-serif;
    font-weight:400;
    font-size:1.5rem;
    letter-spacing:.01em;
    margin:0;
    line-height:1.1;
    text-wrap:balance;
  }

  .subtitle{
    margin:2px 0 0;
    font-size:.8rem;
    color:var(--text-muted);
  }

  .phase-chip{
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-size:.68rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#c65a75;
    background:var(--accent-soft);
    border:1px solid var(--accent-line);
    border-radius:999px;
    padding:6px 12px;
    white-space:nowrap;
  }

  .stage{
    position:relative;
    width:100%;
    aspect-ratio:16/10;
    border-radius:20px;
    overflow:hidden;
    border:1px solid var(--line);
    background:linear-gradient(180deg,#5fb6ea 0%,#bfe3ff 60%,#eaf6ff 100%);
    box-shadow:0 24px 50px -28px rgba(120,90,60,.45);
    touch-action:none;
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
  }

  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    box-shadow:inset 0 0 90px 20px rgba(255,255,255,.10), inset 0 0 130px 46px rgba(40,50,30,.14);
  }

  .hint{
    position:absolute;
    top:14px;
    left:14px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    max-width:calc(100% - 28px);
  }

  kbd{
    font-family:'JetBrains Mono',monospace;
    font-size:.68rem;
    background:rgba(255,250,242,.85);
    border:1px solid rgba(91,70,50,.18);
    color:var(--text-primary);
    padding:4px 8px;
    border-radius:7px;
    backdrop-filter:blur(2px);
  }

  .joystick-zone{
    position:absolute;
    left:22px;
    bottom:22px;
    width:104px;
    height:104px;
    border-radius:50%;
    background:rgba(255,250,242,.45);
    border:1px solid rgba(91,70,50,.22);
    touch-action:none;
  }

  .joystick-zone[hidden]{display:none!important;}

  .joystick-stick{
    position:absolute;
    width:44px;
    height:44px;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%, #ffd0da, var(--accent));
    box-shadow:0 4px 10px rgba(198,90,117,.35);
  }

  footer.hud{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    padding:10px 18px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:18px;
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    color:var(--text-muted);
  }

  .hud-field{display:flex;gap:6px;align-items:baseline;}
  .hud-field b{color:var(--mono-num);font-weight:600;font-variant-numeric:tabular-nums;}

  .legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    color:var(--text-muted);
    font-size:.72rem;
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:9px;height:9px;border-radius:3px;flex:none;}

  /* 터치 기기에서는 키보드 안내가 의미 없다 (조이스틱 + 미니맵 탭으로 안내) */
  @media (pointer: coarse){
    .hint{display:none;}
  }

  .toast{
    position:absolute;
    left:50%;
    top:64px;
    transform:translate(-50%,-6px);
    padding:9px 18px;
    border-radius:999px;
    background:rgba(255,250,242,.94);
    border:1px solid var(--accent-line);
    color:var(--text-primary);
    font-size:.82rem;
    letter-spacing:.01em;
    white-space:nowrap;
    box-shadow:0 10px 24px -12px rgba(120,90,60,.5);
    opacity:0;
    pointer-events:none;
    transition:opacity .28s ease, transform .28s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast.final{background:rgba(255,238,243,.96);border-color:var(--accent);}

  @media (max-width:600px){
    h1{font-size:1.25rem;}
    .phase-chip{display:none;}
    .toast{font-size:.74rem;top:52px;padding:7px 14px;}
    .legend{display:none;}
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<div class="frame">
  <header class="top">
    <div class="title-block">
      <div class="planet-glyph" aria-hidden="true"></div>
      <div>
        <h1>아스마라 탐사</h1>
        <p class="subtitle">에버플래닛 프로토타입 · 2단계 — 지도를 그리며 랜드마크를 찾아서</p>
      </div>
    </div>
    <span class="phase-chip">PHASE 2 · MAP &amp; LANDMARK</span>
  </header>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="vignette"></div>
    <div class="hint">
      <kbd>W A S D</kbd><kbd>방향키</kbd><kbd>이동</kbd><kbd>M</kbd><kbd>지도</kbd>
    </div>
    <div class="toast" id="toast"></div>
    <div class="joystick-zone" id="joyZone" hidden>
      <div class="joystick-stick" id="joyStick"></div>
    </div>
  </div>

  <footer class="hud">
    <div class="hud-field">위치 <b id="posDir">출발점</b></div>
    <div class="hud-field">탐험도 <b id="explorePct">0%</b></div>
    <div class="hud-field">발견 <b id="foundLabel">0/5</b></div>
    <div class="legend">
      <span><i class="swatch" style="background:#ff8aa0"></i>플레이어</span>
      <span><i class="swatch" style="background:#4fa066"></i>나무</span>
      <span><i class="swatch" style="background:#b9aec2"></i>바위</span>
      <span><i class="swatch" style="background:#f0b23c"></i>랜드마크</span>
    </div>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const posDirEl = document.getElementById('posDir');
  const explorePctEl = document.getElementById('explorePct');
  const foundLabelEl = document.getElementById('foundLabel');
  const toastEl = document.getElementById('toast');
  const joyZone = document.getElementById('joyZone');
  const joyStick = document.getElementById('joyStick');

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- 시드 고정 의사난수 ----------
  function mulberry32(seed) {
    return function() {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(20260913);

  // ---------- 작은 행성 투영 ----------
  // 실제 에버플래닛의 "글로브 뷰"를 참고: 캐릭터를 구(sphere)의 정점에 세워두고
  // 정사영(orthographic) 방식으로 주변을 투영한다. 그러면 지평선 너머(구의 반대쪽 면)는
  // 자연스럽게 화면에서 사라지고, 앞으로 걸어가야만 새로 드러난다 - 안개 같은 눈속임이 아니라
  // 실제 "작은 행성 위에 서 있는" 기하학으로 시야 제한을 구현한다.
  const PLANET_R = 520;              // 구의 반지름 (클수록 완만하고 시야가 넓어짐)
  const HORIZON_D = PLANET_R * Math.PI / 2 * 0.985; // 이 거리 너머는 지평선 아래로 사라짐
  const WORLD_RADIUS = 1500;         // 실제로 걸어다닐 수 있는 전체 범위(경계)
  const PLAYER_RADIUS = 15;
  // 완전히 위에서 내려다보는 정수직 시점 대신, 카메라를 살짝 앞으로 기울여
  // "대각선으로 내려다보는" 3인칭 느낌을 낸다. 1에 가까울수록 완전 탑뷰, 작을수록 더 기울어짐.
  const TILT = 0.62;

  function project(x, y) {
    const relx = x - player.x, rely = y - player.y;
    const d = Math.hypot(relx, rely);
    if (d > HORIZON_D) return null;
    const angle = Math.atan2(rely, relx);
    const screenDist = PLANET_R * Math.sin(d / PLANET_R);
    const scale = Math.max(0.001, Math.cos(d / PLANET_R));
    return { sx: Math.cos(angle) * screenDist, sy: Math.sin(angle) * screenDist * TILT, scale, d };
  }

  // 높은 랜드마크 전용 투영.
  // 지구에서 수평선 너머의 배가 돛대부터 보이듯, 높은 물체는 지평선 너머에서도 꼭대기가 보인다.
  // 가시 거리를 높이에 비례해 늘리고, 지평선 너머에 있을 때는 지평선에 붙여 그리면서
  // 아래쪽을 잘라(sink) 꼭대기만 드러나게 한다. 또 너무 작아져 점이 되지 않도록 최소 배율을 둔다.
  // 최소 배율이 너무 작으면 먼 랜드마크가 몇 px짜리 점이 되어 "저기 뭔가 보인다"가 성립하지 않는다.
  // 일반 오브젝트의 축소(cos)를 따르되 0.32 아래로는 줄어들지 않게 하고, 가라앉는 정도도 0.65에서 멈춘다.
  const LM_MIN_SCALE = 0.32;
  const LM_MAX_SINK = 0.65;
  function projectTall(x, y, height) {
    const relx = x - player.x, rely = y - player.y;
    const d = Math.hypot(relx, rely);
    const extra = height * 4;
    const maxD = HORIZON_D + extra;
    if (d > maxD) return null;
    const angle = Math.atan2(rely, relx);
    const dd = Math.min(d, HORIZON_D);              // 지평선 너머면 지평선 위치에 고정
    const screenDist = PLANET_R * Math.sin(dd / PLANET_R);
    const scale = Math.max(LM_MIN_SCALE, Math.cos(dd / PLANET_R));
    // sink 0 = 전체가 보임, 1 = 완전히 지평선 아래
    const raw = extra > 0 ? Math.max(0, d - HORIZON_D) / extra : 0;
    const sink = Math.min(LM_MAX_SINK, Math.pow(raw, 1.3));
    return {
      sx: Math.cos(angle) * screenDist,
      sy: Math.sin(angle) * screenDist * TILT,
      scale, d, sink
    };
  }

  // 균등 분포로 원형 필드 안에 점 뿌리기
  function samplePlanetPoint(minR, maxR) {
    const r = Math.sqrt(rand()) * (maxR - minR) + minR;
    const a = rand() * Math.PI * 2;
    return { x: Math.cos(a) * r, y: Math.sin(a) * r };
  }

  // ---------- 장식용 오솔길 (이동 제한 없음 - 시선을 안내하는 용도) ----------
  const pathPts = [
    { x: 10, y: 10 }, { x: 150, y: -230 }, { x: 30, y: -480 },
    { x: 200, y: -740 }, { x: 90, y: -1020 }
  ];
  const pathTiles = [];
  const pathFences = [];
  for (let i = 0; i < pathPts.length - 1; i++) {
    const a = pathPts[i], b = pathPts[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
    const tileCount = Math.round(len / 58);
    for (let j = 0; j < tileCount; j++) {
      const t = (j + 0.5) / tileCount;
      pathTiles.push({
        x: a.x + dx * t, y: a.y + dy * t,
        angle: Math.atan2(dy, dx),
        tone: (i + j) % 2
      });
    }
    const fenceCount = Math.round(len / 150);
    for (let j = 0; j < fenceCount; j++) {
      const t = (j + 0.5) / fenceCount;
      for (const side of [1, -1]) {
        pathFences.push({
          x: a.x + dx * t + nx * 78 * side,
          y: a.y + dy * t + ny * 78 * side,
          angle: Math.atan2(dy, dx)
        });
      }
    }
  }
  function nearPath(x, y, threshold) {
    for (let i = 0; i < pathPts.length - 1; i++) {
      const a = pathPts[i], b = pathPts[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const lenSq = dx * dx + dy * dy;
      let t = lenSq > 0 ? ((x - a.x) * dx + (y - a.y) * dy) / lenSq : 0;
      t = Math.max(0, Math.min(1, t));
      const cx = a.x + dx * t, cy = a.y + dy * t;
      if (Math.hypot(x - cx, y - cy) < threshold) return true;
    }
    return false;
  }

  // ---------- 자연물 배치 ----------
  const obstacles = [];   // 나무 / 바위 (충돌 O)
  const decorations = []; // 버섯 (충돌 X)

  function overlapsExisting(x, y, radius) {
    for (const o of obstacles) {
      if (Math.hypot(x - o.x, y - o.y) < radius + o.radius + 16) return true;
    }
    return false;
  }

  function scatterObstacles(minR, maxR, count) {
    for (let i = 0; i < count; i++) {
      for (let attempt = 0; attempt < 10; attempt++) {
        const p = samplePlanetPoint(minR, maxR);
        if (Math.hypot(p.x, p.y) < 170) continue;
        if (nearPath(p.x, p.y, 66)) continue;
        const isTree = rand() < 0.58;
        const radius = isTree ? 19 + rand() * 13 : 13 + rand() * 11;
        if (overlapsExisting(p.x, p.y, radius)) continue;
        obstacles.push({ type: isTree ? 'tree' : 'stone', radius, x: p.x, y: p.y, tone: rand(), sway: rand() * Math.PI * 2 });
        break;
      }
    }
  }
  scatterObstacles(0, WORLD_RADIUS - 260, 150);
  scatterObstacles(WORLD_RADIUS - 260, WORLD_RADIUS - 20, 90); // 가장자리 - 경계를 자연스럽게 가려주는 숲

  for (let i = 0; i < 16; i++) {
    const p = samplePlanetPoint(0, WORLD_RADIUS - 300);
    if (Math.hypot(p.x, p.y) < 130) continue;
    decorations.push({ type: 'mushroom', x: p.x, y: p.y, seed: rand() });
  }

  const spring = { x: 230, y: -110, radius: 50 };

  // ---------- 랜드마크 ----------
  // 행성 곳곳에 실루엣이 확실히 다른 목표물을 배치한다. height가 클수록 더 멀리서 보인다.
  // 샘물은 기존 자산을 그대로 쓰므로 draw를 갖지 않는다(별도로 그려짐).
  const landmarks = [
    { id: 'spring',  name: '샘물 지대',   x: 230,   y: -110,  height: 0,   solid: 0,  tint: '#6ec6e8' },
    { id: 'tree',    name: '거대 고목',   x: 100,   y: -1150, height: 120, solid: 46, tint: '#3f9a63' },
    { id: 'rock',    name: '바위산',     x: 1180,  y: -200,  height: 105, solid: 52, tint: '#a99cb8' },
    { id: 'ruins',   name: '석조 유적',   x: -950,  y: 780,   height: 70,  solid: 48, tint: '#d8c9a8' },
    { id: 'crystal', name: '빛나는 결정', x: -1250, y: -350,  height: 95,  solid: 34, tint: '#c79bf0' }
  ];
  const DISCOVER_R = 120;
  let foundCount = 0;

  // 랜드마크 자리에 겹친 나무/바위는 치운다
  for (let i = obstacles.length - 1; i >= 0; i--) {
    for (const lm of landmarks) {
      if (Math.hypot(obstacles[i].x - lm.x, obstacles[i].y - lm.y) < 150) { obstacles.splice(i, 1); break; }
    }
  }

  // 받침조사 판별 (발견 알림 문구용)
  function withObjParticle(name) {
    const code = name.charCodeAt(name.length - 1);
    if (code < 0xAC00 || code > 0xD7A3) return name + '를';
    return name + ((code - 0xAC00) % 28 === 0 ? '를' : '을');
  }

  // ---------- 탐험 기록 (fog of war) ----------
  // 시야 반경은 804지만 그 근처는 축소율 2.4%라 사실상 보이지 않는다.
  // "형태를 알아볼 수 있는 거리"인 500까지만 탐험으로 인정한다.
  const EXPLORE_R = 500;
  const CELL = 50;
  const GRID_N = Math.ceil((WORLD_RADIUS * 2) / CELL);
  const GRID_ORIGIN = -WORLD_RADIUS;
  const explored = new Uint8Array(GRID_N * GRID_N);
  let exploredCount = 0;
  let totalCells = 0;
  for (let gy = 0; gy < GRID_N; gy++) {
    for (let gx = 0; gx < GRID_N; gx++) {
      const wx = GRID_ORIGIN + (gx + 0.5) * CELL;
      const wy = GRID_ORIGIN + (gy + 0.5) * CELL;
      if (Math.hypot(wx, wy) <= WORLD_RADIUS) totalCells++;
    }
  }

  // 밝혀진 영역은 별도 캔버스에 원으로 누적한다(격자보다 훨씬 자연스러운 모양이 나온다).
  // 격자는 탐험도 % 계산에만 쓴다.
  const FOG_SIZE = 600;
  const FOG_SCALE = FOG_SIZE / (WORLD_RADIUS * 2);
  const fogCanvas = document.createElement('canvas');
  fogCanvas.width = FOG_SIZE; fogCanvas.height = FOG_SIZE;
  const fogCtx = fogCanvas.getContext('2d');
  fogCtx.fillStyle = '#6fbf72';

  let lastExploreX = Infinity, lastExploreY = Infinity;
  function updateExploration() {
    if (Math.hypot(player.x - lastExploreX, player.y - lastExploreY) < 25) return;
    lastExploreX = player.x; lastExploreY = player.y;

    fogCtx.beginPath();
    fogCtx.arc((player.x - GRID_ORIGIN) * FOG_SCALE, (player.y - GRID_ORIGIN) * FOG_SCALE, EXPLORE_R * FOG_SCALE, 0, Math.PI * 2);
    fogCtx.fill();

    const gx0 = Math.max(0, Math.floor((player.x - EXPLORE_R - GRID_ORIGIN) / CELL));
    const gx1 = Math.min(GRID_N - 1, Math.floor((player.x + EXPLORE_R - GRID_ORIGIN) / CELL));
    const gy0 = Math.max(0, Math.floor((player.y - EXPLORE_R - GRID_ORIGIN) / CELL));
    const gy1 = Math.min(GRID_N - 1, Math.floor((player.y + EXPLORE_R - GRID_ORIGIN) / CELL));
    for (let gy = gy0; gy <= gy1; gy++) {
      for (let gx = gx0; gx <= gx1; gx++) {
        const idx = gy * GRID_N + gx;
        if (explored[idx]) continue;
        const wx = GRID_ORIGIN + (gx + 0.5) * CELL;
        const wy = GRID_ORIGIN + (gy + 0.5) * CELL;
        if (Math.hypot(wx, wy) > WORLD_RADIUS) continue;
        if (Math.hypot(wx - player.x, wy - player.y) > EXPLORE_R) continue;
        explored[idx] = 1;
        exploredCount++;
      }
    }
  }
  const signpost = { x: pathPts[pathPts.length - 1].x, y: pathPts[pathPts.length - 1].y - 30 };

  // 지형 얼룩(넓은 톤 변화) + 잔디 - 필드 전체에 균등 분포
  const terrainPatches = [];
  for (let i = 0; i < 20; i++) {
    const p = samplePlanetPoint(0, WORLD_RADIUS);
    terrainPatches.push({ x: p.x, y: p.y, w: 140 + rand() * 90, angle: rand() * Math.PI });
  }
  const grassTufts = [];
  for (let i = 0; i < 1400; i++) {
    const p = samplePlanetPoint(0, WORLD_RADIUS);
    grassTufts.push({ x: p.x, y: p.y, len: 4 + rand() * 6, angle: rand() * Math.PI * 2, phase: rand() * Math.PI * 2, tone: rand() });
  }
  const spores = [];
  for (let i = 0; i < 26; i++) {
    const p = samplePlanetPoint(0, HORIZON_D * 0.9);
    spores.push({ x: p.x, y: p.y, speed: 5 + rand() * 8, size: 1.6 + rand() * 2.2, phase: rand() * Math.PI * 2 });
  }

  // 하늘의 구름 (화면 고정 레이어, 완만하게 흘러감)
  const clouds = [];
  for (let i = 0; i < 9; i++) {
    clouds.push({ x: rand() * 1.4 - 0.2, y: 0.05 + rand() * 0.32, w: 60 + rand() * 90, speed: 4 + rand() * 6, tone: rand() });
  }

  // ---------- 플레이어 ----------
  const player = { x: 0, y: 60, facing: { x: 0, y: -1 } };

  // ---------- 입력 ----------
  const keys = new Set();
  let mapOpen = false;
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    keys.add(k);
    if (k === 'm') { mapOpen = !mapOpen; keys.clear(); e.preventDefault(); }
    else if (k === 'escape' && mapOpen) { mapOpen = false; }
  });
  window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

  // 모바일: 미니맵을 탭하면 전체 지도, 지도 밖을 탭하면 닫힘
  let minimapHit = { cx: 0, cy: 0, r: 0 };
  let fullmapHit = { cx: 0, cy: 0, r: 0 };
  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    if (mapOpen) {
      if (Math.hypot(px - fullmapHit.cx, py - fullmapHit.cy) > fullmapHit.r) mapOpen = false;
    } else if (Math.hypot(px - minimapHit.cx, py - minimapHit.cy) <= minimapHit.r) {
      mapOpen = true;
    }
  });

  let joyVector = { x: 0, y: 0 };
  let joyActive = false;
  let joyPointerId = null;

  const isTouch = matchMedia('(pointer: coarse)').matches;
  if (isTouch) joyZone.hidden = false;

  function setJoyFromEvent(e) {
    const rect = joyZone.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const max = rect.width / 2;
    const dist = Math.min(Math.hypot(dx, dy), max);
    const angle = Math.atan2(dy, dx);
    dx = Math.cos(angle) * dist;
    dy = Math.sin(angle) * dist;
    joyStick.style.left = `calc(50% + ${dx}px)`;
    joyStick.style.top = `calc(50% + ${dy}px)`;
    joyVector = { x: dx / max, y: dy / max };
  }

  joyZone.addEventListener('pointerdown', (e) => {
    joyActive = true;
    joyPointerId = e.pointerId;
    joyZone.setPointerCapture(e.pointerId);
    setJoyFromEvent(e);
  });
  joyZone.addEventListener('pointermove', (e) => {
    if (!joyActive || e.pointerId !== joyPointerId) return;
    setJoyFromEvent(e);
  });
  function releaseJoy(e) {
    if (e.pointerId !== joyPointerId) return;
    joyActive = false;
    joyVector = { x: 0, y: 0 };
    joyStick.style.left = '50%';
    joyStick.style.top = '50%';
  }
  joyZone.addEventListener('pointerup', releaseJoy);
  joyZone.addEventListener('pointercancel', releaseJoy);

  // ---------- 충돌 ----------
  function collides(x, y) {
    if (Math.hypot(x, y) > WORLD_RADIUS - PLAYER_RADIUS - 12) return true;
    for (const o of obstacles) {
      const solidRadius = o.type === 'tree' ? o.radius * 0.5 : o.radius * 0.82;
      if (Math.hypot(x - o.x, y - o.y) < PLAYER_RADIUS + solidRadius) return true;
    }
    for (const lm of landmarks) {
      if (lm.solid && Math.hypot(x - lm.x, y - lm.y) < PLAYER_RADIUS + lm.solid) return true;
    }
    return false;
  }

  // 나무에 정면으로 부딪히면 완전히 멈춰서 "멀리 보이는 랜드마크로 걸어간다"는 흐름이 끊긴다.
  // 막혔을 때는 진행 방향을 조금씩 틀어서 장애물을 타고 미끄러지게 한다.
  function tryMove(dx, dy, dist) {
    const nx = player.x + dx * dist, ny = player.y + dy * dist;
    if (!collides(nx, ny)) { player.x = nx; player.y = ny; return; }
    if (dx && !collides(player.x + dx * dist, player.y)) { player.x += dx * dist; return; }
    if (dy && !collides(player.x, player.y + dy * dist)) { player.y += dy * dist; return; }
    const px = -dy, py = dx;                       // 진행 방향의 수직
    for (const blend of [0.7, 1]) {
      for (const sign of [1, -1]) {
        const sx = dx * 0.35 + px * sign * blend;
        const sy = dy * 0.35 + py * sign * blend;
        const len = Math.hypot(sx, sy) || 1;
        const cx = player.x + (sx / len) * dist;
        const cy = player.y + (sy / len) * dist;
        if (!collides(cx, cy)) { player.x = cx; player.y = cy; return; }
      }
    }
  }

  function resize() {
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    canvas.viewW = rect.width;
    canvas.viewH = rect.height;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 그리기 헬퍼 (모두 화면 좌표계에서 동작) ----------
  function drawSky(viewW, viewH, t) {
    const grad = ctx.createLinearGradient(0, 0, 0, viewH);
    grad.addColorStop(0, '#5fb6ea');
    grad.addColorStop(0.6, '#bfe3ff');
    grad.addColorStop(1, '#eaf6ff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, viewW, viewH);

    for (const c of clouds) {
      const drift = reduceMotion ? 0 : (t * c.speed) % (viewW + c.w * 3);
      const cx = ((c.x * viewW + drift) % (viewW + c.w * 3)) - c.w * 1.5;
      const cy = c.y * viewH;
      ctx.fillStyle = c.tone > 0.5 ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.ellipse(cx, cy, c.w, c.w * 0.4, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - c.w * 0.5, cy + c.w * 0.08, c.w * 0.55, c.w * 0.28, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + c.w * 0.5, cy + c.w * 0.1, c.w * 0.5, c.w * 0.26, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPlanetDome(cx, cy) {
    // TILT만큼 세로로 눌러서 그리면 원형 돔이 카메라를 기울인 것처럼 타원으로 보인다
    // (그라디언트/도형 자체는 정원으로 만든 뒤 좌표계만 눌러서, 비율이 항상 정확히 맞는다)
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, TILT);
    const grad = ctx.createRadialGradient(0, -PLANET_R * 0.1, PLANET_R * 0.08, 0, 0, PLANET_R);
    grad.addColorStop(0, '#7fd48a');
    grad.addColorStop(0.55, '#5fbf5a');
    grad.addColorStop(0.86, '#4aa14f');
    grad.addColorStop(1, '#bfe3ff'); // 지평선에서 하늘색으로 부드럽게 이어짐
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, PLANET_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawMushroom(seed) {
    const scale = 0.85 + seed * 0.4;
    const capColor = seed > 0.5 ? '#ff8aa0' : '#ffb454';
    ctx.save();
    ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0, 3, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff4e6';
    ctx.fillRect(-3, -6, 6, 9);
    ctx.beginPath(); ctx.arc(0, -6, 9, Math.PI, 0);
    ctx.fillStyle = capColor; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(-4, -9, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -8, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawFence(angle) {
    ctx.save();
    ctx.rotate(angle);
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath(); ctx.ellipse(0, 8, 22, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a97a4a';
    ctx.fillRect(-16, -10, 5, 20);
    ctx.fillRect(11, -10, 5, 20);
    ctx.fillStyle = '#c79764';
    ctx.fillRect(-18, -6, 36, 5);
    ctx.fillRect(-18, 2, 36, 5);
    ctx.restore();
  }

  function drawSignpost() {
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath(); ctx.ellipse(0, 10, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a97a4a';
    ctx.fillRect(-4, -34, 8, 44);
    ctx.fillStyle = '#e7c88f';
    ctx.beginPath();
    ctx.moveTo(-30, -40); ctx.lineTo(30, -40); ctx.lineTo(30, -14); ctx.lineTo(-30, -14); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#a97a4a';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#7a5230';
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', 0, -27);
  }

  function drawSpring() {
    ctx.fillStyle = '#c9a86a';
    ctx.beginPath(); ctx.ellipse(0, 6, spring.radius * 1.1, spring.radius * 0.76, 0, 0, Math.PI * 2); ctx.fill();
    const waterGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, spring.radius);
    waterGrad.addColorStop(0, '#dff7ff'); waterGrad.addColorStop(1, '#6ec6e8');
    ctx.fillStyle = waterGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, spring.radius * 0.9, spring.radius * 0.62, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c7c1d6';
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * spring.radius * 0.95, Math.sin(a) * spring.radius * 0.66, 8, 6, a, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawTree(o, t) {
    const sway = reduceMotion ? 0 : Math.sin(t * 1.2 + o.sway) * 0.05;
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath(); ctx.ellipse(0, o.radius * 0.55, o.radius * 0.9, o.radius * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b98452';
    ctx.fillRect(-o.radius * 0.12, -o.radius * 0.1, o.radius * 0.24, o.radius * 0.7);
    ctx.save();
    ctx.translate(0, -o.radius * 0.55);
    ctx.rotate(sway);
    ctx.fillStyle = o.tone > 0.5 ? '#5aba7c' : '#4fa066';
    ctx.beginPath(); ctx.arc(0, 0, o.radius, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-o.radius * 0.35, -o.radius * 0.3, o.radius * 0.65, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.arc(-o.radius * 0.3, -o.radius * 0.45, o.radius * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawStone(o) {
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath(); ctx.ellipse(0, o.radius * 0.5, o.radius * 0.9, o.radius * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = o.tone > 0.5 ? '#cdc6dd' : '#b9aec2';
    ctx.beginPath(); ctx.ellipse(0, 0, o.radius, o.radius * 0.82, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.ellipse(-o.radius * 0.32, -o.radius * 0.3, o.radius * 0.32, o.radius * 0.2, 0, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- 랜드마크 그리기 ----------
  function drawGroundShadow(rx) {
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath(); ctx.ellipse(0, 6, rx, rx * 0.32, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawBigTree(t) {
    const sway = reduceMotion ? 0 : Math.sin(t * 0.8) * 0.03;
    drawGroundShadow(62);
    ctx.fillStyle = '#a9743f';
    ctx.beginPath();
    ctx.moveTo(-17, 8); ctx.lineTo(-10, -58); ctx.lineTo(10, -58); ctx.lineTo(17, 8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(4, -58, 8, 66);
    ctx.save();
    ctx.translate(0, -62);
    ctx.rotate(sway);
    ctx.fillStyle = '#3f9a63';
    ctx.beginPath(); ctx.ellipse(0, 0, 66, 40, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-34, -22, 38, 27, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(32, -20, 34, 25, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#56b87a';
    ctx.beginPath(); ctx.ellipse(-6, -34, 40, 26, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.26)';
    ctx.beginPath(); ctx.ellipse(-24, -44, 20, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawRockPeak() {
    drawGroundShadow(64);
    ctx.fillStyle = '#9c90ad';
    ctx.beginPath();
    ctx.moveTo(-58, 8); ctx.lineTo(-22, -68); ctx.lineTo(6, -34); ctx.lineTo(26, -96);
    ctx.lineTo(60, 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b9aec2';
    ctx.beginPath();
    ctx.moveTo(26, -96); ctx.lineTo(60, 8); ctx.lineTo(18, 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(26, -96); ctx.lineTo(38, -62); ctx.lineTo(14, -62); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-22, -68); ctx.lineTo(-10, -44); ctx.lineTo(-33, -44); ctx.closePath(); ctx.fill();
  }

  function drawRuins() {
    drawGroundShadow(58);
    ctx.fillStyle = '#c7b795';
    ctx.beginPath(); ctx.ellipse(0, 4, 54, 15, 0, 0, Math.PI * 2); ctx.fill();
    const cols = [[-38, 52], [-12, 74], [16, 38], [40, 62]];
    for (const [x, h] of cols) {
      ctx.fillStyle = '#e0d2b2';
      ctx.fillRect(x - 9, -h, 18, h);
      ctx.fillStyle = 'rgba(0,0,0,0.13)';
      ctx.fillRect(x + 3, -h, 6, h);
      ctx.fillStyle = '#d8c9a8';
      ctx.beginPath(); ctx.ellipse(x, -h, 13, 5, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#d8c9a8';
    ctx.fillRect(-46, -80, 46, 9);
  }

  function drawCrystal(t) {
    const pulse = reduceMotion ? 0.5 : (Math.sin(t * 1.5) + 1) / 2;
    drawGroundShadow(40);
    ctx.save();
    ctx.globalAlpha *= 0.28 + pulse * 0.3;
    const glow = ctx.createRadialGradient(0, -52, 4, 0, -52, 62);
    glow.addColorStop(0, '#f0ddff'); glow.addColorStop(1, 'rgba(199,155,240,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, -52, 62, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    const shards = [[0, -104, 17], [-24, -62, 12], [22, -70, 13]];
    for (const [x, top, w] of shards) {
      ctx.fillStyle = '#b87fe6';
      ctx.beginPath();
      ctx.moveTo(x, top); ctx.lineTo(x + w, top * 0.36); ctx.lineTo(x, 8); ctx.lineTo(x - w, top * 0.36);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.42)';
      ctx.beginPath();
      ctx.moveTo(x, top); ctx.lineTo(x + w, top * 0.36); ctx.lineTo(x, top * 0.36);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawLandmarkBody(lm, t) {
    if (lm.id === 'tree') drawBigTree(t);
    else if (lm.id === 'rock') drawRockPeak();
    else if (lm.id === 'ruins') drawRuins();
    else if (lm.id === 'crystal') drawCrystal(t);
  }

  function drawPathTile(tone, angle) {
    ctx.save();
    ctx.rotate(angle);
    ctx.fillStyle = tone === 0 ? '#cbb98f' : '#bfa97c';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(-30, -68, 60, 70, 8) : ctx.rect(-30, -68, 60, 70);
    ctx.fill();
    ctx.restore();
  }

  function drawPlayer(t, moving) {
    const bob = reduceMotion || !moving ? 0 : Math.sin(t * 9) * 1.6;
    ctx.save();
    ctx.translate(0, bob);

    ctx.fillStyle = 'rgba(60,40,30,0.22)';
    ctx.beginPath(); ctx.ellipse(0, PLAYER_RADIUS * 0.9, PLAYER_RADIUS * 0.85, PLAYER_RADIUS * 0.32, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#4fb787';
    ctx.beginPath(); ctx.ellipse(0, PLAYER_RADIUS * 0.55, PLAYER_RADIUS * 0.62, PLAYER_RADIUS * 0.5, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#3f8f66';
    ctx.beginPath(); ctx.ellipse(-PLAYER_RADIUS * 0.28, PLAYER_RADIUS * 0.98, 5, 3.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(PLAYER_RADIUS * 0.28, PLAYER_RADIUS * 0.98, 5, 3.4, 0, 0, Math.PI * 2); ctx.fill();

    const headGrad = ctx.createRadialGradient(-5, -8, 3, 0, -2, PLAYER_RADIUS + 4);
    headGrad.addColorStop(0, '#ffe9d2'); headGrad.addColorStop(1, '#ffd9b8');
    ctx.fillStyle = headGrad;
    ctx.beginPath(); ctx.arc(0, -PLAYER_RADIUS * 0.35, PLAYER_RADIUS, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(140,100,60,0.35)'; ctx.lineWidth = 1.4; ctx.stroke();

    ctx.fillStyle = '#8a5a3a';
    ctx.beginPath(); ctx.arc(0, -PLAYER_RADIUS * 0.9, PLAYER_RADIUS * 0.92, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();

    const eyeOffX = player.facing.x * 1.6, eyeOffY = player.facing.y * 1.2;
    ctx.fillStyle = '#4a3324';
    ctx.beginPath(); ctx.arc(-4 + eyeOffX, -PLAYER_RADIUS * 0.38 + eyeOffY, 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4 + eyeOffX, -PLAYER_RADIUS * 0.38 + eyeOffY, 1.7, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'rgba(255,140,150,0.55)';
    ctx.beginPath(); ctx.ellipse(-PLAYER_RADIUS * 0.55, -PLAYER_RADIUS * 0.18, 2.6, 1.7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(PLAYER_RADIUS * 0.55, -PLAYER_RADIUS * 0.18, 2.6, 1.7, 0, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#8a5a3a'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(0, -PLAYER_RADIUS * 0.28, 3.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();

    ctx.restore();
  }

  // 투영된 항목을 화면에 그리는 공용 래퍼: 위치 이동 + 축소(scale) + 지평선 페이드
  function drawProjected(cx, cy, x, y, drawFn) {
    const p = project(x, y);
    if (!p) return null;
    const fade = Math.min(1, p.scale / 0.22);
    ctx.save();
    ctx.translate(cx + p.sx, cy + p.sy);
    ctx.scale(p.scale, p.scale);
    ctx.globalAlpha = fade;
    drawFn();
    ctx.restore();
    return p;
  }

  // ---------- 지도 ----------
  function mapMarker(mx, my, tint, size) {
    ctx.fillStyle = tint;
    ctx.strokeStyle = 'rgba(255,250,242,0.95)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(mx, my - size); ctx.lineTo(mx + size, my);
    ctx.lineTo(mx, my + size); ctx.lineTo(mx - size, my);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  // 발견하지 않은 지역은 흐리게가 아니라 완전히 가린다 - 발견의 쾌감은 거기서 나온다.
  function drawMapCircle(cx, cy, R, isFull, t) {
    const toMapX = (wx) => cx + (wx / WORLD_RADIUS) * R;
    const toMapY = (wy) => cy + (wy / WORLD_RADIUS) * R;

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(62,54,48,0.9)';
    ctx.fill();

    ctx.save();
    ctx.clip();
    ctx.drawImage(fogCanvas, cx - R, cy - R, R * 2, R * 2);
    ctx.restore();

    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,250,242,0.92)';
    ctx.lineWidth = isFull ? 3 : 2;
    ctx.stroke();

    for (const lm of landmarks) {
      if (!lm.found) continue;
      const mx = toMapX(lm.x), my = toMapY(lm.y);
      mapMarker(mx, my, lm.tint, isFull ? 7 : 4.5);
      if (isFull) {
        ctx.font = '600 13px "Gowun Dodum", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(40,34,30,0.85)';
        ctx.strokeText(lm.name, mx, my - 14);
        ctx.fillStyle = '#fffaf2';
        ctx.fillText(lm.name, mx, my - 14);
      }
    }

    // 플레이어 - 점 + 바라보는 방향
    const px = toMapX(player.x), py = toMapY(player.y);
    const fa = Math.atan2(player.facing.y, player.facing.x);
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(fa);
    ctx.fillStyle = '#ff8aa0';
    ctx.beginPath();
    const s = isFull ? 11 : 7;
    ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, s * 0.62); ctx.lineTo(-s * 0.7, -s * 0.62);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,250,242,0.95)'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  function drawMinimap(viewW, viewH, t) {
    const size = viewW < 620 ? 96 : 138;
    const margin = viewW < 620 ? 12 : 16;
    const R = size / 2;
    const cx = viewW - margin - R;
    const cy = margin + R;
    minimapHit = { cx, cy, r: R + 8 };
    drawMapCircle(cx, cy, R, false, t);
    ctx.fillStyle = 'rgba(255,250,242,0.92)';
    ctx.font = '600 10px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(isTouch ? '탭 · 지도' : 'M  지도', cx, cy + R + 5);
  }

  function drawFullMap(viewW, viewH, t) {
    ctx.save();
    ctx.fillStyle = 'rgba(38,32,28,0.55)';
    ctx.fillRect(0, 0, viewW, viewH);

    const small = viewW < 620;
    const R = small ? Math.min(viewW * 0.32, viewH * 0.30) : Math.min(viewW, viewH) * 0.35;
    const cx = viewW / 2, cy = viewH / 2 + (small ? 2 : 6);
    fullmapHit = { cx, cy, r: R + (small ? 16 : 30) };
    drawMapCircle(cx, cy, R, true, t);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fffaf2';
    if (!small) {
      ctx.font = '600 15px "Gowun Dodum", sans-serif';
      ctx.textBaseline = 'bottom';
      ctx.fillText('아스마라 전도', cx, cy - R - 16);
    }

    ctx.font = small ? '600 10px "JetBrains Mono", monospace' : '600 12px "JetBrains Mono", monospace';
    ctx.textBaseline = 'top';
    const pct = totalCells ? Math.round((exploredCount / totalCells) * 100) : 0;
    const closeHint = isTouch ? '지도 밖을 탭하면 닫힘' : 'M / ESC 닫기';
    const gap = small ? '  ·  ' : '   ·   ';
    ctx.fillText(`탐험도 ${pct}%${gap}발견 ${foundCount}/${landmarks.length}${gap}${closeHint}`, cx, cy + R + (small ? 10 : 14));
    ctx.restore();
  }

  // ---------- 게임 루프 ----------
  const DIRS = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
  function bearingLabel(x, y) {
    const dist = Math.hypot(x, y);
    if (dist < 90) return '출발점';
    let a = Math.atan2(x, -y);            // 0 = 북, 양수 = 동쪽
    if (a < 0) a += Math.PI * 2;
    return `${DIRS[Math.round(a / (Math.PI / 4)) % 8]} ${Math.round(dist)}m`;
  }

  let toastTimer = 0;
  function showToast(msg, final) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('final', !!final);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), final ? 4200 : 2800);
  }

  function checkDiscovery() {
    for (const lm of landmarks) {
      if (lm.found) continue;
      if (Math.hypot(player.x - lm.x, player.y - lm.y) > DISCOVER_R) continue;
      lm.found = true;
      foundCount++;
      if (foundCount === landmarks.length) {
        showToast('아스마라의 랜드마크를 모두 발견했습니다!', true);
      } else {
        showToast(`${withObjParticle(lm.name)} 발견했습니다`);
      }
    }
  }

  let lastTime = performance.now();
  const hudCache = { dir: null, pct: -1, found: -1 };

  function step(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    const t = now / 1000;

    // 전체 지도를 보는 동안은 이동을 멈춘다(일시정지)
    let dx = 0, dy = 0;
    if (!mapOpen) {
      if (keys.has('w') || keys.has('arrowup')) dy -= 1;
      if (keys.has('s') || keys.has('arrowdown')) dy += 1;
      if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
      if (keys.has('d') || keys.has('arrowright')) dx += 1;
      if (joyActive) { dx += joyVector.x; dy += joyVector.y; }
    }

    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }

    const speed = 200;
    const moving = dx !== 0 || dy !== 0;
    if (moving) {
      player.facing = { x: dx / (len || 1), y: dy / (len || 1) };
      tryMove(dx, dy, speed * dt);
    }

    updateExploration();
    checkDiscovery();

    const viewW = canvas.viewW || stage.clientWidth;
    const viewH = canvas.viewH || stage.clientHeight;
    const lookahead = viewH * 0.14;
    const cx = viewW / 2, cy = viewH / 2 + lookahead;

    ctx.clearRect(0, 0, viewW, viewH);
    drawSky(viewW, viewH, t);
    drawPlanetDome(cx, cy);

    // 화면 좌표 기준으로 깊이(투영된 sy) 정렬을 위해 먼저 프로젝션 계산
    const drawList = [];
    for (const pt of terrainPatches) {
      const p = project(pt.x, pt.y);
      if (p) drawList.push({ p, layer: 0, draw: () => {
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        ctx.beginPath(); ctx.ellipse(0, 0, pt.w, pt.w * 0.55, pt.angle, 0, Math.PI * 2); ctx.fill();
      }});
    }
    for (const g of grassTufts) {
      const p = project(g.x, g.y);
      if (p) drawList.push({ p, layer: 0, draw: () => {
        const sway = reduceMotion ? 0 : Math.sin(t * 1.6 + g.phase) * 0.18;
        ctx.strokeStyle = g.tone > 0.5 ? '#4aa85f' : '#e9f7d8';
        ctx.globalAlpha *= g.tone > 0.5 ? 1 : 0.75;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(g.angle + sway) * g.len, -g.len * 1.4 + Math.sin(g.angle + sway) * 2);
        ctx.stroke();
      }});
    }
    for (const tile of pathTiles) {
      const p = project(tile.x, tile.y);
      if (p) drawList.push({ p, layer: 0, draw: () => drawPathTile(tile.tone, tile.angle) });
    }

    // 지평선 아래(=layer 0)를 먼저 그린 뒤, 입체감 있는 오브젝트(layer 1)를 y-정렬해서 그린다
    drawList.sort((a, b) => a.p.sy - b.p.sy);
    for (const item of drawList) {
      ctx.save();
      ctx.translate(cx + item.p.sx, cy + item.p.sy);
      ctx.scale(item.p.scale, item.p.scale);
      ctx.globalAlpha = Math.min(1, item.p.scale / 0.22);
      item.draw();
      ctx.restore();
    }

    const solids = [];
    drawProjected(cx, cy, spring.x, spring.y, drawSpring) && solids.push(0);
    for (const o of obstacles) {
      const p = project(o.x, o.y);
      if (p) solids.push({ p, o });
    }
    for (const d of decorations) {
      const p = project(d.x, d.y);
      if (p) solids.push({ p, d });
    }
    const pSign = project(signpost.x, signpost.y);
    if (pSign) solids.push({ p: pSign, sign: true });
    for (const lm of landmarks) {
      if (!lm.height) continue;                 // 샘물은 기존 방식으로 따로 그림
      const p = projectTall(lm.x, lm.y, lm.height);
      if (p) solids.push({ p, lm });
    }
    for (const f of pathFences) {
      const p = project(f.x, f.y);
      if (p) solids.push({ p, f });
    }
    solids.sort((a, b) => (a.p ? a.p.sy : 0) - (b.p ? b.p.sy : 0));
    for (const s of solids) {
      if (!s || !s.p) continue;
      ctx.save();
      ctx.translate(cx + s.p.sx, cy + s.p.sy);
      ctx.scale(s.p.scale, s.p.scale);
      ctx.globalAlpha = Math.min(1, s.p.scale / 0.22);
      if (s.o) { s.o.type === 'tree' ? drawTree(s.o, t) : drawStone(s.o); }
      else if (s.d) { drawMushroom(s.d.seed); }
      else if (s.sign) { drawSignpost(); }
      else if (s.f) { drawFence(s.f.angle); }
      else if (s.lm) {
        // 지평선 너머면 아래쪽을 잘라서 꼭대기만 솟아 보이게 하고, 멀수록 옅게 깔린다
        if (s.p.sink > 0) {
          const top = -s.lm.height * 1.25, bottom = 16;
          const visible = (1 - s.p.sink) * (bottom - top);
          ctx.beginPath();
          ctx.rect(-220, top, 440, Math.max(0, visible));
          ctx.clip();
          ctx.globalAlpha *= 1 - s.p.sink * 0.38;
        }
        drawLandmarkBody(s.lm, t);
      }
      ctx.restore();
    }

    for (const spore of spores) {
      if (!reduceMotion) {
        spore.y -= spore.speed * dt;
        spore.x += Math.sin(t * 0.6 + spore.phase) * 4 * dt;
        if (Math.hypot(spore.x, spore.y) > HORIZON_D * 0.9) {
          const p = samplePlanetPoint(0, HORIZON_D * 0.3);
          spore.x = p.x; spore.y = p.y;
        }
      }
      drawProjected(cx, cy, spore.x, spore.y, () => {
        const twinkle = reduceMotion ? 0.6 : (Math.sin(t * 2 + spore.phase) + 1) / 2;
        ctx.globalAlpha *= 0.35 + twinkle * 0.5;
        ctx.fillStyle = '#fff7e0';
        ctx.beginPath(); ctx.arc(0, 0, spore.size, 0, Math.PI * 2); ctx.fill();
      });
    }

    ctx.save();
    ctx.translate(cx, cy);
    drawPlayer(t, moving);
    ctx.restore();

    drawMinimap(viewW, viewH, t);
    if (mapOpen) drawFullMap(viewW, viewH, t);

    const dirText = bearingLabel(player.x, player.y);
    if (dirText !== hudCache.dir) { posDirEl.textContent = dirText; hudCache.dir = dirText; }
    const pct = totalCells ? Math.round((exploredCount / totalCells) * 100) : 0;
    if (pct !== hudCache.pct) { explorePctEl.textContent = pct + '%'; hudCache.pct = pct; }
    if (foundCount !== hudCache.found) {
      foundLabelEl.textContent = `${foundCount}/${landmarks.length}`;
      hudCache.found = foundCount;
    }

    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);

  // ---- 뷰어 상태 보존 (재게시 시 플레이어 위치 유지) ----
  function snapshot() {
    return { x: player.x, y: player.y, found: landmarks.filter((l) => l.found).map((l) => l.id) };
  }
  function boot(data) {
    if (!data) return;
    if (typeof data.x === 'number' && typeof data.y === 'number') {
      player.x = data.x; player.y = data.y;
    }
    if (Array.isArray(data.found)) {
      for (const lm of landmarks) {
        if (!lm.found && data.found.indexOf(lm.id) !== -1) { lm.found = true; foundCount++; }
      }
    }
  }
  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(snapshot);
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data);
  }
})();
</script>
