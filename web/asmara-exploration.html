<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아스마라 탐사</title>
<style>
  :root{
    --bg-page:#fff2e2;
    --panel:#fffaf2;
    --panel-2:#fff4e6;
    --line:#f0d9b8;
    --text-primary:#5b4632;
    --text-muted:#a8916f;
    --accent:#ff8aa0;
    --accent-soft:rgba(255,138,160,.16);
    --accent-line:rgba(255,138,160,.4);
    --mint:#4fb787;
    --mono-num:#3f8f66;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg-page);
    color:var(--text-primary);
    font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 16px 28px;
    gap:14px;
  }

  .frame{
    width:100%;
    max-width:980px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    padding:14px 18px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
  }

  .title-block{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }

  .planet-glyph{
    width:38px;
    height:38px;
    border-radius:50%;
    flex:none;
    background:
      radial-gradient(circle at 32% 28%, #d9ffe4 0%, #9fe0a6 46%, #3f8f66 100%);
    box-shadow:0 4px 0 rgba(63,143,102,.25);
  }

  h1{
    font-family:'Black Han Sans','Gowun Dodum',sans-serif;
    font-weight:400;
    font-size:1.5rem;
    letter-spacing:.01em;
    margin:0;
    line-height:1.1;
    text-wrap:balance;
  }

  .subtitle{
    margin:2px 0 0;
    font-size:.8rem;
    color:var(--text-muted);
  }

  .phase-chip{
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-size:.68rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#c65a75;
    background:var(--accent-soft);
    border:1px solid var(--accent-line);
    border-radius:999px;
    padding:6px 12px;
    white-space:nowrap;
  }

  .stage{
    position:relative;
    width:100%;
    aspect-ratio:16/10;
    border-radius:20px;
    overflow:hidden;
    border:1px solid var(--line);
    background:linear-gradient(180deg,#5fb6ea 0%,#bfe3ff 60%,#eaf6ff 100%);
    box-shadow:0 24px 50px -28px rgba(120,90,60,.45);
    touch-action:none;
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
  }

  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    box-shadow:inset 0 0 90px 20px rgba(255,255,255,.10), inset 0 0 130px 46px rgba(40,50,30,.14);
  }

  .hint{
    position:absolute;
    top:14px;
    left:14px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    max-width:calc(100% - 28px);
  }

  kbd{
    font-family:'JetBrains Mono',monospace;
    font-size:.68rem;
    background:rgba(255,250,242,.85);
    border:1px solid rgba(91,70,50,.18);
    color:var(--text-primary);
    padding:4px 8px;
    border-radius:7px;
    backdrop-filter:blur(2px);
  }

  .joystick-zone{
    position:absolute;
    left:22px;
    bottom:22px;
    width:104px;
    height:104px;
    border-radius:50%;
    background:rgba(255,250,242,.45);
    border:1px solid rgba(91,70,50,.22);
    touch-action:none;
  }

  .joystick-zone[hidden]{display:none!important;}

  .joystick-stick{
    position:absolute;
    width:44px;
    height:44px;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%, #ffd0da, var(--accent));
    box-shadow:0 4px 10px rgba(198,90,117,.35);
  }

  footer.hud{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    padding:10px 18px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:18px;
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    color:var(--text-muted);
  }

  .hud-field{display:flex;gap:6px;align-items:baseline;}
  .hud-field b{color:var(--mono-num);font-weight:600;font-variant-numeric:tabular-nums;}

  .legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    color:var(--text-muted);
    font-size:.72rem;
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:9px;height:9px;border-radius:3px;flex:none;}

  /* 터치 기기에서는 키보드 안내가 의미 없다 (조이스틱 + 미니맵 탭으로 안내) */
  @media (pointer: coarse){
    .hint{display:none;}
  }

  .toast{
    position:absolute;
    left:50%;
    top:64px;
    transform:translate(-50%,-6px);
    padding:9px 18px;
    border-radius:999px;
    background:rgba(255,250,242,.94);
    border:1px solid var(--accent-line);
    color:var(--text-primary);
    font-size:.82rem;
    letter-spacing:.01em;
    white-space:nowrap;
    box-shadow:0 10px 24px -12px rgba(120,90,60,.5);
    opacity:0;
    pointer-events:none;
    transition:opacity .28s ease, transform .28s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast.final{background:rgba(255,238,243,.96);border-color:var(--accent);}

  @media (max-width:600px){
    h1{font-size:1.25rem;}
    .phase-chip{display:none;}
    .toast{font-size:.74rem;top:52px;padding:7px 14px;}
    .legend{display:none;}
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<div class="frame">
  <header class="top">
    <div class="title-block">
      <div class="planet-glyph" aria-hidden="true"></div>
      <div>
        <h1>아스마라 탐사</h1>
        <p class="subtitle">에버플래닛 프로토타입 · 지도를 그리며 랜드마크를 찾고, 포탈로 다음 구역까지 (구역 특색은 추후 반영 예정)</p>
      </div>
    </div>
    <span class="phase-chip">PHASE 3 · PORTAL (PROTO)</span>
  </header>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="vignette"></div>
    <div class="hint">
      <kbd>W A S D</kbd><kbd>방향키</kbd><kbd>이동</kbd><kbd>M</kbd><kbd>지도</kbd>
    </div>
    <div class="toast" id="toast"></div>
    <div class="joystick-zone" id="joyZone" hidden>
      <div class="joystick-stick" id="joyStick"></div>
    </div>
  </div>

  <footer class="hud">
    <div class="hud-field">구역 <b id="zoneLabel">초원</b></div>
    <div class="hud-field">위치 <b id="posDir">출발점</b></div>
    <div class="hud-field">탐험도 <b id="explorePct">0%</b></div>
    <div class="hud-field">발견 <b id="foundLabel">0/5</b></div>
    <div class="legend">
      <span><i class="swatch" style="background:#ff8aa0"></i>플레이어</span>
      <span><i class="swatch" style="background:#4fa066"></i>나무</span>
      <span><i class="swatch" style="background:#b9aec2"></i>바위</span>
      <span><i class="swatch" style="background:#f0b23c"></i>랜드마크</span>
      <span><i class="swatch" style="background:#c79bf0"></i>포탈</span>
    </div>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const posDirEl = document.getElementById('posDir');
  const explorePctEl = document.getElementById('explorePct');
  const foundLabelEl = document.getElementById('foundLabel');
  const zoneLabelEl = document.getElementById('zoneLabel');
  const toastEl = document.getElementById('toast');
  const joyZone = document.getElementById('joyZone');
  const joyStick = document.getElementById('joyStick');
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- 시드 고정 의사난수 ----------
  function mulberry32(seed) {
    return function() {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 균등 분포로 원형 필드 안에 점 뿌리기 (구역별 rand()에 바인딩해서 만들어 쓴다)
  function makeSamplePlanetPoint(rand) {
    return function(minR, maxR) {
      const r = Math.sqrt(rand()) * (maxR - minR) + minR;
      const a = rand() * Math.PI * 2;
      return { x: Math.cos(a) * r, y: Math.sin(a) * r };
    };
  }

  // ---------- 작은 행성 투영 ----------
  const PLANET_R = 520;
  const HORIZON_D = PLANET_R * Math.PI / 2 * 0.985;
  const PLAYER_RADIUS = 15;
  const TILT = 0.62;

  function project(x, y) {
    const relx = x - player.x, rely = y - player.y;
    const d = Math.hypot(relx, rely);
    if (d > HORIZON_D) return null;
    const angle = Math.atan2(rely, relx);
    const screenDist = PLANET_R * Math.sin(d / PLANET_R);
    const scale = Math.max(0.001, Math.cos(d / PLANET_R));
    return { sx: Math.cos(angle) * screenDist, sy: Math.sin(angle) * screenDist * TILT, scale, d };
  }

  const LM_MIN_SCALE = 0.32;
  const LM_MAX_SINK = 0.65;
  function projectTall(x, y, height) {
    const relx = x - player.x, rely = y - player.y;
    const d = Math.hypot(relx, rely);
    const extra = height * 4;
    const maxD = HORIZON_D + extra;
    if (d > maxD) return null;
    const angle = Math.atan2(rely, relx);
    const dd = Math.min(d, HORIZON_D);
    const screenDist = PLANET_R * Math.sin(dd / PLANET_R);
    const scale = Math.max(LM_MIN_SCALE, Math.cos(dd / PLANET_R));
    const raw = extra > 0 ? Math.max(0, d - HORIZON_D) / extra : 0;
    const sink = Math.min(LM_MAX_SINK, Math.pow(raw, 1.3));
    return {
      sx: Math.cos(angle) * screenDist,
      sy: Math.sin(angle) * screenDist * TILT,
      scale, d, sink
    };
  }

  function drawSinkClipped(height, sink, drawFn) {
    if (sink > 0) {
      const top = -height * 1.25, bottom = 16;
      const visible = (1 - sink) * (bottom - top);
      ctx.beginPath();
      ctx.rect(-220, top, 440, Math.max(0, visible));
      ctx.clip();
      ctx.globalAlpha *= 1 - sink * 0.38;
    }
    drawFn();
  }

  const DISCOVER_R = 120;
  const EXPLORE_R = 500;
  const CELL = 50;
  const FOG_SIZE = 600;

  function withObjParticle(name) {
    const code = name.charCodeAt(name.length - 1);
    if (code < 0xAC00 || code > 0xD7A3) return name + '를';
    return name + ((code - 0xAC00) % 28 === 0 ? '를' : '을');
  }

  function makeZone(opts) {
    const rand = mulberry32(opts.seed);
    const radius = opts.radius;
    const samplePlanetPoint = makeSamplePlanetPoint(rand);

    let pathPts = [], pathTiles = [], pathFences = [], signpost = null;
    if (opts.pathPts) {
      pathPts = opts.pathPts;
      for (let i = 0; i < pathPts.length - 1; i++) {
        const a = pathPts[i], b = pathPts[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y;
        const len = Math.hypot(dx, dy);
        const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
        const tileCount = Math.round(len / 58);
        for (let j = 0; j < tileCount; j++) {
          const t = (j + 0.5) / tileCount;
          pathTiles.push({
            x: a.x + dx * t, y: a.y + dy * t,
            angle: Math.atan2(dy, dx),
            tone: (i + j) % 2
          });
        }
        const fenceCount = Math.round(len / 150);
        for (let j = 0; j < fenceCount; j++) {
          const t = (j + 0.5) / fenceCount;
          for (const side of [1, -1]) {
            pathFences.push({
              x: a.x + dx * t + nx * 78 * side,
              y: a.y + dy * t + ny * 78 * side,
              angle: Math.atan2(dy, dx)
            });
          }
        }
      }
      signpost = { x: pathPts[pathPts.length - 1].x, y: pathPts[pathPts.length - 1].y - 30 };
    }
    function nearPath(x, y, threshold) {
      for (let i = 0; i < pathPts.length - 1; i++) {
        const a = pathPts[i], b = pathPts[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y;
        const lenSq = dx * dx + dy * dy;
        let t = lenSq > 0 ? ((x - a.x) * dx + (y - a.y) * dy) / lenSq : 0;
        t = Math.max(0, Math.min(1, t));
        const cx = a.x + dx * t, cy = a.y + dy * t;
        if (Math.hypot(x - cx, y - cy) < threshold) return true;
      }
      return false;
    }

    const obstacles = [];
    const decorations = [];

    function overlapsExisting(x, y, radius) {
      for (const o of obstacles) {
        if (Math.hypot(x - o.x, y - o.y) < radius + o.radius + 16) return true;
      }
      return false;
    }

    function scatterObstacles(minR, maxR, count) {
      for (let i = 0; i < count; i++) {
        for (let attempt = 0; attempt < 10; attempt++) {
          const p = samplePlanetPoint(minR, maxR);
          if (Math.hypot(p.x, p.y) < 170) continue;
          if (nearPath(p.x, p.y, 66)) continue;
          const isTree = rand() < 0.58;
          const radius = isTree ? 19 + rand() * 13 : 13 + rand() * 11;
          if (overlapsExisting(p.x, p.y, radius)) continue;
          obstacles.push({ type: isTree ? 'tree' : 'stone', radius, x: p.x, y: p.y, tone: rand(), sway: rand() * Math.PI * 2 });
          break;
        }
      }
    }
    scatterObstacles(0, radius - 260, opts.obstacleCore ?? 150);
    scatterObstacles(radius - 260, radius - 20, opts.obstacleEdge ?? 90);

    for (let i = 0; i < (opts.mushroomCount ?? 16); i++) {
      const p = samplePlanetPoint(0, radius - 300);
      if (Math.hypot(p.x, p.y) < 130) continue;
      decorations.push({ type: 'mushroom', x: p.x, y: p.y, seed: rand() });
    }

    const spring = opts.spring || null;

    const landmarks = (opts.landmarkDefs || []).map((l) => ({ ...l }));
    let foundCount = 0;

    for (let i = obstacles.length - 1; i >= 0; i--) {
      for (const lm of landmarks) {
        if (Math.hypot(obstacles[i].x - lm.x, obstacles[i].y - lm.y) < 150) { obstacles.splice(i, 1); break; }
      }
    }

    const GRID_N = Math.ceil((radius * 2) / CELL);
    const GRID_ORIGIN = -radius;
    const explored = new Uint8Array(GRID_N * GRID_N);
    let totalCells = 0;
    for (let gy = 0; gy < GRID_N; gy++) {
      for (let gx = 0; gx < GRID_N; gx++) {
        const wx = GRID_ORIGIN + (gx + 0.5) * CELL;
        const wy = GRID_ORIGIN + (gy + 0.5) * CELL;
        if (Math.hypot(wx, wy) <= radius) totalCells++;
      }
    }

    const FOG_SCALE = FOG_SIZE / (radius * 2);
    const fogCanvas = document.createElement('canvas');
    fogCanvas.width = FOG_SIZE; fogCanvas.height = FOG_SIZE;
    const fogCtx = fogCanvas.getContext('2d');
    fogCtx.fillStyle = '#6fbf72';

    const terrainPatches = [];
    for (let i = 0; i < (opts.terrainCount ?? 20); i++) {
      const p = samplePlanetPoint(0, radius);
      terrainPatches.push({ x: p.x, y: p.y, w: 140 + rand() * 90, angle: rand() * Math.PI });
    }
    const grassTufts = [];
    for (let i = 0; i < (opts.grassCount ?? 1400); i++) {
      const p = samplePlanetPoint(0, radius);
      grassTufts.push({ x: p.x, y: p.y, len: 4 + rand() * 6, angle: rand() * Math.PI * 2, phase: rand() * Math.PI * 2, tone: rand() });
    }
    const spores = [];
    for (let i = 0; i < (opts.sporeCount ?? 26); i++) {
      const p = samplePlanetPoint(0, HORIZON_D * 0.9);      spores.push({ x: p.x, y: p.y, speed: 5 + rand() * 8, size: 1.6 + rand() * 2.2, phase: rand() * Math.PI * 2 });
    }

    const clouds = [];
    for (let i = 0; i < (opts.cloudCount ?? 9); i++) {
      clouds.push({ x: rand() * 1.4 - 0.2, y: 0.05 + rand() * 0.32, w: 60 + rand() * 90, speed: 4 + rand() * 6, tone: rand() });
    }

    return {
      id: opts.id, name: opts.name, radius,
      rand, samplePlanetPoint,
      pathPts, pathTiles, pathFences, signpost,
      obstacles, decorations, spring,
      landmarks, foundCount,
      GRID_N, GRID_ORIGIN, explored, exploredCount: 0, totalCells, FOG_SCALE, fogCanvas, fogCtx,
      lastExploreX: Infinity, lastExploreY: Infinity,
      terrainPatches, grassTufts, spores, clouds,
      portal: opts.portal || null
    };
  }

  const zone1 = makeZone({
    id: 'zone1', name: '초원', seed: 20260913, radius: 1500,
    pathPts: [
      { x: 10, y: 10 }, { x: 150, y: -230 }, { x: 30, y: -480 },
      { x: 200, y: -740 }, { x: 90, y: -1020 }
    ],
    spring: { x: 230, y: -110, radius: 50 },
    landmarkDefs: [
      { id: 'spring',  name: '샘물 지대',   x: 230,   y: -110,  height: 0,   solid: 0,  tint: '#6ec6e8' },
      { id: 'tree',    name: '거대 고목',   x: 100,   y: -1150, height: 120, solid: 46, tint: '#3f9a63' },
      { id: 'rock',    name: '바위산',     x: 1180,  y: -200,  height: 105, solid: 52, tint: '#a99cb8' },
      { id: 'ruins',   name: '석조 유적',   x: -950,  y: 780,   height: 70,  solid: 48, tint: '#d8c9a8' },
      { id: 'crystal', name: '빛나는 결정', x: -1250, y: -350,  height: 95,  solid: 34, tint: '#c79bf0' }
    ],
    portal: { x: 650, y: 1126, height: 100, toZone: 'zone2', spawn: { x: 0, y: 120 }, triggerR: 50 }
  });

  const zone2 = makeZone({
    id: 'zone2', name: '맵2', seed: 20260915, radius: 1500,
    portal: { x: 0, y: 250, height: 100, toZone: 'zone1', spawn: { x: 650, y: 950 }, triggerR: 50 }
  });

  const zones = { zone1, zone2 };
  let currentZone = zone1;

  let transition = null;
  function startTransition(toZoneId, spawn) {
    transition = { phase: 'out', t: 0, dur: 0.35, toZoneId, spawn };
  }

  const player = { x: 0, y: 60, facing: { x: 0, y: -1 } };

  const keys = new Set();
  let mapOpen = false;
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    keys.add(k);
    if (k === 'm' && !transition) { mapOpen = !mapOpen; keys.clear(); e.preventDefault(); }
    else if (k === 'escape' && mapOpen) { mapOpen = false; }
  });
  window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

  let minimapHit = { cx: 0, cy: 0, r: 0 };
  let fullmapHit = { cx: 0, cy: 0, r: 0 };
  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    if (mapOpen) {
      if (Math.hypot(px - fullmapHit.cx, py - fullmapHit.cy) > fullmapHit.r) mapOpen = false;
    } else if (!transition && Math.hypot(px - minimapHit.cx, py - minimapHit.cy) <= minimapHit.r) {
      mapOpen = true;
    }
  });

  let joyVector = { x: 0, y: 0 };
  let joyActive = false;
  let joyPointerId = null;

  const isTouch = matchMedia('(pointer: coarse)').matches;
  if (isTouch) joyZone.hidden = false;

  function setJoyFromEvent(e) {
    const rect = joyZone.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const max = rect.width / 2;
    const dist = Math.min(Math.hypot(dx, dy), max);
    const angle = Math.atan2(dy, dx);
    dx = Math.cos(angle) * dist;
    dy = Math.sin(angle) * dist;
    joyStick.style.left = `calc(50% + ${dx}px)`;
    joyStick.style.top = `calc(50% + ${dy}px)`;
    joyVector = { x: dx / max, y: dy / max };
  }

  joyZone.addEventListener('pointerdown', (e) => {
    joyActive = true;
    joyPointerId = e.pointerId;
    joyZone.setPointerCapture(e.pointerId);
    setJoyFromEvent(e);
  });
  joyZone.addEventListener('pointermove', (e) => {
    if (!joyActive || e.pointerId !== joyPointerId) return;
    setJoyFromEvent(e);
  });
  function releaseJoy(e) {
    if (e.pointerId !== joyPointerId) return;
    joyActive = false;
    joyVector = { x: 0, y: 0 };
    joyStick.style.left = '50%';
    joyStick.style.top = '50%';
  }
  joyZone.addEventListener('pointerup', releaseJoy);
  joyZone.addEventListener('pointercancel', releaseJoy);

  function collides(x, y) {
    const z = currentZone;
    if (Math.hypot(x, y) > z.radius - PLAYER_RADIUS - 12) return true;
    for (const o of z.obstacles) {
      const solidRadius = o.type === 'tree' ? o.radius * 0.5 : o.radius * 0.82;
      if (Math.hypot(x - o.x, y - o.y) < PLAYER_RADIUS + solidRadius) return true;
    }
    for (const lm of z.landmarks) {
      if (lm.solid && Math.hypot(x - lm.x, y - lm.y) < PLAYER_RADIUS + lm.solid) return true;
    }
    return false;
  }

  function tryMove(dx, dy, dist) {
    const nx = player.x + dx * dist, ny = player.y + dy * dist;
    if (!collides(nx, ny)) { player.x = nx; player.y = ny; return; }
    if (dx && !collides(player.x + dx * dist, player.y)) { player.x += dx * dist; return; }
    if (dy && !collides(player.x, player.y + dy * dist)) { player.y += dy * dist; return; }
    const px = -dy, py = dx;
    for (const blend of [0.7, 1]) {
      for (const sign of [1, -1]) {
        const sx = dx * 0.35 + px * sign * blend;
        const sy = dy * 0.35 + py * sign * blend;
        const len = Math.hypot(sx, sy) || 1;
        const cx = player.x + (sx / len) * dist;
        const cy = player.y + (sy / len) * dist;
        if (!collides(cx, cy)) { player.x = cx; player.y = cy; return; }
      }
    }
  }

  function updateExploration() {
    const z = currentZone;
    if (Math.hypot(player.x - z.lastExploreX, player.y - z.lastExploreY) < 25) return;
    z.lastExploreX = player.x; z.lastExploreY = player.y;

    z.fogCtx.beginPath();
    z.fogCtx.arc((player.x - z.GRID_ORIGIN) * z.FOG_SCALE, (player.y - z.GRID_ORIGIN) * z.FOG_SCALE, EXPLORE_R * z.FOG_SCALE, 0, Math.PI * 2);
    z.fogCtx.fill();

    const gx0 = Math.max(0, Math.floor((player.x - EXPLORE_R - z.GRID_ORIGIN) / CELL));
    const gx1 = Math.min(z.GRID_N - 1, Math.floor((player.x + EXPLORE_R - z.GRID_ORIGIN) / CELL));
    const gy0 = Math.max(0, Math.floor((player.y - EXPLORE_R - z.GRID_ORIGIN) / CELL));
    const gy1 = Math.min(z.GRID_N - 1, Math.floor((player.y + EXPLORE_R - z.GRID_ORIGIN) / CELL));
    for (let gy = gy0; gy <= gy1; gy++) {
      for (let gx = gx0; gx <= gx1; gx++) {
        const idx = gy * z.GRID_N + gx;
        if (z.explored[idx]) continue;
        const wx = z.GRID_ORIGIN + (gx + 0.5) * CELL;
        const wy = z.GRID_ORIGIN + (gy + 0.5) * CELL;
        if (Math.hypot(wx, wy) > z.radius) continue;
        if (Math.hypot(wx - player.x, wy - player.y) > EXPLORE_R) continue;
        z.explored[idx] = 1;
        z.exploredCount++;
      }
    }
  }

  function resize() {
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    canvas.viewW = rect.width;
    canvas.viewH = rect.height;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function drawSky(viewW, viewH, t) {
    const grad = ctx.createLinearGradient(0, 0, 0, viewH);
    grad.addColorStop(0, '#5fb6ea');
    grad.addColorStop(0.6, '#bfe3ff');
    grad.addColorStop(1, '#eaf6ff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, viewW, viewH);

    for (const c of currentZone.clouds) {
      const drift = reduceMotion ? 0 : (t * c.speed) % (viewW + c.w * 3);
      const cx = ((c.x * viewW + drift) % (viewW + c.w * 3)) - c.w * 1.5;
      const cy = c.y * viewH;
      ctx.fillStyle = c.tone > 0.5 ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.ellipse(cx, cy, c.w, c.w * 0.4, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - c.w * 0.5, cy + c.w * 0.08, c.w * 0.55, c.w * 0.28, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + c.w * 0.5, cy + c.w * 0.1, c.w * 0.5, c.w * 0.26, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPlanetDome(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, TILT);
    const grad = ctx.createRadialGradient(0, -PLANET_R * 0.1, PLANET_R * 0.08, 0, 0, PLANET_R);
    grad.addColorStop(0, '#7fd48a');
    grad.addColorStop(0.55, '#5fbf5a');
    grad.addColorStop(0.86, '#4aa14f');
    grad.addColorStop(1, '#bfe3ff');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, PLANET_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSpring(spring) {
    ctx.fillStyle = '#c9a86a';

    const waterGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, spring.radius);
    waterGrad.addColorStop(0, '#dff7ff'); waterGrad.addColorStop(1, '#6ec6e8');
    ctx.fillStyle = waterGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, spring.radius * 0.9, spring.radius * 0.62, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c7c1d6';
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * spring.radius * 0.95, Math.sin(a) * spring.radius * 0.66, 8, 6, a, 0, Math.PI * 2);

  function drawTree(o, t) {

    ctx.fillStyle = o.tone > 0.5 ? '#5aba7c' : '#4fa066';
    ctx.beginPath(); ctx.arc(0, 0, o.radius, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-o.radius * 0.35, -o.radius * 0.3, o.radius * 0.65, 0, Math.PI * 2); ctx.fill();

  function drawGroundShadow(rx) {

  function drawBigTree(t) {

  function drawRockPeak() {

  function drawRuins() {
    drawGroundShadow(58);
    ctx.fillStyle = '#c7b795';
    ctx.beginPath(); ctx.ellipse(0, 4, 54, 15, 0, 0, Math.PI * 2); ctx.fill();
    const cols = [[-38, 52], [-12, 74], [16, 38], [40, 62]];
    for (const [x, h] of cols) {
      ctx.fillStyle = '#e0d2b2';

    }

  function drawCrystal(t) {
    const pulse = reduceMotion ? 0.5 : (Math.sin(t * 1.5) + 1) / 2;
    drawGroundShadow(40);
    ctx.save();
    ctx.globalAlpha *= 0.28 + pulse * 0.3;
    const glow = ctx.createRadialGradient(0, -52, 4, 0, -52, 62);
    glow.addColorStop(0, '#f0ddff'); glow.addColorStop(1, 'rgba(199,155,240,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, -52, 62, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    const shards = [[0, -104, 17], [-24, -62, 12], [22, -70, 13]];
    for (const [x, top, w] of shards) {
      ctx.fillStyle = '#b87fe6';
      ctx.beginPath();
      ctx.moveTo(x, top); ctx.lineTo(x + w, top * 0.36); ctx.lineTo(x, 8); ctx.lineTo(x - w, top * 0.36);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.42)';
      ctx.beginPath();
      ctx.moveTo(x, top); ctx.lineTo(x + w, top * 0.36); ctx.lineTo(x, top * 0.36);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawLandmarkBody(lm, t) {
    if (lm.id === 'tree') drawBigTree(t);
    else if (lm.id === 'rock') drawRockPeak();
    else if (lm.id === 'ruins') drawRuins();

  function drawPortalBody(t, locked) {
    drawGroundShadow(46);
    ctx.fillStyle = locked ? '#7a7178' : '#8f8296';
    ctx.beginPath();
    ctx.moveTo(-30, 8); ctx.lineTo(-30, -70);
    ctx.quadraticCurveTo(-30, -96, 0, -96);
    ctx.quadraticCurveTo(30, -96, 30, -70); ctx.lineTo(30, 8);
    ctx.lineTo(18, 8); ctx.lineTo(18, -68);
    ctx.quadraticCurveTo(18, -84, 0, -84);
    ctx.quadraticCurveTo(-18, -84, -18, -68); ctx.lineTo(-18, 8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.moveTo(-30, -70); ctx.quadraticCurveTo(-30, -96, 0, -96);
    ctx.lineTo(0, -84); ctx.quadraticCurveTo(-18, -84, -18, -68); ctx.closePath(); ctx.fill();

    const spin = reduceMotion || locked ? 0 : t * 1.4;
    const pulse = reduceMotion ? 0.6 : (Math.sin(t * 2) + 1) / 2;
    ctx.save();
    ctx.translate(0, -46);
    ctx.rotate(spin);
    const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 32);
    if (locked) {
      grad.addColorStop(0, '#cfc9cf');
      grad.addColorStop(0.5, '#8b8590');
      grad.addColorStop(1, 'rgba(139,133,144,0)');
      ctx.globalAlpha *= 0.4;
    } else {
      grad.addColorStop(0, '#fff2ff');
      grad.addColorStop(0.5, '#c79bf0');
      grad.addColorStop(1, 'rgba(199,155,240,0)');
      ctx.globalAlpha *= 0.65 + pulse * 0.3;
    }
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(0, 0, 30, 32, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (locked) {
      ctx.save();
      ctx.translate(0, -46);
      ctx.font = '600 15px "Gowun Dodum", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(40,34,30,0.55)';
      ctx.fillText('🔒', 0, 2);
      ctx.restore();

  function drawPlayer(t, moving) {
    const bob = reduceMotion || !moving ? 0 : Math.sin(t * 9) * 1.6;
    ctx.save();
    ctx.translate(0, bob);

    ctx.fillStyle = 'rgba(60,40,30,0.22)';

    ctx.fillStyle = '#4fb787';
    ctx.beginPath(); ctx.ellipse(0, PLAYER_RADIUS * 0.55, PLAYER_RADIUS * 0.62, PLAYER_RADIUS * 0.5, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#3f8f66';
    ctx.beginPath(); ctx.ellipse(-PLAYER_RADIUS * 0.28, PLAYER_RADIUS * 0.98, 5, 3.4, 0, 0, Math.PI * 2); ctx.fill();

    const headGrad = ctx.createRadialGradient(-5, -8, 3, 0, -2, PLAYER_RADIUS + 4);

    ctx.fillStyle = '#8a5a3a';

    const eyeOffX = player.facing.x * 1.6, eyeOffY = player.facing.y * 1.2;

    ctx.beginPath(); ctx.arc(-4 + eyeOffX, -PLAYER_RADIUS * 0.38 + eyeOffY, 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4 + eyeOffX, -PLAYER_RADIUS * 0.38 + eyeOffY, 1.7, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'rgba(255,140,150,0.55)';

    ctx.beginPath(); ctx.ellipse(PLAYER_RADIUS * 0.55, -PLAYER_RADIUS * 0.18, 2.6, 1.7, 0, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#8a5a3a'; ctx.lineWidth = 1.3;

  // 나무/랜드마크처럼 큰 오브젝트에 가려졌을 때, 플레이어가 대략 어디 있는지 보여주는
  // 점선 테두리. 실제 스프라이트 대신 단순한 캡슐 윤곽만 그려서 "숨겨졌다"는 게 분명히 읽히게 한다.
  // occluder가 주어지면 그 오브젝트의 대략적인 화면 범위(reach 박스)로 클립해서,
  // 실제로 가려진 부분에만 점선이 그려지고 캐릭터가 튀어나온 부분은 점선이 안 보이게 한다.
  function drawPlayerOutline(occluder) {
    ctx.save();
    if (occluder) {
      const { sx, sy, scale, reach } = occluder;
      const rx = Math.max(reach.w * scale, 1);
      const ry = Math.max((reach.upH + reach.downH) / 2 * scale, 1);
      const ccy = sy + (reach.downH - reach.upH) / 2 * scale;
      ctx.beginPath();
      ctx.ellipse(sx, ccy, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();
    }
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = 'rgba(255,138,160,0.18)';
    ctx.strokeStyle = 'rgba(255,138,160,0.95)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.ellipse(0, PLAYER_RADIUS * 0.45, PLAYER_RADIUS * 0.9, PLAYER_RADIUS * 1.25, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,138,160,0.95)';
    ctx.beginPath(); ctx.arc(0, -PLAYER_RADIUS * 0.45, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // 오브젝트별로 플레이어를 가릴 수 있는 대략적인 화면상 폭/위쪽/아래쪽 범위(로컬, 미스케일).
  // 각 draw*Body 함수가 실제로 그리는 모양을 대략 감싸는 값으로, 픽셀 단위로 정확할 필요는 없다.
  const LM_REACH = {
    tree:    { w: 72, upH: 115, downH: 30 },
    rock:    { w: 64, upH: 100, downH: 14 },
    ruins:   { w: 56, upH: 88,  downH: 24 },
    crystal: { w: 46, upH: 118, downH: 20 },
  };
  function objectReach(s) {
    if (s.o) {
      const r = s.o.radius;
      return s.o.type === 'tree'
        ? { w: r * 1.15, upH: r * 1.6, downH: r * 0.9 }
        : { w: r * 1.0,  upH: r * 0.9, downH: r * 0.85 };
    }
    if (s.lm) return LM_REACH[s.lm.id] || { w: 50, upH: 90, downH: 20 };
    if (s.portal) return { w: 34, upH: 100, downH: 12 };
    if (s.sign) return { w: 32, upH: 44, downH: 16 };
    if (s.d) return { w: 13, upH: 16, downH: 8 };
    return null; // spring, fence — 플레이어를 가릴 만큼 높지 않음
  }

  function drawProjected(cx, cy, x, y, drawFn) {
    const p = project(x, y);
    if (!p) return null;
    const fade = Math.min(1, p.scale / 0.22);
    ctx.save();
    ctx.translate(cx + p.sx, cy + p.sy);
    ctx.scale(p.scale, p.scale);
    ctx.globalAlpha = fade;
    drawFn();
    ctx.restore();
    return p;
  }

  function mapMarker(mx, my, tint, size) {
    ctx.fillStyle = tint;
    ctx.strokeStyle = 'rgba(255,250,242,0.95)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(mx, my - size); ctx.lineTo(mx + size, my);
    ctx.lineTo(mx, my + size); ctx.lineTo(mx - size, my);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  function drawMapCircle(cx, cy, R, isFull, t) {
    const z = currentZone;
    const toMapX = (wx) => cx + (wx / z.radius) * R;
    const toMapY = (wy) => cy + (wy / z.radius) * R;

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(62,54,48,0.9)';
    ctx.fill();

    ctx.save();
    ctx.clip();
    ctx.drawImage(z.fogCanvas, cx - R, cy - R, R * 2, R * 2);
    ctx.restore();

    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,250,242,0.92)';
    ctx.lineWidth = isFull ? 3 : 2;
    ctx.stroke();

    for (const lm of z.landmarks) {
      if (!lm.found) continue;
      const mx = toMapX(lm.x), my = toMapY(lm.y);
      mapMarker(mx, my, lm.tint, isFull ? 7 : 4.5);
      if (isFull) {
        ctx.font = '600 13px "Gowun Dodum", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(40,34,30,0.85)';
        ctx.strokeText(lm.name, mx, my - 14);
        ctx.fillStyle = '#fffaf2';
        ctx.fillText(lm.name, mx, my - 14);
      }
    }

    if (z.portal) {
      const locked = isPortalLocked(z);
      const mx = toMapX(z.portal.x), my = toMapY(z.portal.y);
      mapMarker(mx, my, locked ? '#9c94a0' : '#c79bf0', isFull ? 8 : 5);
      if (isFull) {
        ctx.font = '600 13px "Gowun Dodum", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(40,34,30,0.85)';
        const label = locked ? '포탈 🔒' : '포탈';
        ctx.strokeText(label, mx, my - 15);
        ctx.fillStyle = locked ? '#d8d2db' : '#fffaf2';
        ctx.fillText(label, mx, my - 15);
      }
    }

    const px = toMapX(player.x), py = toMapY(player.y);
    const fa = Math.atan2(player.facing.y, player.facing.x);
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(fa);
    ctx.fillStyle = '#ff8aa0';
    ctx.beginPath();
    const s = isFull ? 11 : 7;
    ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, s * 0.62); ctx.lineTo(-s * 0.7, -s * 0.62);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,250,242,0.95)'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  function drawMinimap(viewW, viewH, t) {
    const size = viewW < 620 ? 96 : 138;
    const margin = viewW < 620 ? 12 : 16;
    const R = size / 2;
    const cx = viewW - margin - R;
    const cy = margin + R;
    minimapHit = { cx, cy, r: R + 8 };
    drawMapCircle(cx, cy, R, false, t);
    ctx.fillStyle = 'rgba(255,250,242,0.92)';
    ctx.font = '600 10px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(isTouch ? '탭 · 지도' : 'M  지도', cx, cy + R + 5);

    const z = currentZone;
    if (z.landmarks.length > 0) {
      const locked = isPortalLocked(z);
      const questY = cy + R + 20;
      const label = `★ 랜드마크 ${z.foundCount}/${z.landmarks.length}`;
      ctx.font = '700 11px "Gowun Dodum", sans-serif';
      const w = ctx.measureText(label).width + 16;
      ctx.fillStyle = 'rgba(38,32,28,0.55)';
      if (ctx.roundRect) {
        ctx.beginPath(); ctx.roundRect(cx - w / 2, questY, w, 18, 9); ctx.fill();
      } else {
        ctx.fillRect(cx - w / 2, questY, w, 18);
      }
      ctx.fillStyle = z.foundCount === z.landmarks.length ? '#8ee0a8' : '#f0b23c';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, cx, questY + 9);
      if (z.portal) {
        ctx.font = '600 9px "JetBrains Mono", monospace';
        ctx.fillStyle = locked ? 'rgba(220,210,225,0.75)' : 'rgba(180,240,200,0.9)';
        ctx.textBaseline = 'top';
        ctx.fillText(locked ? '포탈 잠김 🔒' : '포탈 열림', cx, questY + 20);
      }
    }
  }

  function drawFullMap(viewW, viewH, t) {
    ctx.save();
    ctx.fillStyle = 'rgba(38,32,28,0.55)';
    ctx.fillRect(0, 0, viewW, viewH);

    const small = viewW < 620;
    const R = small ? Math.min(viewW * 0.32, viewH * 0.30) : Math.min(viewW, viewH) * 0.35;
    const cx = viewW / 2, cy = viewH / 2 + (small ? 2 : 6);
    fullmapHit = { cx, cy, r: R + (small ? 16 : 30) };
    drawMapCircle(cx, cy, R, true, t);

    const z = currentZone;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fffaf2';
    if (!small) {
      ctx.font = '600 15px "Gowun Dodum", sans-serif';
      ctx.textBaseline = 'bottom';
      ctx.fillText(`${z.name} 전도`, cx, cy - R - 16);
    }

    ctx.font = small ? '600 10px "JetBrains Mono", monospace' : '600 12px "JetBrains Mono", monospace';
    ctx.textBaseline = 'top';
    const pct = z.totalCells ? Math.round((z.exploredCount / z.totalCells) * 100) : 0;
    const closeHint = isTouch ? '지도 밖을 탭하면 닫힘' : 'M / ESC 닫기';
    const gap = small ? '  ·  ' : '   ·   ';
    let foundText = z.landmarks.length ? `발견 ${z.foundCount}/${z.landmarks.length}${gap}` : '';
    if (z.landmarks.length && z.portal) {
      foundText += (isPortalLocked(z) ? '포탈 잠김' : '포탈 열림') + gap;
    }
    ctx.fillText(`탐험도 ${pct}%${gap}${foundText}${closeHint}`, cx, cy + R + (small ? 10 : 14));
    ctx.restore();
  }

  const DIRS = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
  function bearingLabel(x, y) {
    const dist = Math.hypot(x, y);
    if (dist < 90) return '출발점';
    let a = Math.atan2(x, -y);
    if (a < 0) a += Math.PI * 2;
    return `${DIRS[Math.round(a / (Math.PI / 4)) % 8]} ${Math.round(dist)}m`;
  }

  let toastTimer = 0;
  function showToast(msg, final) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('final', !!final);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), final ? 4200 : 2800);
  }

  function isPortalLocked(z) {
    return z.landmarks.length > 0 && z.foundCount < z.landmarks.length;
  }

  function checkDiscovery() {
    const z = currentZone;
    for (const lm of z.landmarks) {
      if (lm.found) continue;
      if (Math.hypot(player.x - lm.x, player.y - lm.y) > DISCOVER_R) continue;
      lm.found = true;
      z.foundCount++;
      if (z.foundCount === z.landmarks.length) {
        const portalMsg = z.portal ? ` 포탈이 열렸습니다!` : '';
        showToast(`${z.name}의 랜드마크를 모두 발견했습니다!${portalMsg}`, true);
      } else {
        showToast(`${withObjParticle(lm.name)} 발견했습니다`);
      }
    }
  }

  let lastLockToast = -99;
  function checkPortal() {
    const z = currentZone;
    if (!z.portal || transition) return;
    if (Math.hypot(player.x - z.portal.x, player.y - z.portal.y) < z.portal.triggerR) {
      if (isPortalLocked(z)) {
        const now = performance.now() / 1000;
        if (now - lastLockToast > 3) {
          lastLockToast = now;
          showToast(`포탈이 잠겨 있습니다 — 랜드마크 ${z.foundCount}/${z.landmarks.length}를 모두 찾아야 열립니다`);
        }
        return;
      }
      startTransition(z.portal.toZone, z.portal.spawn);
    }
  }

  let lastTime = performance.now();
  const hudCache = { dir: null, pct: -1, found: -1, zone: null };

  function step(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    const t = now / 1000;

    if (transition) {
      transition.t += dt;
      if (transition.phase === 'out' && transition.t >= transition.dur) {
        currentZone = zones[transition.toZoneId];
        player.x = transition.spawn.x;
        player.y = transition.spawn.y;
        transition.phase = 'in';
        transition.t = 0;
      } else if (transition.phase === 'in' && transition.t >= transition.dur) {
        transition = null;
      }
    }

    let dx = 0, dy = 0;
    if (!mapOpen && !transition) {
      if (keys.has('w') || keys.has('arrowup')) dy -= 1;
      if (keys.has('s') || keys.has('arrowdown')) dy += 1;
      if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
      if (keys.has('d') || keys.has('arrowright')) dx += 1;
      if (joyActive) { dx += joyVector.x; dy += joyVector.y; }
    }

    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }

    const speed = 200;
    const moving = dx !== 0 || dy !== 0;
    if (moving) {
      player.facing = { x: dx / (len || 1), y: dy / (len || 1) };
      tryMove(dx, dy, speed * dt);
    }

    if (!transition) {
      updateExploration();
      checkDiscovery();
      checkPortal();
    }

    const z = currentZone;
    const viewW = canvas.viewW || stage.clientWidth;
    const viewH = canvas.viewH || stage.clientHeight;
    const lookahead = viewH * 0.14;
    const cx = viewW / 2, cy = viewH / 2 + lookahead;

    ctx.clearRect(0, 0, viewW, viewH);
    drawSky(viewW, viewH, t);
    drawPlanetDome(cx, cy);

    const drawList = [];
    for (const pt of z.terrainPatches) {
      const p = project(pt.x, pt.y);
      if (p) drawList.push({ p, layer: 0, draw: () => {
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        ctx.beginPath(); ctx.ellipse(0, 0, pt.w, pt.w * 0.55, pt.angle, 0, Math.PI * 2); ctx.fill();
      }});
    }
    for (const g of z.grassTufts) {
      const p = project(g.x, g.y);
      if (p) drawList.push({ p, layer: 0, draw: () => {
        const sway = reduceMotion ? 0 : Math.sin(t * 1.6 + g.phase) * 0.18;
        ctx.strokeStyle = g.tone > 0.5 ? '#4aa85f' : '#e9f7d8';
        ctx.globalAlpha *= g.tone > 0.5 ? 1 : 0.75;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(g.angle + sway) * g.len, -g.len * 1.4 + Math.sin(g.angle + sway) * 2);
        ctx.stroke();
      }});
    }
    for (const tile of z.pathTiles) {
      const p = project(tile.x, tile.y);
      if (p) drawList.push({ p, layer: 0, draw: () => drawPathTile(tile.tone, tile.angle) });
    }

    drawList.sort((a, b) => a.p.sy - b.p.sy);
    for (const item of drawList) {
      ctx.save();
      ctx.translate(cx + item.p.sx, cy + item.p.sy);
      ctx.scale(item.p.scale, item.p.scale);
      ctx.globalAlpha = Math.min(1, item.p.scale / 0.22);
      item.draw();
      ctx.restore();
    }

    const solids = [];
    if (z.spring) { const p = project(z.spring.x, z.spring.y); if (p) solids.push({ p, spring: z.spring }); }
    for (const o of z.obstacles) {
      const p = project(o.x, o.y);
      if (p) solids.push({ p, o });
    }
    for (const d of z.decorations) {
      const p = project(d.x, d.y);
      if (p) solids.push({ p, d });
    }
    if (z.signpost) {
      const pSign = project(z.signpost.x, z.signpost.y);
      if (pSign) solids.push({ p: pSign, sign: true });
    }
    for (const lm of z.landmarks) {
      if (!lm.height) continue;
      const p = projectTall(lm.x, lm.y, lm.height);
      if (p) solids.push({ p, lm });
    }
    if (z.portal) {
      const p = projectTall(z.portal.x, z.portal.y, z.portal.height);
      if (p) solids.push({ p, portal: z.portal });
    }
    for (const f of z.pathFences) {
      const p = project(f.x, f.y);
      if (p) solids.push({ p, f });
    }
    // 플레이어도 다른 오브젝트와 같은 화면-Y 기준으로 정렬한다 — 그래야 플레이어보다
    // 화면 아래쪽(카메라에 더 가까운)에 있는 나무/랜드마크가 플레이어를 실제로 가릴 수 있다.
    solids.push({ p: project(player.x, player.y), isPlayer: true });
    solids.sort((a, b) => (a.p ? a.p.sy : 0) - (b.p ? b.p.sy : 0));

    let occluderInfo = null;
    for (const s of solids) {
      if (s.isPlayer || !s.p) continue;
      if (s.p.sy <= 0) continue; // 플레이어보다 화면 위(더 먼 쪽)에 있는 것은 가릴 수 없다
      const reach = objectReach(s);
      if (!reach) continue;
      const scale = s.p.scale;
      if (Math.abs(s.p.sx) > reach.w * scale) continue;
      if (0 >= s.p.sy - reach.upH * scale && 0 <= s.p.sy + reach.downH * scale) {
        occluderInfo = { sx: s.p.sx, sy: s.p.sy, scale, reach };
        break;
      }
    }

    for (const s of solids) {
      if (!s || !s.p) continue;
      ctx.save();
      ctx.translate(cx + s.p.sx, cy + s.p.sy);
      ctx.scale(s.p.scale, s.p.scale);
      ctx.globalAlpha = Math.min(1, s.p.scale / 0.22);
      if (s.o) { s.o.type === 'tree' ? drawTree(s.o, t) : drawStone(s.o); }
      else if (s.d) { drawMushroom(s.d.seed); }
      else if (s.sign) { drawSignpost(); }
      else if (s.f) { drawFence(s.f.angle); }
      else if (s.spring) { drawSpring(s.spring); }
      else if (s.lm) {
        drawSinkClipped(s.lm.height, s.p.sink, () => drawLandmarkBody(s.lm, t));
      }
      else if (s.portal) {
        drawSinkClipped(s.portal.height, s.p.sink, () => drawPortalBody(t, isPortalLocked(z)));
      }
      else if (s.isPlayer) { drawPlayer(t, moving); }
      ctx.restore();
    }

    for (const spore of z.spores) {
      if (!reduceMotion) {
        spore.y -= spore.speed * dt;
        spore.x += Math.sin(t * 0.6 + spore.phase) * 4 * dt;
        if (Math.hypot(spore.x, spore.y) > HORIZON_D * 0.9) {
          const p = z.samplePlanetPoint(0, HORIZON_D * 0.3);
          spore.x = p.x; spore.y = p.y;
        }
      }
      drawProjected(cx, cy, spore.x, spore.y, () => {
        const twinkle = reduceMotion ? 0.6 : (Math.sin(t * 2 + spore.phase) + 1) / 2;
        ctx.globalAlpha *= 0.35 + twinkle * 0.5;
        ctx.fillStyle = '#fff7e0';
        ctx.beginPath(); ctx.arc(0, 0, spore.size, 0, Math.PI * 2); ctx.fill();
      });
    }

    if (occluderInfo) {
      ctx.save();
      ctx.translate(cx, cy);
      drawPlayerOutline(occluderInfo);
      ctx.restore();
    }

    drawMinimap(viewW, viewH, t);
    if (mapOpen) drawFullMap(viewW, viewH, t);

    if (transition) {
      const alpha = transition.phase === 'out'
        ? Math.min(1, transition.t / transition.dur)
        : Math.max(0, 1 - transition.t / transition.dur);
      ctx.fillStyle = `rgba(20,16,14,${alpha})`;
      ctx.fillRect(0, 0, viewW, viewH);
    }

    const dirText = bearingLabel(player.x, player.y);
    if (dirText !== hudCache.dir) { posDirEl.textContent = dirText; hudCache.dir = dirText; }
    const pct = z.totalCells ? Math.round((z.exploredCount / z.totalCells) * 100) : 0;
    if (pct !== hudCache.pct) { explorePctEl.textContent = pct + '%'; hudCache.pct = pct; }
    if (z.foundCount !== hudCache.found) {
      foundLabelEl.textContent = z.landmarks.length ? `${z.foundCount}/${z.landmarks.length}` : '-';
      hudCache.found = z.foundCount;
    }
    if (z.name !== hudCache.zone) { zoneLabelEl.textContent = z.name; hudCache.zone = z.name; }

    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);

  function snapshot() {
    const found = {};
    for (const id in zones) found[id] = zones[id].landmarks.filter((l) => l.found).map((l) => l.id);
    return { zone: currentZone.id, x: player.x, y: player.y, found };
  }
  function boot(data) {
    if (!data) return;
    if (data.zone && zones[data.zone]) currentZone = zones[data.zone];
    if (typeof data.x === 'number' && typeof data.y === 'number') {
      player.x = data.x; player.y = data.y;
    }
    if (data.found) {
      for (const id in zones) {
        const list = data.found[id];
        if (!Array.isArray(list)) continue;
        const z = zones[id];
        for (const lm of z.landmarks) {
          if (!lm.found && list.indexOf(lm.id) !== -1) { lm.found = true; z.foundCount++; }
        }
      }
    }
  }
  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(snapshot);
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data);
  }
})();
</script>
