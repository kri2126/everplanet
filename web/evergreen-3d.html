<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에버그린 탐사 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3f9df2; }
  body { font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #fff; }
  #c { display: block; width: 100%; height: 100%; }
  /* 로드맵 6 작업 E에서 원작 배치대로 다시 짤 예정 — 지금은 조작 힌트만 */
  #hint {
    position: fixed; left: 14px; top: 12px; font-size: 13px; line-height: 1.6;
    text-shadow: 0 1px 2px rgba(0,0,0,.45); opacity: .9; pointer-events: none; user-select: none;
  }
  #hint b { display: inline-block; padding: 0 6px; margin-right: 4px; border-radius: 4px;
    background: rgba(0,0,0,.35); font-weight: 600; }
  #fps { position: fixed; right: 12px; top: 10px; font: 12px/1.4 monospace; opacity: .8;
    text-shadow: 0 1px 2px rgba(0,0,0,.5); display: none; pointer-events: none; }
  #zoneName {
    position: fixed; left: 50%; top: 14%; transform: translateX(-50%);
    font-size: 30px; letter-spacing: .08em; text-shadow: 0 2px 6px rgba(0,0,0,.45);
    opacity: 0; transition: opacity .6s; pointer-events: none; white-space: nowrap;
  }
  #zoneName small { display: block; text-align: center; font-size: 14px; letter-spacing: .2em; opacity: .85; }
  /* 원형 미니맵(오른쪽 위) — 실제 지형을 위에서 본 렌더를 scissor로 그리고, 그 위에 원형 틀만 덮는다 */
  #mini { position: fixed; right: 14px; top: 14px; width: 150px; height: 150px; pointer-events: none; }
  #mini .ring { position: absolute; inset: 0; border-radius: 50%;
    box-shadow: 0 0 0 5px #c99354, 0 0 0 7px #7a5230, 0 4px 14px rgba(0,0,0,.35), inset 0 0 18px rgba(0,0,0,.35); }
  #mini canvas, #zonemap .disc canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; }
  #mini .n { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); font: 700 11px monospace; color: #fdf4de; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #mini .cap { position: absolute; left: 50%; top: 100%; margin-top: 12px; transform: translateX(-50%); white-space: nowrap;
    font-size: 11px; color: #fdf4de; background: rgba(60,40,20,.6); padding: 2px 8px; border-radius: 4px; }
  .pmark { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: translate(-50%,-50%);
    border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 13px solid #ff8aa0;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); transform-origin: 50% 60%; }
  /* M 지도: 화면 가운데 큰 원형 지도 */
  #zonemap { position: fixed; inset: 0; display: none; pointer-events: none; }
  #zonemap .dim { position: absolute; inset: 0; background: rgba(52,38,26,.58); }
  #zonemap .disc { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); border-radius: 50%;
    box-shadow: 0 0 0 7px #c99354, 0 0 0 10px #7a5230, 0 8px 30px rgba(0,0,0,.5), inset 0 0 40px rgba(0,0,0,.35); }
  #zonemap .title { position: absolute; left: 50%; transform: translateX(-50%); font: 700 16px 'Gowun Dodum', sans-serif; color: #fdf4de; text-shadow: 0 1px 3px rgba(0,0,0,.7); white-space: nowrap; }
  #zonemap .cap { position: absolute; left: 50%; transform: translateX(-50%); font: 600 12px monospace; color: #fdf4de; text-shadow: 0 1px 3px rgba(0,0,0,.7); white-space: nowrap; }
  #zonemap .lbl { position: absolute; transform: translate(-50%, -100%); font: 600 11px 'Gowun Dodum', sans-serif; color: #5b4632;
    background: rgba(255,250,240,.92); border: 1px solid rgba(180,140,100,.6); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
  #ui2d { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><b>W A S D</b>이동 <b>Space</b>점프 <b>M</b>지도 <b>M M</b>전경도</div>
<div id="fps"></div>
<div id="mini"><canvas id="miniCv" width="150" height="150"></canvas><div class="ring"></div><div class="n">N</div><div class="pmark" id="miniMark"></div><div class="cap">별내림 천문대</div></div>
<div id="zonemap"><div class="dim"></div><div class="disc" id="zoneDisc"><canvas id="zoneCv"></canvas></div><div class="title" id="zoneTitle">별내림 천문대 전도</div><div class="cap" id="zoneCap"></div><div id="zoneLabels"></div><div class="pmark" id="zoneMark" style="display:none"></div></div>
<canvas id="ui2d"></canvas>
<div id="zoneName"><small>EVERGREEN</small>에버그린 · 별내림 천문대</div>

<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────────────────────────────────────────────
// 로드맵 6 — 작업 A(3D 뼈대) + B(지형)
// A: 구체 세계 위를 치비 캐릭터가 등을 보이며 걷고 뛰고, 3인칭 카메라가 따라오고,
//    지평선이 둥글게 휘어 보이고, 나무가 툰 셰이딩+외곽선+그림자로 서 있다.
// B: §3 표의 지형(착륙 초원·돌계단·단구 야영지·해자·다리 자리·슬라임 초원·바위벽)을
//    도형의 합 하이트맵으로 세우고, 경사도로 풀/바위를 칠하고, 모래길과 물을 얹는다.
// 구조물/초목(C·D)·UI(E)·NPC/슬라임(F)·연출(G)은 이 위에 얹는다.
// ─────────────────────────────────────────────────────────────────────────────

const DEBUG = new URLSearchParams(location.search).has('debug');
const DEG = Math.PI / 180;

// §2-3 세계 규격 (임시값 — A 게시 후 눈으로 맞춰 확정)
const R = 90;                 // 구 반지름
const PLAYER_H = 1.6;         // 캐릭터 키
const WALK = 4.5;             // 걷기 속도 /s
const TURN = 10;              // 캐릭터 회전 속도 rad/s
const G = 32;                 // 중력 (법선 반대 방향)
const JUMP_V = 8.8;           // 점프 초속 → 최고 1.2, 체공 약 0.55s
// 카메라는 회전하지 않는다. 항상 북쪽을 보며 위 대각선(약 42°)에서 내려다본다.
// 캐릭터가 화면 세로의 1/7 크기로 작게 보이고, 빌보드 그림이 늘 같은 방향을 향한다.
const CAM_BACK = 15.0, CAM_UP = 12.6, CAM_LOOK_UP = 0.8, CAM_FOV = 46;   // 약 40°, 위쪽에 하늘이 살짝
const CAM_PITCH = Math.atan2(CAM_UP, CAM_BACK);
// 세계 고정 태양 방향 — 시작점(+Z) 기준 고도 약 64°. 놀이 구역(위도 0~45°) 안에서는 계속 높이 떠 있어 그림자가 짧다.
const SUN_DIR = new THREE.Vector3(0.35, 0.25, 0.9).normalize();

// 원작에서 뽑은 색 (§1-2)
const C = {
  grass: 0x7ccf3a, grassLight: 0xa8e05a, grassShade: 0x4f9e2c,
  skyTop: 0x3f9df2, skyHorizon: 0xbfe7ff,
  leaf: 0x5cc23a, leafLine: 0x2f7a22, trunk: 0x8a5a2b,
};

// ── 렌더러 / 씬 ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.autoUpdate = false;   // 프레임당 한 번만(미니맵 렌더에서 다시 안 그리게)
renderer.setClearColor(0xbfe7ff);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(C.skyHorizon, 70, 230);

const camera = new THREE.PerspectiveCamera(CAM_FOV, 1, 0.1, 800);
camera.layers.enable(1);

// ── 툰 셰이딩 재료 ───────────────────────────────────────────────────────────
// 3단 그라데이션 맵: 그늘 / 중간 / 밝음. 원작의 셀 느낌.
const gradientMap = (() => {
  // 원작은 음영이 아주 옅다 — 그늘도 밝게
  const data = new Uint8Array([
    190, 190, 190, 255,
    228, 228, 228, 255,
    255, 255, 255, 255,
  ]);
  const t = new THREE.DataTexture(data, 3, 1, THREE.RGBAFormat);
  t.minFilter = THREE.NearestFilter;
  t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
})();

function toon(color, extra = {}) {
  return new THREE.MeshToonMaterial({ color, gradientMap, ...extra });
}

// 외곽선: 뒷면을 법선 방향으로 밀어낸 두 번째 메시(inverted hull).
// 스케일이 아니라 법선 변위라 원기둥·캡슐처럼 길쭉한 형태에서도 두께가 균일하다.
// 원작의 외곽선은 검정이 아니라 그 물체의 색을 어둡게 한 얇은 선이다.
const outlineMats = new Map();
function outlineMat(thickness, colorHex) {
  const key = thickness.toFixed(3) + ':' + colorHex;
  if (outlineMats.has(key)) return outlineMats.get(key);
  const m = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.BackSide });
  m.onBeforeCompile = (s) => {
    s.vertexShader = s.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>\n transformed += normalize(normal) * ${thickness.toFixed(3)};`
    );
  };
  outlineMats.set(key, m);
  return m;
}
function darken(hex, k = 0.55) {
  const c = new THREE.Color(hex); c.multiplyScalar(k); return c.getHex();
}
function withOutline(mesh, thickness = 0.025, colorHex) {
  const base = mesh.material && mesh.material.color ? mesh.material.color.getHex() : 0x888888;
  const o = new THREE.Mesh(mesh.geometry, outlineMat(thickness, colorHex ?? darken(base)));
  o.castShadow = false; o.receiveShadow = false;
  mesh.add(o);
  return mesh;
}

// ── 손으로 칠한 듯한 질감 (캔버스로 생성) ─────────────────────────────────────
function makeTex(size, draw, repeat = 1) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  draw(cv.getContext('2d'), size);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
let texSeed = 3;
const trnd = () => (texSeed = (texSeed * 1664525 + 1013904223) >>> 0) / 4294967296;
// 풀밭: 밝은 바탕에 붓자국 같은 얼룩. 정점색(풀/모래/바위)에 곱해진다.
const grassTex = makeTex(256, (g, S) => {
  g.fillStyle = '#f4f4f4'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 260; i++) {
    const x = trnd() * S, y = trnd() * S, w = 10 + trnd() * 30, h = 4 + trnd() * 9, a = trnd() * Math.PI;
    const light = trnd() > 0.45;
    g.fillStyle = light ? `rgba(255,255,255,${0.18 + trnd() * 0.25})` : `rgba(70,120,40,${0.04 + trnd() * 0.07})`;
    // 타일이 이어지도록 네 방향으로 감아 그린다
    for (const [ox, oy] of [[0, 0], [S, 0], [-S, 0], [0, S], [0, -S]]) {
      g.save(); g.translate(x + ox, y + oy); g.rotate(a); g.beginPath(); g.ellipse(0, 0, w, h, 0, 0, Math.PI * 2); g.fill(); g.restore();
    }
  }
});
// 바위: 가로 줄무늬 (절벽면·돌계단)
const rockTex = makeTex(256, (g, S) => {
  g.fillStyle = '#efe4cf'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 46; i++) {
    const y = trnd() * S, h = 3 + trnd() * 10, x = trnd() * S, w = 50 + trnd() * 140;
    g.fillStyle = `rgba(120,85,40,${0.10 + trnd() * 0.18})`;
    for (const ox of [0, S, -S]) for (const oy of [0, S, -S]) { g.beginPath(); g.ellipse(x + ox, y + oy, w, h, 0, 0, Math.PI * 2); g.fill(); }
  }
  for (let i = 0; i < 30; i++) {
    const y = trnd() * S, x = trnd() * S, w = 20 + trnd() * 60, h = 2 + trnd() * 4;
    g.fillStyle = `rgba(255,255,255,${0.15 + trnd() * 0.2})`;
    for (const ox of [0, S, -S]) for (const oy of [0, S, -S]) { g.beginPath(); g.ellipse(x + ox, y + oy, w, h, 0, 0, Math.PI * 2); g.fill(); }
  }
});

// ── 값 노이즈 (지면 얼룩용) ──────────────────────────────────────────────────
function hash3(x, y, z) {
  let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0;
  h = (h ^ (h >> 13)) * 1274126177 | 0;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const l = (a, b, t) => a + (b - a) * t;
  return l(
    l(l(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), l(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v),
    l(l(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), l(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v),
    w);
}

// ── 구체 좌표 도우미 ─────────────────────────────────────────────────────────
// (경도, 위도)°→ 단위 방향. 착륙 초원 중심 (0°,0°)이 +Z, 북(+위도)이 +Y.
function dirFromLonLat(lonDeg, latDeg) {
  const lon = lonDeg * DEG, lat = latDeg * DEG;
  return new THREE.Vector3(Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon));
}
// 접평면으로 투영해 단위화 (구 위에서 방향 벡터를 옮길 때마다 호출)
function tangentize(v, up) {
  return v.addScaledVector(up, -v.dot(up)).normalize();
}

// ── 작업 B: 지형 — 도형의 합으로 만드는 하이트맵 ──────────────────────────────
// 모든 도형은 구 위의 각거리(°)로 정의한다. R=90이면 1° ≈ 1.57 유닛.
// §3 표: 착륙 초원(0,0) → 돌계단(0,7.6~10.9) → 단구 위 야영지(0,15.5 r8) → 나무다리(0,23.3~29.2)
//        → 슬라임 초원(위도 29~46, 경도 ±15.5) → 별 받침대(10,40). 물 수면 -2.5.
const WATER = -2.5;
const STEP_UP = 0.45;
const ss = (e0, e1, x) => { const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
function angDeg(a, b) { return Math.acos(Math.max(-1, Math.min(1, a.dot(b)))) / DEG; }

// 호(대원 조각) A→B 까지의 각거리와, 호 위 진행도 t(0~1)
function makeSeg(lon0, lat0, lon1, lat1) {
  const A = dirFromLonLat(lon0, lat0), B = dirFromLonLat(lon1, lat1);
  const n = new THREE.Vector3().crossVectors(A, B).normalize();
  const arc = angDeg(A, B), cosArc = A.dot(B);
  const proj = new THREE.Vector3();
  return {
    A, B, n, arc,
    dist(p, out) {
      const d = p.dot(n);
      proj.copy(p).addScaledVector(n, -d).normalize();
      const inside = proj.dot(A) >= cosArc - 1e-6 && proj.dot(B) >= cosArc - 1e-6;
      let t, dd;
      if (inside) { dd = Math.asin(Math.min(1, Math.abs(d))) / DEG; t = angDeg(A, proj) / arc; }
      else { const da = angDeg(p, A), db = angDeg(p, B); if (da < db) { dd = da; t = 0; } else { dd = db; t = 1; } }
      if (out) { out.t = t; out.inside = inside; }
      return dd;
    },
  };
}
// 중심에서 본 방위각(°, 북=0, 동=90)
function bearingFrom(center, p) {
  const north = tangentize(new THREE.Vector3(0, 1, 0), center);
  const east = new THREE.Vector3().crossVectors(north, center).normalize(); // 북(+Y)×위(+Z) = +X = 동
  const v = p.clone().addScaledVector(center, -p.dot(center));
  return Math.atan2(v.dot(east), v.dot(north)) / DEG;
}

const T = {
  meadow: dirFromLonLat(0, 0),
  plateau: dirFromLonLat(0, 15.5),
  stairs: makeSeg(0, 7.6, 0, 10.9),
  stairCut: makeSeg(0, 6.3, 0, 10.9),   // 단구 절벽에서 계단 통로를 깎아내는 범위
  bridge: makeSeg(0, 23.3, 0, 29.2),
  starCrater: dirFromLonLat(10, 40),
  // 바위벽(능선)
  walls: [
    makeSeg(-13, -12, 13, -12),        // 착륙 초원 남쪽
    makeSeg(-14, 46.5, 14, 46.5),      // 슬라임 초원 북쪽
    makeSeg(15.8, 30, 15.8, 46.5),     // 동쪽
    makeSeg(-15.8, 30, -15.8, 46.5),   // 서쪽
  ],
  // 모래길
  paths: [
    makeSeg(0, -1, 0, 7.6),            // 초원 → 계단 아래
    makeSeg(-5.2, 1, 0, -1),           // 데크 경사로 → 초원 중심
    makeSeg(0, 10.9, 0, 23.3),         // 단구 야영지 관통
    makeSeg(0, 29.2, 0, 38),           // 다리 건너 → 초원 안쪽
    makeSeg(0, 38, 10, 40),            // → 별 받침대
    makeSeg(0, 38, -8, 42.5),          // → 서쪽 지선
  ],
  // 걷기 판정용 구조물 (시각은 작업 C)
  deck: dirFromLonLat(-7.2, 1),        // 팔각 착륙 데크 중심, 반경 2.3°, 높이 1.2
  ramp: makeSeg(-5.0, 1, -3.4, 1),     // 데크 → 바닥 경사로
};
const _o = { t: 0, inside: false };

// 자연 굴곡(놀이 구역 밖 완만한 언덕)
function hills(p) {
  return 0.9 * vnoise(p.x * 6 + 11, p.y * 6, p.z * 6) + 0.35 * vnoise(p.x * 17, p.y * 17 + 5, p.z * 17) - 0.45;
}

function terrainH(p) {
  // 경도/위도 (놀이 구역 마스크용)
  const lat = Math.asin(Math.max(-1, Math.min(1, p.y))) / DEG;
  const lon = Math.atan2(p.x, p.z) / DEG;
  let h = hills(p);

  // 착륙 초원: 반경 11°까지 평평, 13°까지 섞임
  const dM = angDeg(p, T.meadow);
  h = lerp(h, 0.08 * vnoise(p.x * 40, p.y * 40, p.z * 40), ss(13, 11, dM));

  // 슬라임 초원: 위도 29~46, 경도 ±15.5. 남→북으로 2.5→3.5 완만 + 굴곡
  const sm = ss(28.2, 29.6, lat) * ss(47.2, 45.8, lat) * ss(17, 15.6, Math.abs(lon));
  h = lerp(h, 2.5 + ss(29, 45, lat) * 1.0 + 0.3 * vnoise(p.x * 24, p.y * 24, p.z * 24), sm);

  // 단구(야영지): 반경 8°, 절벽 가장자리 0.5°. 계단 통로 자리는 비워둔다.
  const dP = angDeg(p, T.plateau);
  const dS = T.stairs.dist(p, _o), tS = _o.t;
  const dCut = T.stairCut.dist(p, _o), cutInside = _o.inside;
  const stairCorridor = cutInside ? ss(1.5, 1.05, dCut) : 0;
  const plateauH = 2.5 * ss(8.45, 7.9, dP) * (1 - stairCorridor);
  h = Math.max(h, plateauH);

  // 물길(해자): 단구 둘레 8.2~14°, 남쪽 ±40° 방위는 제외(계단이 육지로 이어짐)
  const bear = bearingFrom(T.plateau, p);
  const southGap = 1 - ss(48, 34, Math.abs(Math.abs(bear) - 180));  // 남쪽(180°) 근처 0
  const moat = ss(8.15, 8.75, dP) * ss(14.3, 13.4, dP) * southGap;
  h = lerp(h, -4.2 + 0.4 * vnoise(p.x * 30, p.y * 30, p.z * 30), moat);

  // 돌계단: 7단, 폭 ±1.0°(약 3유닛)
  if (dS < 1.0 && tS > 0 && tS < 1) {
    const stepH = Math.floor(tS * 7.001) / 7 * 2.5;
    h = Math.max(h, stepH);
  } else if (dS < 1.5 && tS > 0 && tS < 1) {
    // 계단 옆 둔덕: 계단보다 0.6 높게 따라 올라가 낮은 벽 노릇(STEP_UP보다 높아 못 올라감)
    h = Math.max(h, Math.min(2.5, tS * 2.5 + 0.6) * ss(1.5, 1.05, dS));
  }

  // 바위벽(능선): 높이 5, 폭 ±1.4°
  for (const w of T.walls) {
    const d = w.dist(p, _o);
    if (d < 1.6) {
      const wh = 5 * ss(1.6, 0.8, d) * (0.85 + 0.3 * vnoise(p.x * 50, p.y * 50, p.z * 50));
      h = Math.max(h, wh);
    }
  }

  // 별 받침대 분화구
  const dC = angDeg(p, T.starCrater);
  if (dC < 1.6) h -= 0.45 * ss(1.5, 0.5, dC);

  return h;
}

// 모래길 마스크 0~1 (폭 ±0.55°)
function pathMask(p) {
  let m = 0;
  for (const s of T.paths) { const d = s.dist(p, _o); if (d < 0.9) m = Math.max(m, ss(0.9, 0.5, d)); }
  return m;
}

// 걷기 판정 높이: 지형 + 구조물(데크·경사로·다리)
function walkH(p) {
  let h = terrainH(p);
  const dD = angDeg(p, T.deck);
  if (dD < 2.25) h = Math.max(h, 1.2);
  const dR = T.ramp.dist(p, _o);
  if (dR < 0.55 && _o.t > 0 && _o.t < 1) h = Math.max(h, 1.2 * (1 - _o.t));
  const dB = T.bridge.dist(p, _o);
  if (dB < 0.8 && _o.t >= 0 && _o.t <= 1) h = Math.max(h, 2.5 + 0.35 * Math.sin(Math.PI * _o.t));
  return h;
}

// 오브젝트를 구 표면에 세운다: 위치 = dir*(R+h), 로컬 +Y = dir, yaw는 로컬 Y 둘레.
const _q = new THREE.Quaternion(), _y = new THREE.Vector3(0, 1, 0);
function place(obj, lonDeg, latDeg, yaw = 0, lift = 0, useWalk = false) {
  const dir = dirFromLonLat(lonDeg, latDeg);
  obj.position.copy(dir).multiplyScalar(R + (useWalk ? walkH(dir) : terrainH(dir)) + lift);
  _q.setFromUnitVectors(_y, dir);
  obj.quaternion.copy(_q).multiply(new THREE.Quaternion().setFromAxisAngle(_y, yaw));
  return obj;
}

// ── 지형 메시 ────────────────────────────────────────────────────────────────
// 놀이 구역(경도 ±28°, 위도 -20~56°)은 고해상 패치, 나머지는 저해상 구.
const PATCH = { lon0: -28, lon1: 28, lat0: -20, lat1: 56 };

function buildGrid(lon0, lon1, lat0, lat1, nLon, nLat, radiusOf, skip) {
  const verts = (nLon + 1) * (nLat + 1);
  const pos = new Float32Array(verts * 3), col = new Float32Array(verts * 3), uv = new Float32Array(verts * 2);
  const dirs = new Array(verts);
  const idx = [];
  const p = new THREE.Vector3();
  let k = 0;
  for (let j = 0; j <= nLat; j++) {
    const lat = lat0 + (lat1 - lat0) * j / nLat;
    for (let i = 0; i <= nLon; i++) {
      const lon = lon0 + (lon1 - lon0) * i / nLon;
      p.copy(dirFromLonLat(lon, lat));
      const r = radiusOf(p);
      pos[k * 3] = p.x * r; pos[k * 3 + 1] = p.y * r; pos[k * 3 + 2] = p.z * r;
      uv[k * 2] = lon * Math.cos(lat * DEG) / 2.6; uv[k * 2 + 1] = lat / 2.6;   // 질감 1장 ≈ 2.6°(약 4유닛)
      dirs[k] = p.clone();
      k++;
    }
  }
  for (let j = 0; j < nLat; j++) for (let i = 0; i < nLon; i++) {
    if (skip) {
      const lon = lon0 + (lon1 - lon0) * (i + 0.5) / nLon, lat = lat0 + (lat1 - lat0) * (j + 0.5) / nLat;
      if (skip(lon, lat)) continue;
    }
    const a = j * (nLon + 1) + i, b = a + 1, c = a + nLon + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);   // 바깥(법선이 구 중심 반대)을 보는 감기 순서
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setAttribute('rock', new THREE.BufferAttribute(new Float32Array(verts), 1));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  geo.userData.dirs = dirs;
  return geo;
}

const COL = {
  grass: new THREE.Color(C.grass), grassLight: new THREE.Color(C.grassLight), grassShade: new THREE.Color(C.grassShade),
  sand: new THREE.Color(0xe6d3a0), sandEdge: new THREE.Color(0xcdb47a),
  rock: new THREE.Color(0xd9b26f), rockDark: new THREE.Color(0xa9803f), rockLight: new THREE.Color(0xecd39a), moss: new THREE.Color(0x6fbf46),
  bed: new THREE.Color(0xc9b07a), bedDeep: new THREE.Color(0x7fb9a8),
  stone: new THREE.Color(0xd6cbb4), stoneDark: new THREE.Color(0xbfb39b),
};
function paintTerrain(geo, withPaths) {
  const pos = geo.attributes.position, nrm = geo.attributes.normal, col = geo.attributes.color, rockA = geo.attributes.rock;
  const dirs = geo.userData.dirs;
  const tmp = new THREE.Color(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    const d = dirs[i];
    n.set(nrm.getX(i), nrm.getY(i), nrm.getZ(i));
    const r = Math.hypot(pos.getX(i), pos.getY(i), pos.getZ(i));
    const h = r - R;
    const slope = 1 - Math.max(0, n.dot(d));   // 0=평지, 0.16≈33°, 0.36≈50°
    let rockK = 0;
    // 풀 + 밝은 얼룩
    const a = vnoise(d.x * 9 + 3, d.y * 9, d.z * 9) * 0.65 + vnoise(d.x * 31, d.y * 31 + 7, d.z * 31) * 0.35;
    tmp.copy(COL.grass);
    if (a > 0.58) tmp.lerp(COL.grassLight, Math.min(1, (a - 0.58) * 4));
    else if (a < 0.4) tmp.lerp(COL.grassShade, Math.min(1, (0.4 - a) * 2.5));
    // 물 바닥
    if (h < WATER + 0.9) {
      const k = ss(WATER + 0.9, WATER - 0.6, h);
      tmp.lerp(COL.bed, k);
      tmp.lerp(COL.bedDeep, ss(WATER - 0.3, WATER - 1.4, h) * 0.8);
    }
    // 모래길
    if (withPaths) {
      const m = pathMask(d);
      if (m > 0) { const edge = vnoise(d.x * 60, d.y * 60, d.z * 60); tmp.lerp(edge > 0.5 ? COL.sand : COL.sandEdge, m); }
      // 돌계단은 돌색
      const dS = T.stairs.dist(d, _o);
      if (dS < 1.0 && _o.inside) { tmp.copy(vnoise(d.x * 80, d.y * 80, d.z * 80) > 0.5 ? COL.stone : COL.stoneDark); rockK = 1; }
    }
    // 가파른 곳 = 바위 (줄무늬 + 이끼)
    if (slope > 0.10) {
      const k = ss(0.10, 0.26, slope);
      rockK = Math.max(rockK, k);
      // 층층이 쌓인 돌: 높이에 따라 밝은 층/어두운 층이 번갈아 (사진의 절벽처럼)
      const band = Math.sin(h * 3.6 + vnoise(d.x * 40, d.y * 40, d.z * 40) * 2.2);
      const rock = band > 0.25 ? COL.rockDark : (band < -0.45 ? COL.rockLight : COL.rock);
      tmp.lerp(rock, k);
      tmp.multiplyScalar(1 - 0.18 * k * ss(-0.2, 0.6, band));   // 어두운 층은 더 어둡게 — 음영
      const mossy = vnoise(d.x * 35 + 2, d.y * 35, d.z * 35);
      if (mossy > 0.5 && slope < 0.3) tmp.lerp(COL.moss, k * 0.8);
    }
    col.setXYZ(i, tmp.r, tmp.g, tmp.b);
    rockA.setX(i, rockK);
  }
  col.needsUpdate = true; rockA.needsUpdate = true;
}

const terrainMat = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true, map: grassTex });
// 정점 속성 rock(0=풀, 1=바위)으로 풀 질감과 바위 줄무늬 질감을 섞는다
terrainMat.onBeforeCompile = (sh) => {
  sh.uniforms.rockMap = { value: rockTex };
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nattribute float rock; varying float vRock;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvRock = rock;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform sampler2D rockMap; varying float vRock;')
    .replace('#include <map_fragment>', `
      vec4 grassC = texture2D( map, vMapUv );
      vec4 rockC = texture2D( rockMap, vMapUv * vec2(1.4, 2.6) );
      diffuseColor *= mix( grassC, rockC, vRock );
    `);
};
const planet = (() => {
  const inBox = (lon, lat) => lon > PATCH.lon0 + 0.5 && lon < PATCH.lon1 - 0.5 && lat > PATCH.lat0 + 0.5 && lat < PATCH.lat1 - 0.5;
  const outer = buildGrid(-180, 180, -89.5, 89.5, 160, 80, (p) => R - 0.06 + terrainH(p), inBox);
  paintTerrain(outer, false);
  const om = new THREE.Mesh(outer, terrainMat); om.receiveShadow = true; scene.add(om);

  const step = 0.15;
  const nLon = Math.round((PATCH.lon1 - PATCH.lon0) / step), nLat = Math.round((PATCH.lat1 - PATCH.lat0) / step);
  const patch = buildGrid(PATCH.lon0, PATCH.lon1, PATCH.lat0, PATCH.lat1, nLon, nLat, (p) => R + terrainH(p));
  paintTerrain(patch, true);
  const pm = new THREE.Mesh(patch, terrainMat); pm.receiveShadow = true; pm.castShadow = true; scene.add(pm);
  // 실루엣 외곽선: 같은 메시를 법선 방향으로 0.14 밀어낸 뒷면만 그린다 → 절벽 끝·단구 가장자리에 진한 선
  const hull = new THREE.Mesh(patch, outlineMat(0.14, 0x3a2f1c));
  hull.renderOrder = 1; scene.add(hull);
  const hull2 = new THREE.Mesh(outer, outlineMat(0.14, 0x3a2f1c)); scene.add(hull2);
  return pm;
})();

// ── 물 ───────────────────────────────────────────────────────────────────────
// 수면 = R+WATER 위의 패치. 정점마다 '얕음' 값을 지형 높이에서 미리 계산해 포말·색을 정한다.
const water = (() => {
  const step = 0.3;
  const nLon = Math.round((PATCH.lon1 - PATCH.lon0) / step), nLat = Math.round((PATCH.lat1 - PATCH.lat0) / step);
  const geo = buildGrid(PATCH.lon0, PATCH.lon1, PATCH.lat0, PATCH.lat1, nLon, nLat, () => R + WATER);
  const dirs = geo.userData.dirs;
  const shore = new Float32Array(dirs.length);
  for (let i = 0; i < dirs.length; i++) {
    const h = terrainH(dirs[i]);
    shore[i] = ss(WATER - 1.6, WATER + 0.25, h);   // 0 깊음 → 1 물가
  }
  geo.setAttribute('shore', new THREE.BufferAttribute(shore, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: {
      uTime: { value: 0 },
      uDeep: { value: new THREE.Color(0x3fb6f0) },
      uShallow: { value: new THREE.Color(0x7fd8f7) },
      fogColor: { value: scene.fog.color }, fogNear: { value: scene.fog.near }, fogFar: { value: scene.fog.far },
    },
    vertexShader: `
      attribute float shore;
      uniform float uTime;
      varying float vShore; varying vec3 vWorld; varying float vFogDepth;
      void main() {
        vShore = shore;
        vec3 p = position;
        float w = sin(dot(p, vec3(0.9, 1.3, 0.7)) * 1.7 + uTime * 1.6) * 0.06 + sin(dot(p, vec3(-1.1, 0.4, 1.2)) * 2.9 + uTime * 2.3) * 0.04;
        p += normal * w;
        vec4 wp = modelMatrix * vec4(p, 1.0);
        vWorld = wp.xyz;
        vec4 mv = viewMatrix * wp;
        vFogDepth = -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uDeep, uShallow, fogColor; uniform float uTime, fogNear, fogFar;
      varying float vShore; varying vec3 vWorld; varying float vFogDepth;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
        return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
      void main() {
        vec3 col = mix(uDeep, uShallow, vShore);
        // 물가 포말: 얕은 띠 + 흐르는 노이즈
        float n = noise(vWorld.xy * 2.2 + vec2(uTime * 0.35, 0.0)) * 0.6 + noise(vWorld.zx * 4.0 - vec2(0.0, uTime * 0.5)) * 0.4;
        float foam = smoothstep(0.55, 0.95, vShore) * smoothstep(0.42, 0.7, n + vShore * 0.25);
        col = mix(col, vec3(1.0), foam * 0.85);
        // 잔물결 하이라이트
        float sp = noise(vWorld.xz * 3.0 + vec2(uTime * 0.2)) ;
        col += vec3(0.10) * smoothstep(0.72, 0.9, sp);
        // 빛줄기: 비스듬한 밝은 띠 두 겹
        float ray = smoothstep(0.86, 1.0, sin((vWorld.x * 0.9 + vWorld.y * 0.35 + vWorld.z * 0.6) * 2.3 + uTime * 0.6) * 0.5 + 0.5)
                  + smoothstep(0.9, 1.0, sin((vWorld.x * 0.5 - vWorld.z * 1.1) * 3.1 - uTime * 0.45) * 0.5 + 0.5);
        col += vec3(0.85, 0.95, 1.0) * ray * 0.18 * (1.0 - vShore * 0.5);
        float alpha = mix(0.82, 0.55, vShore) + foam * 0.3;
        float f = smoothstep(fogNear, fogFar, vFogDepth);
        gl_FragColor = vec4(mix(col, fogColor, f), alpha);
      }`,
  });
  const m = new THREE.Mesh(geo, mat);
  m.renderOrder = 2;
  scene.add(m);
  return m;
})();

// ── 하늘 + 구름 ──────────────────────────────────────────────────────────────
// 카메라를 따라다니는 큰 구. 그라데이션은 세계의 "위"(플레이어 위치 법선) 기준.
const sky = (() => {
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uUp: { value: new THREE.Vector3(0, 0, 1) },
      uTop: { value: new THREE.Color(C.skyTop) },
      uHorizon: { value: new THREE.Color(C.skyHorizon) },
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = (modelMatrix * vec4(position, 1.0)).xyz - cameraPosition;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uUp, uTop, uHorizon;
      varying vec3 vDir;
      void main() {
        float t = dot(normalize(vDir), uUp);
        float k = smoothstep(-0.02, 0.55, t);
        gl_FragColor = vec4(mix(uHorizon, uTop, k), 1.0);
      }`,
  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), mat);
  m.renderOrder = -10;
  scene.add(m);
  return m;
})();

const cloudTex = (() => {
  const s = 256, cv = document.createElement('canvas'); cv.width = s; cv.height = s;
  const g = cv.getContext('2d');
  const puffs = [[128, 150, 70], [80, 160, 52], [180, 158, 56], [110, 118, 48], [150, 116, 44], [60, 172, 36], [200, 176, 34]];
  for (const [x, y, r] of puffs) {
    const rg = g.createRadialGradient(x, y, r * 0.35, x, y, r);
    rg.addColorStop(0, 'rgba(255,255,255,1)');
    rg.addColorStop(0.8, 'rgba(255,255,255,0.95)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const clouds = [];
{
  const mat = new THREE.SpriteMaterial({ map: cloudTex, transparent: true, depthWrite: false, opacity: 0.95, fog: false });
  let seed = 7;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < 160; i++) {
    const sp = new THREE.Sprite(mat);
    // 구 전체에 고르게
    const z = rnd() * 2 - 1, a = rnd() * Math.PI * 2, r = Math.sqrt(1 - z * z);
    const dir = new THREE.Vector3(r * Math.cos(a), r * Math.sin(a), z);
    const alt = 20 + rnd() * 14;
    sp.position.copy(dir).multiplyScalar(R + alt);
    const w = 9 + rnd() * 9;
    sp.scale.set(w, w * 0.55, 1);
    sp.userData = { dir, alt, drift: rnd() * Math.PI * 2 };
    sp.layers.set(1);   // 미니맵(위에서 본 지도)에는 구름을 안 그린다
    scene.add(sp); clouds.push(sp);
  }
}

// ── 빛 ──────────────────────────────────────────────────────────────────────
const hemi = new THREE.HemisphereLight(0xf2fbff, 0x9fd06a, 2.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4d6, 0.9);   // 약하게 — 그림자가 옅은 얼룩 정도로만

sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 160;
sun.shadow.camera.left = -34; sun.shadow.camera.right = 34;
sun.shadow.camera.top = 34; sun.shadow.camera.bottom = -34;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.03;

// ── 빌보드 스프라이트 — "2D 그림을 3D에서" ─────────────────────────────────
// 캐릭터·나무·덤불·꽃·버섯(이후 NPC·소품)은 캔버스에 손으로 그린 2D 그림을 판에 붙여 세운다.
// 카메라가 북쪽을 보는 고정 각도라, 판은 그 자리의 동쪽을 가로축으로, 위쪽은 카메라 쪽으로
// 살짝 기울여(원통 빌보드 + 기울기) 한 번 세워두면 된다. 매 프레임 회전 계산이 없다.
const SPRITE_TILT = 0.38;   // 카메라 내려보는 각(라디안)의 몇 %만큼 판을 눕힐지

function spriteTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  g.lineJoin = 'round'; g.lineCap = 'round';
  draw(g, w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 4;
  return t;
}
// 색 채우고 어두운 같은 계열 선으로 테두리
function blob(g, x, y, rx, ry, fill, line, lw = 3) {
  g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  g.fillStyle = fill; g.fill();

      const post = withOutline(new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.1, 0.22), postM), 0.02, 0x4e3113);

const keys = new Set();

const cam = { fwd: new THREE.Vector3(0, 1, 0) };   // 항상 그 자리의 북쪽

// ── 프레임 ───────────────────────────────────────────────────────────────────
const _up = new THREE.Vector3(), _right = new THREE.Vector3(), _dir = new THREE.Vector3();
const _m = new THREE.Matrix4(), _camPos = new THREE.Vector3(), _look = new THREE.Vector3();
const _rot = new THREE.Quaternion();
let last = performance.now(), fpsAcc = 0, fpsN = 0;
let zoneShown = false;

function rotateAround(v, axis, ang) { return v.applyQuaternion(_rot.setFromAxisAngle(axis, ang)); }

function step(dt) {
  _up.copy(player.pos).normalize();

  // 카메라는 늘 북쪽을 본다 (회전 없음)
  cam.fwd.set(0, 1, 0); tangentize(cam.fwd, _up);
  _right.crossVectors(cam.fwd, _up).normalize(); // 카메라 기준 오른쪽

  // 이동 입력 (카메라 기준)
  let ix = 0, iy = 0;
  if (keys.has('w') || keys.has('arrowup')) iy += 1;
  if (keys.has('s') || keys.has('arrowdown')) iy -= 1;
  if (keys.has('d') || keys.has('arrowright')) ix += 1;
  if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
  player.moving = (ix !== 0 || iy !== 0);
  if (player.moving) {
    _dir.copy(cam.fwd).multiplyScalar(iy).addScaledVector(_right, ix).normalize();
    // 캐릭터가 이동 방향으로 돈다
    const ang = Math.atan2(_dir.dot(_right), _dir.dot(cam.fwd)) - Math.atan2(player.fwd.dot(_right), player.fwd.dot(cam.fwd));
    let d = Math.atan2(Math.sin(ang), Math.cos(ang));
    const maxT = TURN * dt;
    d = Math.max(-maxT, Math.min(maxT, d));
    rotateAround(player.fwd, _up, -d);
    const speed = WALK * (player.inShallow ? 0.55 : 1);
    tryMove(_dir, speed * dt);
    player.walkT += dt * (player.inShallow ? 6 : 9);
  }

  // 수직: 중력 / 착지 / 내리막 붙기
  player.vz -= G * dt;
  player.z += player.vz * dt;
  _up.copy(player.pos).normalize();
  const ground = walkH(_up);
  if (player.z <= ground) { player.z = ground; player.vz = 0; player.grounded = true; }
  else if (player.grounded && player.vz <= 0 && player.z - ground < 0.5) { player.z = ground; player.vz = 0; }
  else if (player.z - ground > 0.05) player.grounded = false;
  player.pos.copy(_up).multiplyScalar(R + player.z);
  tangentize(player.fwd, _up);
  cam.fwd.set(0, 1, 0); tangentize(cam.fwd, _up);

  // 물: 얕으면 느리게, 깊으면 마지막 육지로 복귀 (로드맵 5 B 규칙 그대로)
  const th = terrainH(_up);
  const onStructure = ground > th + 0.3;
  player.inShallow = !onStructure && player.grounded && th < WATER + 0.25 && th > WATER - 0.9;
  if (!onStructure && player.grounded && th <= WATER - 0.9) {
    respawn();
  } else if (player.grounded && th > WATER + 0.3) {
    // 안전 지점은 0.8초마다 갱신 — 절벽 끝이 아니라 그 조금 전 자리로 돌아오게
    player.safeT += dt;

  }

  // 캐릭터 스프라이트: 진행 방향에 따라 뒤/앞/옆 그림, 걷는 동안 2프레임 교대
  player.mesh.position.copy(player.pos);
  orientBillboard(player.mesh, _up);
  {
    _right.crossVectors(cam.fwd, _up).normalize();
    const a = Math.atan2(player.fwd.dot(_right), player.fwd.dot(cam.fwd)) / DEG;   // 0=북(등), ±180=남(앞), +90=동
    let view = 0, flip = 1;
    if (Math.abs(a) < 50) view = 0; else if (Math.abs(a) > 130) view = 1; else { view = 2; flip = a < 0 ? -1 : 1; }
    const frame = player.moving ? (Math.floor(player.walkT / 2.4) % 2) : 0;
    charTex.offset.set((view * 2 + frame) / 6, 0);
    player.mesh.scale.x = flip;
    // 점프 중엔 살짝 위로 뜬 느낌만 (같은 그림)
  }
  // 나무는 바람에 살짝
  const tw = performance.now() * 0.0012;
  for (const t of trees) t.rotation.z = Math.sin(tw + t.userData.sway) * 0.012;

  // 카메라
  _right.crossVectors(cam.fwd, _up).normalize();
  _camPos.copy(player.pos).addScaledVector(_up, CAM_UP).addScaledVector(cam.fwd, -CAM_BACK);
  // 카메라가 지면 아래로 들어가지 않게 (작업 B에서 지형 충돌로 확장)
  const camDir = _camPos.clone().normalize();
  const camMin = R + Math.max(terrainH(camDir), WATER) + 0.9;
  if (_camPos.length() < camMin) _camPos.copy(camDir).multiplyScalar(camMin);
  camera.position.lerp(_camPos, 1 - Math.pow(0.0005, dt));
  camera.up.copy(_up);
  _look.copy(player.pos).addScaledVector(_up, CAM_LOOK_UP);
  camera.lookAt(_look);

  // 태양·그림자 프러스텀은 플레이어를 따라간다
  sun.position.copy(player.pos).addScaledVector(SUN_DIR, 70);
  sun.target.position.copy(player.pos);
  sun.target.updateMatrixWorld();

  // 하늘은 카메라 중심, 그라데이션은 "위" 기준
  sky.position.copy(camera.position);
  sky.material.uniforms.uUp.value.copy(_up);
  water.material.uniforms.uTime.value = performance.now() * 0.001;
  // 구름은 제자리에서 살짝 떠다님
  const t = performance.now() * 0.0004;
  for (const c of clouds) {
    const d = c.userData;
    c.position.copy(d.dir).multiplyScalar(R + d.alt + Math.sin(t + d.drift) * 0.8);
  }

  if (!zoneShown) { zoneShown = true; setTimeout(showZoneName, 600); }
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);

// 결정적 잡음 — 섬 윤곽이 매 프레임 흔들리지 않도록
function wob(i) {
  const s = Math.sin(i * 127.1) * 43758.5453;
  return s - Math.floor(s);
}

function drawCloudPuff(cx, cy, r, alpha) {
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  ctx.beginPath();
  ctx.ellipse(cx, cy, r, r * 0.62, 0, 0, Math.PI * 2);
  ctx.ellipse(cx - r * 0.62, cy + r * 0.12, r * 0.60, r * 0.44, 0, 0, Math.PI * 2);

function drawIslandBlob(ix, iy, iw, ih) {
  const cx = ix + iw / 2, cy = iy + ih / 2;
  const N = 22;
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const rr = 0.90 + wob(i) * 0.12;
    pts.push({ x: cx + Math.cos(a) * iw * 0.50 * rr, y: cy + Math.sin(a) * ih * 0.50 * rr });
  }
  const mid = (p, q) => ({ x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 });
  const path = () => {
    ctx.beginPath();
    const m0 = mid(pts[N - 1], pts[0]);
    ctx.moveTo(m0.x, m0.y);
    for (let i = 0; i < N; i++) {
      const cur = pts[i], nxt = pts[(i + 1) % N];
      const m = mid(cur, nxt);
      ctx.quadraticCurveTo(cur.x, cur.y, m.x, m.y);
    }
    ctx.closePath();
  };

  ctx.save();
  ctx.translate(0, ih * 0.03);
  path();
  ctx.fillStyle = 'rgba(126,178,208,0.42)';
  ctx.fill();
  ctx.restore();

  // 섬 본체
  path();
  const g = ctx.createLinearGradient(cx, cy - ih * 0.5, cx, cy + ih * 0.5);
  g.addColorStop(0, '#93dc8d');
  g.addColorStop(0.55, '#70c375');
  g.addColorStop(1, '#4f9d5c');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(66,126,78,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 중앙 산괴 — 노드와 겹치지 않도록 위쪽 가운데에 낮게
  ctx.save();
  ctx.translate(cx + iw * 0.03, cy - ih * 0.30);
  ctx.fillStyle = 'rgba(88,168,99,0.95)';
  ctx.beginPath();
  ctx.moveTo(-iw * 0.13, ih * 0.07);
  ctx.lineTo(-iw * 0.045, -ih * 0.10);
  ctx.lineTo(iw * 0.025, ih * 0.015);
  ctx.lineTo(iw * 0.085, -ih * 0.075);
  ctx.lineTo(iw * 0.155, ih * 0.07);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.30)';
  ctx.beginPath();
  ctx.moveTo(-iw * 0.045, -ih * 0.10);
  ctx.lineTo(-iw * 0.008, -ih * 0.028);
  ctx.lineTo(-iw * 0.085, -ih * 0.005);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawWorldMap(viewW, viewH, t) {

  ctx.fillStyle = 'rgba(30,26,22,0.62)';
  ctx.fillRect(0, 0, viewW, viewH);

  const small = viewW < 620;
  const pad = small ? 8 : 18;
  const PW = Math.min(viewW - pad * 2, 760);
  const PH = Math.min(viewH - pad * 2, 520);
  const px = (viewW - PW) / 2, py = (viewH - PH) / 2;
  worldMapHit = { x: px, y: py, w: PW, h: PH };

  // 양피지 패널
  ctx.save();
  ctx.shadowColor = 'rgba(40,30,20,0.45)';
  ctx.shadowBlur = 24;
  ctx.shadowOffsetY = 8;
  roundRectPath(px, py, PW, PH, small ? 12 : 18);
  const pg = ctx.createLinearGradient(px, py, px, py + PH);
  pg.addColorStop(0, '#fdf4de');
  pg.addColorStop(1, '#f2e0bb');
  ctx.fillStyle = pg;
  ctx.fill();
  ctx.restore();

  roundRectPath(px, py, PW, PH, small ? 12 : 18);
  ctx.strokeStyle = '#c9a877';
  ctx.lineWidth = small ? 2 : 3;
  ctx.stroke();

  // 패널 안쪽을 클립하고 하늘빛을 깐다
  ctx.save();
  roundRectPath(px + 4, py + 4, PW - 8, PH - 8, small ? 9 : 15);
  ctx.clip();
  const sg = ctx.createLinearGradient(px, py, px, py + PH);
  sg.addColorStop(0, 'rgba(150,205,240,0.45)');
  sg.addColorStop(1, 'rgba(198,230,245,0.30)');
  ctx.fillStyle = sg;
  ctx.fillRect(px, py, PW, PH);

  // 섬 영역 (아래쪽은 명판 자리로 비워둔다)
  const ix = px + PW * 0.13;
  const iy = py + PH * (small ? 0.12 : 0.13);
  const iw = PW * 0.74;
  const ih = PH * (small ? 0.46 : 0.64);

  drawIslandBlob(ix, iy, iw, ih);

  // 경로 — 원작 진행 순서대로 잇는다
  const pt = (a) => ({ x: ix + a.x * iw, y: iy + a.y * ih });
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = 0; i < WORLD_AREAS.length - 1; i++) {
    const A = pt(WORLD_AREAS[i]), B = pt(WORLD_AREAS[i + 1]);
    const open = WORLD_AREAS[i].status !== 'planned' && WORLD_AREAS[i + 1].status !== 'planned';
    ctx.save();
    ctx.setLineDash(open ? [] : [5, 7]);
    ctx.strokeStyle = open ? 'rgba(232,206,150,0.95)' : 'rgba(120,110,90,0.38)';
    ctx.lineWidth = open ? (small ? 5 : 7) : (small ? 2 : 3);
    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    const nx = -(B.y - A.y), ny = (B.x - A.x);
    const nl = Math.hypot(nx, ny) || 1;
    const bend = (i % 2 ? 1 : -1) * Math.min(26, nl * 0.16);
    ctx.quadraticCurveTo(mx + (nx / nl) * bend, my + (ny / nl) * bend, B.x, B.y);
    ctx.stroke();
    ctx.restore();
  }

  // 구름 테두리 — 패널 네 변을 따라 둘러 액자처럼
  const nC = small ? 16 : 22;
  const perim = 2 * (PW + PH);
  for (let i = 0; i < nC; i++) {
    const d = ((i + wob(i) * 0.6) / nC) * perim;
    let cxp, cyp;
    if (d < PW)                    { cxp = px + d;                 cyp = py; }
    else if (d < PW + PH)          { cxp = px + PW;                cyp = py + (d - PW); }
    else if (d < 2 * PW + PH)      { cxp = px + PW - (d - PW - PH); cyp = py + PH; }
    else                           { cxp = px;                     cyp = py + PH - (d - 2 * PW - PH); }
    const inward = (small ? 8 : 14) + wob(i + 5) * (small ? 10 : 18);
    cxp += (px + PW / 2 - cxp) * (inward / Math.max(PW, PH));
    cyp += (py + PH / 2 - cyp) * (inward / Math.max(PW, PH));
    drawCloudPuff(cxp, cyp, (small ? 15 : 24) * (0.72 + wob(i + 3) * 0.55), 0.92);
  }

  // 지역 노드
  ctx.textAlign = 'center';
  for (const a of WORLD_AREAS) {
    const p = pt(a);
    const cur = a.status === 'current';
    const planned = a.status === 'planned';
    const r = small ? 9 : 12;

    // 그림자
    ctx.fillStyle = 'rgba(60,70,50,0.22)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + r * 0.72, r * 0.95, r * 0.40, 0, 0, Math.PI * 2);
    ctx.fill();

    // 표식
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = planned ? '#cbbfa6' : (cur ? '#ff8aa0' : '#ffd166');
    ctx.fill();
    ctx.strokeStyle = planned ? 'rgba(110,100,85,0.5)' : 'rgba(120,80,60,0.75)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 현재 위치는 맥동하는 고리로 강조
    if (cur) {
      const pulse = 1 + Math.sin(t * 3) * 0.16;
      ctx.strokeStyle = 'rgba(255,138,160,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 1.75 * pulse, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 번호
    ctx.fillStyle = planned ? 'rgba(90,80,65,0.75)' : '#5b4632';
    ctx.font = `700 ${small ? 9 : 11}px "JetBrains Mono", monospace`;
    ctx.textBaseline = 'middle';
    ctx.fillText(String(a.n), p.x, p.y + 0.5);

    // 이름표 — 좁은 화면에서는 아래 범례가 이름을 대신한다
    if (small) continue;
    const label = planned ? `${a.name} 🔒` : a.name;
    ctx.font = `600 ${small ? 9 : 11}px "Gowun Dodum", sans-serif`;
    ctx.textBaseline = 'top';
    const lw = ctx.measureText(label).width + (small ? 8 : 12);
    const ly = p.y + r + (small ? 3 : 5);
    roundRectPath(p.x - lw / 2, ly, lw, small ? 14 : 17, 5);
    ctx.fillStyle = planned ? 'rgba(255,250,240,0.72)' : 'rgba(255,250,240,0.95)';
    ctx.fill();
    ctx.strokeStyle = planned ? 'rgba(150,140,120,0.35)' : 'rgba(180,140,100,0.55)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = planned ? '#8b8067' : '#5b4632';
    ctx.fillText(label, p.x, ly + (small ? 2 : 3));
  }
  ctx.restore();

  // 좁은 화면 범례 — 번호 ↔ 지역 이름 (2열)
  if (small) {
    const lx = px + PW * 0.06;
    const lyTop = iy + ih + 4;
    const colW = (PW * 0.88) / 2;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '600 9px "Gowun Dodum", sans-serif';
    WORLD_AREAS.forEach((a, i) => {
      const col = i % 2, row = (i / 2) | 0;
      const ex = lx + col * colW;
      const ey = lyTop + row * 12 + 5;
      const planned = a.status === 'planned';
      ctx.beginPath();
      ctx.arc(ex + 5, ey, 5, 0, Math.PI * 2);
      ctx.fillStyle = planned ? '#cbbfa6' : (a.status === 'current' ? '#ff8aa0' : '#ffd166');
      ctx.fill();
      ctx.fillStyle = '#5b4632';
      ctx.font = '700 7px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(String(a.n), ex + 5, ey + 0.5);
      ctx.textAlign = 'left';
      ctx.font = '600 9px "Gowun Dodum", sans-serif';
      ctx.fillStyle = planned ? 'rgba(110,100,82,0.85)' : '#5b4632';
      ctx.fillText(planned ? `${a.name} 🔒` : a.name, ex + 13, ey);
    });
    ctx.textAlign = 'center';
  }

  // 나무 명판 — "에버그린" (좁은 화면에서는 아래 한 줄이 대신한다)
  if (!small) {
  const plateW = 168;
  const plateH = 34;
  const plx = px + PW / 2 - plateW / 2;
  const ply = py + PH - plateH - 30;
  ctx.save();
  ctx.shadowColor = 'rgba(60,40,20,0.35)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 3;
  roundRectPath(plx, ply, plateW, plateH, 8);
  const wg = ctx.createLinearGradient(plx, ply, plx, ply + plateH);
  wg.addColorStop(0, '#e2b877');
  wg.addColorStop(1, '#c99354');
  ctx.fillStyle = wg;
  ctx.fill();
  ctx.restore();
  roundRectPath(plx, ply, plateW, plateH, 8);
  ctx.strokeStyle = '#a97a4a';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#5b3a1c';
  ctx.font = `700 ${small ? 12 : 18}px "Black Han Sans", "Gowun Dodum", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('에버그린', px + PW / 2, ply + plateH / 2 + 1);
  }

  // 상단 제목 · 하단 안내
  // 한 줄 캡션 — 제목·진행도·안내를 모아 패널 맨 아래에 둔다.
  // (상단에 두면 HUD 조작 칩과, 명판 옆에 두면 명판과 겹치는 창 비율이 있다)
  const doneN = WORLD_AREAS.filter(a => a.status !== 'planned').length;
  const titleTxt = `에버그린 전경도  ·  구현 ${doneN}/${WORLD_AREAS.length}`;
  const hint = isTouch ? '바깥을 탭하면 닫힘' : 'M / ESC 닫기';
  const lockTxt = small ? '🔒 미구현' : '🔒 표시는 아직 만들지 않은 지역';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.font = `600 ${small ? 8 : 11}px "JetBrains Mono", monospace`;
  ctx.fillStyle = 'rgba(91,70,50,0.85)';
  ctx.fillText(`${titleTxt}  ·  ${lockTxt}  ·  ${hint}`, px + PW / 2, py + PH - (small ? 5 : 9));
  ctx.restore();
}


// ── 디버그 훅 (?debug 에서만) — Playwright 검증용 ─────────────────────────────
if (DEBUG) {
  window.__dbg = {
    THREE, scene, camera, renderer, player, cam, trees, R, WATER,
    terrainH, walkH, pathMask, dirFromLonLat, angDeg, T, canStand,
    setLonLat(lon, lat) {
      const d = dirFromLonLat(lon, lat);
      player.pos.copy(d).multiplyScalar(R + walkH(d)); player.z = walkH(d); player.vz = 0; player.grounded = true;
      tangentize(player.fwd, d); tangentize(cam.fwd, d);
      camera.position.copy(player.pos).addScaledVector(d, CAM_UP).addScaledVector(cam.fwd, -CAM_BACK);
    },
    lonLat() {
      const d = player.pos.clone().normalize();
      return { lon: Math.atan2(d.x, d.z) / DEG, lat: Math.asin(Math.max(-1, Math.min(1, d.y))) / DEG, z: player.z };
    },
    press(k, on) { on ? keys.add(k) : keys.delete(k); },
    setMap(v) { mapView = v; },
    stepN(n, dt = 1 / 60) { for (let i = 0; i < n; i++) step(dt); },
    jump() { if (player.grounded) { player.vz = JUMP_V; player.grounded = false; } },
  };
}
</script>
